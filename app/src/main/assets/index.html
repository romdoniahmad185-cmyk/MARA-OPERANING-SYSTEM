<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">
    <title>MARA Status Bar</title>
<style>
html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}

.mara-iframe {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100vw;
    height: 100vh;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    z-index: 1;
}

.mara-header {
    top: 0;
}
</style>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<iframe
    class="mara-iframe"
    src="ux/lock-screen.html"
    frameborder="0">
</iframe>

<div class="mara-header">

    <div class="clock" id="clock">
        00:00
    </div>

    <div class="battery">

        <span id="battery-percent">
            --%
        </span>

        <div class="battery-icon">
            <div
                class="battery-level"
                id="battery-level">
            </div>
        </div>

    </div>

</div>
  <div id="controlCenterOverlay">
    <iframe
     id="mara-screen-frame"
        frameborder="0">
    </iframe>

</div>
<script>

/* =====================================================
   MARA OS — BUILD LOADER
===================================================== */

const MARABuildLoader = {

    async getActiveBuild() {

        /*
         * Untuk prototype awal,
         * sementara kita gunakan ID build.
         *
         * Nanti bagian ini membaca IndexedDB.
         */

        return "102";

    },


    async loadLockScreen() {

        const build =
            await this.getActiveBuild();

        const frame =
            document.getElementById(
                "mara-screen-frame"
            );

        if (!frame) {

            console.error(
                "[MARA BUILD] iframe tidak ditemukan."
            );

            return;

        }

        frame.src =
            `../ux/build/${build}/lock-screen.html`;


        console.log(
            "[MARA BUILD] Lock Screen:",
            build
        );

    }

};


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        MARABuildLoader.loadLockScreen();

    }
);
</script>
  <!-- CONTROL CENTER OVERLAY -->
  <script src="script.js"></script>
   <script src="./engine-single.js"></script>

</body>
</html>
