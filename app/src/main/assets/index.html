<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>MARA OS</title>


    <style>

        /* =====================================================
           MARA OS — INDEX RUNTIME v3
           ===================================================== */

        :root {
            --mara-black: #000;
        }


        /* =====================================================
           GLOBAL
           ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            position: fixed;

            inset: 0;

            background:
                var(--mara-black);

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           MAIN MARA OS FRAME
           ===================================================== */

        .mara-iframe {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            z-index: 1;

            background:
                #000;

        }


        /* =====================================================
           INTRO OVERLAY
           ===================================================== */

        #mara-intro-overlay {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 999999;

            background:
                #000;

            overflow: hidden;

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        #mara-intro-overlay.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity .35s ease,
                visibility .35s ease;

        }


        /* =====================================================
           INTRO FRAME
           ===================================================== */

        #mara-intro-frame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

            background:
                #000;

        }


        /* =====================================================
           STATUS BAR
           ===================================================== */

        .mara-header {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

        }


        /* =====================================================
           CONTROL CENTER
           ===================================================== */

        #controlCenterOverlay {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .45
                );

        }


        #controlCenterFrame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

        }


        /* =====================================================
           SAFE AREA
           ===================================================== */

        @supports (
            padding:
            env(safe-area-inset-top)
        ) {

            .mara-header {

                padding-top:
                    env(
                        safe-area-inset-top
                    );

            }

        }

    </style>


    <!-- =====================================================
         STATUS BAR
    ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================================
     MAIN MARA OS FRAME
========================================================= -->

<iframe
    class="mara-iframe"
    id="mara-main-frame"
    frameborder="0"
    title="MARA OS Main">
</iframe>


<!-- =========================================================
     INTRO OVERLAY
========================================================= -->

<div
    id="mara-intro-overlay"
>

    <iframe
        id="mara-intro-frame"
        src="ux/intro.html"
        frameborder="0"
        title="MARA OS Intro">
    </iframe>

</div>


<!-- =========================================================
     STATUS BAR
========================================================= -->

<div class="mara-header">

    <div
        class="clock"
        id="clock"
    >
        00:00
    </div>


    <div class="battery">

        <span id="battery-percent">
            --%
        </span>


        <div class="battery-icon">

            <div
                class="battery-level"
                id="battery-level">
            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     CONTROL CENTER
========================================================= -->

<div
    id="controlCenterOverlay"
>

    <iframe
        id="controlCenterFrame"
        src="ux/control-center.html"
        frameborder="0"
        title="MARA Control Center">
    </iframe>

</div>


<!-- =========================================================
     CORE
========================================================= -->

<script src="script.js"></script>

<script src="engine-single.js"></script>

<script src="ux/build.js"></script>


<script>

(() => {

    "use strict";


    /* =========================================================
       MARA OS — INDEX RUNTIME v3
       =========================================================

       INDEX BUKAN:

       ✗ updater
       ✗ downloader
       ✗ installer
       ✗ verifier
       ✗ ACTIVE_BUILD manager

       INDEX ADALAH:

       ✓ boot orchestrator
       ✓ engine bridge
       ✓ intro bridge
       ✓ build bridge
       ✓ main frame bridge
       ✓ runtime state coordinator

    ========================================================= */


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const introOverlay =
        document.getElementById(
            "mara-intro-overlay"
        );


    const introFrame =
        document.getElementById(
            "mara-intro-frame"
        );


    const mainFrame =
        document.getElementById(
            "mara-main-frame"
        );


    const controlCenterOverlay =
        document.getElementById(
            "controlCenterOverlay"
        );


    /* =========================================================
       INDEX STATE
    ========================================================= */

    const STATE = {

        phase:
            "BOOTING",

        indexReady:
            false,

        introLoaded:
            false,

        introReady:
            false,

        introFinished:
            false,

        overlayClosed:
            false,

        engineAvailable:
            false,

        engineReady:
            false,

        engineWorking:
            false,

        engineState:
            "UNKNOWN",

        engineProgress:
            0,

        engineError:
            null,

        buildAvailable:
            false,

        buildStarting:
            false,

        buildReady:
            false,

        buildError:
            null,

        bootRequested:
            false,

        bootCompleted:
            false,

        mainFrameLoaded:
            false,

        startedAt:
            Date.now(),

        readyAt:
            null

    };


    /* =========================================================
       LOGGING
    ========================================================= */

    function log(...args) {

        console.log(
            "[MARA INDEX]",
            ...args
        );

    }


    function warn(...args) {

        console.warn(
            "[MARA INDEX]",
            ...args
        );

    }


    function error(...args) {

        console.error(
            "[MARA INDEX]",
            ...args
        );

    }


    /* =========================================================
       EVENT DISPATCH
    ========================================================= */

    function emit(
        type,
        detail = {}
    ) {

        try {

            window.dispatchEvent(
                new CustomEvent(
                    type,
                    {
                        detail
                    }
                )
            );

        } catch (err) {

            warn(
                "Gagal dispatch event:",
                type,
                err
            );

        }

    }


    /* =========================================================
       INTRO MESSAGE
    ========================================================= */

    function sendToIntro(
        type,
        data = {}
    ) {

        if (
            !introFrame ||
            !introFrame.contentWindow
        ) {

            return false;

        }


        try {

            introFrame.contentWindow.postMessage(
                {
                    type,
                    ...data
                },
                "*"
            );


            return true;

        } catch (err) {

            warn(
                "Gagal mengirim ke intro:",
                err
            );


            return false;

        }

    }


    /* =========================================================
       BUILD EVENT BRIDGE
    ========================================================= */

    function sendToBuild(
        type,
        data = {}
    ) {

        emit(
            type,
            data
        );

    }


    /* =========================================================
       GET ENGINE
    ========================================================= */

    function getEngine() {

        return (
            window.MARAEngineSingle ||
            window.MARAEngine ||
            window.MARA_ENGINE ||
            null
        );

    }


    /* =========================================================
       GET BUILD
    ========================================================= */

    function getBuild() {

        return (
            window.MARABuild ||
            window.MARA_BUILD_RUNTIME ||
            null
        );

    }


    /* =========================================================
       NORMALIZE ENGINE STATE
    ========================================================= */

    function normalizeEngineState(
        value
    ) {

        return String(
            value ||
            "UNKNOWN"
        )
            .trim()
            .toUpperCase();

    }


    /* =========================================================
       ENGINE STATE APPLY
    ========================================================= */

    function applyEngineState(
        data = {}
    ) {

        if (
            !data ||
            typeof data !==
                "object"
        ) {

            return;

        }


        let source =
            data;


        /*
         * Beberapa engine mengirim:
         *
         * {
         *     state: {
         *         state: "READY",
         *         progress: 100
         *     }
         * }
         */

        if (
            data.state &&
            typeof data.state ===
                "object"
        ) {

            source =
                {
                    ...data,
                    ...data.state
                };

        }


        const state =
            normalizeEngineState(
                source.state ||
                source.status
            );


        const numericProgress =
            Number(
                source.progress
            );


        STATE.engineState =
            state;


        if (
            Number.isFinite(
                numericProgress
            )
        ) {

            STATE.engineProgress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        numericProgress
                    )
                );

        }


        STATE.engineReady =
            state === "READY";


        STATE.engineWorking =
            [
                "STARTING",
                "CHECKING",
                "CHECKING_UPDATE",
                "DOWNLOADING",
                "INSTALLING",
                "INSTALL",
                "VERIFYING",
                "VERIFY",
                "UPGRADING",
                "PROCESSING",
                "UPDATING",
                "COMMITTING"
            ].includes(
                state
            );


        STATE.engineError =
            source.error ||
            source.message ||
            null;


        if (
            STATE.engineReady
        ) {

            STATE.engineProgress =
                100;

        }


        if (
            STATE.engineWorking
        ) {

            STATE.phase =
                "ENGINE_WORKING";

        }


        if (
            STATE.engineReady &&
            !STATE.bootRequested
        ) {

            STATE.phase =
                "ENGINE_READY";

        }


        sendToIntro(
            "MARA_ENGINE_STATE",
            {

                state:
                    STATE.engineState,

                progress:
                    STATE.engineProgress,

                working:
                    STATE.engineWorking,

                ready:
                    STATE.engineReady,

                error:
                    STATE.engineError

            }
        );


        emit(
            "MARA_INDEX_ENGINE_STATE",
            {

                state:
                    STATE.engineState,

                progress:
                    STATE.engineProgress,

                working:
                    STATE.engineWorking,

                ready:
                    STATE.engineReady,

                error:
                    STATE.engineError

            }
        );


        log(
            "ENGINE STATE:",
            STATE.engineState,
            STATE.engineProgress + "%"
        );

    }


    /* =========================================================
       SYNC ENGINE DIRECTLY
    ========================================================= */

    function syncEngine() {

        const engine =
            getEngine();


        if (
            !engine
        ) {

            STATE.engineAvailable =
                false;


            return false;

        }


        STATE.engineAvailable =
            true;


        try {

            if (
                typeof engine.getState ===
                    "function"
            ) {

                const state =
                    engine.getState();


                if (
                    state
                ) {

                    applyEngineState(
                        state
                    );

                }

            }

            else if (
                engine.state
            ) {

                applyEngineState(
                    engine.state
                );

            }


            return true;

        } catch (err) {

            warn(
                "Engine state sync gagal:",
                err
            );


            return false;

        }

    }


    /* =========================================================
       ENGINE MESSAGE LISTENER
    ========================================================= */

    function handleEngineMessage(
        event
    ) {

        const data =
            event.data;


        if (
            !data ||
            typeof data !==
                "object"
        ) {

            return;

        }


        if (
            data.type ===
            "MARA_ENGINE_STATE"
        ) {

            applyEngineState(
                data
            );

            return;

        }


        const aliases = {

            MARA_ENGINE_STARTING:
                "STARTING",

            MARA_ENGINE_CHECKING:
                "CHECKING",

            MARA_ENGINE_CHECKING_UPDATE:
                "CHECKING_UPDATE",

            MARA_ENGINE_DOWNLOADING:
                "DOWNLOADING",

            MARA_ENGINE_DOWNLOADED:
                "DOWNLOADED",

            MARA_ENGINE_INSTALLING:
                "INSTALLING",

            MARA_ENGINE_INSTALL:
                "INSTALL",

            MARA_ENGINE_VERIFYING:
                "VERIFYING",

            MARA_ENGINE_VERIFY:
                "VERIFY",

            MARA_ENGINE_UPGRADING:
                "UPGRADING",

            MARA_ENGINE_PROCESSING:
                "PROCESSING",

            MARA_ENGINE_READY:
                "READY",

            MARA_ENGINE_IDLE:
                "IDLE",

            MARA_ENGINE_ERROR:
                "ERROR"

        };


        const mapped =
            aliases[data.type];


        if (
            mapped
        ) {

            applyEngineState(
                {
                    ...data,
                    state:
                        mapped
                }
            );

        }

    }


    window.addEventListener(
        "message",
        handleEngineMessage
    );


    /* =========================================================
       DIRECT ENGINE STATE EVENT
    ========================================================= */

    window.addEventListener(
        "MARA_ENGINE_STATE",
        event => {

            applyEngineState(
                event.detail || {}
            );

        }
    );


    /* =========================================================
       ENGINE CUSTOM EVENTS
    ========================================================= */

    const ENGINE_EVENTS = {

        MARA_ENGINE_STARTING:
            "STARTING",

        MARA_ENGINE_CHECKING:
            "CHECKING",

        MARA_ENGINE_CHECKING_UPDATE:
            "CHECKING_UPDATE",

        MARA_ENGINE_DOWNLOADING:
            "DOWNLOADING",

        MARA_ENGINE_DOWNLOADED:
            "DOWNLOADED",

        MARA_ENGINE_INSTALLING:
            "INSTALLING",

        MARA_ENGINE_INSTALL:
            "INSTALL",

        MARA_ENGINE_VERIFYING:
            "VERIFYING",

        MARA_ENGINE_VERIFY:
            "VERIFY",

        MARA_ENGINE_UPGRADING:
            "UPGRADING",

        MARA_ENGINE_PROCESSING:
            "PROCESSING",

        MARA_ENGINE_READY:
            "READY",

        MARA_ENGINE_IDLE:
            "IDLE",

        MARA_ENGINE_ERROR:
            "ERROR"

    };


    Object.entries(
        ENGINE_EVENTS
    ).forEach(
        ([eventName, state]) => {

            window.addEventListener(
                eventName,
                event => {

                    applyEngineState(
                        {
                            ...(event.detail || {}),
                            state
                        }
                    );

                }
            );

        }
    );


    /* =========================================================
       CONNECT ENGINE API
    ========================================================= */

    function connectEngine() {

        const engine =
            getEngine();


        if (
            !engine
        ) {

            STATE.engineAvailable =
                false;


            warn(
                "MARAEngineSingle belum tersedia."
            );


            sendToIntro(
                "MARA_ENGINE_UNAVAILABLE"
            );


            return false;

        }


        STATE.engineAvailable =
            true;


        log(
            "ENGINE CONNECTED."
        );


        if (
            typeof engine.on ===
                "function"
        ) {

            /*
             * READY
             */

            engine.on(
                "ready",
                data => {

                    applyEngineState(
                        {
                            state:
                                "READY",

                            progress:
                                100,

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            /*
             * UPDATE START
             */

            engine.on(
                "update:start",
                data => {

                    applyEngineState(
                        {
                            state:
                                "UPDATING",

                            progress:
                                0,

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            /*
             * DOWNLOAD
             */

            engine.on(
                "download:progress",
                data => {

                    applyEngineState(
                        {
                            state:
                                "DOWNLOADING",

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            /*
             * VERIFY
             */

            engine.on(
                "verify:start",
                data => {

                    applyEngineState(
                        {
                            state:
                                "VERIFYING",

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            engine.on(
                "verify:success",
                data => {

                    applyEngineState(
                        {
                            state:
                                "VERIFY",

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            /*
             * INSTALL
             */

            engine.on(
                "install:start",
                data => {

                    applyEngineState(
                        {
                            state:
                                "INSTALLING",

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            engine.on(
                "install:complete",
                data => {

                    applyEngineState(
                        {
                            state:
                                "INSTALL",

                            ...(
                                data || {}
                            )
                        }
                    );

                }
            );


            /*
             * ACTIVE BUILD
             */

            engine.on(
                "build:active",
                data => {

                    sendToIntro(
                        "MARA_BUILD_ACTIVE",
                        {
                            data:
                                data
                        }
                    );

                }
            );


            /*
             * UPDATE COMPLETE
             */

            engine.on(
                "update:complete",
                data => {

                    applyEngineState(
                        {
                            state:
                                "READY",

                            progress:
                                100,

                            ...(
                                data || {}
                            )
                        }
                    );


                    sendToIntro(
                        "MARA_ENGINE_COMPLETE",
                        {
                            progress:
                                100,

                            data:
                                data
                        }
                    );

                }
            );


            /*
             * NO UPDATE
             */

            engine.on(
                "update:none",
                data => {

                    applyEngineState(
                        {
                            state:
                                "IDLE",

                            progress:
                                100,

                            ...(
                                data || {}
                            )
                        }
                    );


                    sendToIntro(
                        "MARA_ENGINE_NO_WORK",
                        {
                            data:
                                data
                        }
                    );

                }
            );


            engine.on(
                "no:update",
                data => {

                    applyEngineState(
                        {
                            state:
                                "IDLE",

                            progress:
                                100,

                            ...(
                                data || {}
                            )
                        }
                    );


                    sendToIntro(
                        "MARA_ENGINE_NO_WORK",
                        {
                            data:
                                data
                        }
                    );

                }
            );


            /*
             * ERROR
             */

            engine.on(
                "update:error",
                data => {

                    STATE.engineError =
                        data &&
                        (
                            data.error ||
                            data.message
                        );


                    applyEngineState(
                        {
                            state:
                                "ERROR",

                            ...(
                                data || {}
                            )
                        }
                    );


                    sendToIntro(
                        "MARA_ENGINE_ERROR",
                        {
                            data:
                                data
                        }
                    );

                }
            );

        }


        syncEngine();

        return true;

    }


    /* =========================================================
       BUILD STATE SYNC
    ========================================================= */

    function syncBuild() {

        const build =
            getBuild();


        if (
            !build
        ) {

            STATE.buildAvailable =
                false;


            return false;

        }


        STATE.buildAvailable =
            true;


        try {

            if (
                typeof build.getState ===
                    "function"
            ) {

                const state =
                    build.getState();


                if (
                    state &&
                    typeof state ===
                        "object"
                ) {

                    STATE.buildStarting =
                        !!state.starting;

                    STATE.buildReady =
                        !!state.ready;

                    STATE.buildError =
                        state.error ||
                        null;

                }

            }

        } catch (err) {

            warn(
                "Build state sync gagal:",
                err
            );

        }


        return true;

    }


    /* =========================================================
       INTRO CLOSE
    ========================================================= */

    function closeIntro(
        reason
    ) {

        if (
            STATE.overlayClosed
        ) {

            return;

        }


        STATE.overlayClosed =
            true;


        STATE.introFinished =
            true;


        log(
            "INTRO CLOSED:",
            reason
        );


        if (
            introOverlay
        ) {

            introOverlay.classList.add(
                "hide"
            );

        }


        /*
         * Hanya cleanup visual.
         *
         * Bukan timer boot.
         */

        const cleanupIntro =
            () => {

                try {

                    if (
                        introFrame
                    ) {

                        introFrame.src =
                            "about:blank";

                    }

                } catch (err) {

                    warn(
                        "Intro cleanup gagal:",
                        err
                    );

                }

            };


        if (
            introFrame
        ) {

            introFrame.addEventListener(
                "transitionend",
                cleanupIntro,
                {
                    once:
                        true
                }
            );

        }


        sendToBuild(
            "MARA_INTRO_CLOSED",
            {
                reason:
                    reason
            }
        );


        emit(
            "MARA_INDEX_INTRO_CLOSED",
            {
                reason:
                    reason
            }
        );

    }


    /* =========================================================
       BUILD BOOT
    ========================================================= */

    async function requestBuildBoot(
        data = {}
    ) {

        if (
            STATE.bootRequested
        ) {

            log(
                "BOOT sudah diminta sebelumnya."
            );


            return;

        }


        STATE.bootRequested =
            true;


        STATE.phase =
            "BUILD_BOOT";


        log(
            "INDEX → BUILD:",
            "BOOT",
            data
        );


        sendToBuild(
            "MARA_BOOT_REQUEST",
            {
                source:
                    "index",

                ...data
            }
        );


        const build =
            getBuild();


        if (
            !build
        ) {

            const message =
                "MARA Build Runtime tidak tersedia.";


            STATE.buildError =
                message;


            error(
                message
            );


            sendToIntro(
                "MARA_BUILD_ERROR",
                {
                    data:
                        {
                            message
                        }
                }
            );


            emit(
                "MARA_INDEX_ERROR",
                {
                    phase:
                        "BUILD_BOOT",

                    message
                }
            );


            return;

        }


        STATE.buildAvailable =
            true;


        try {

            STATE.buildStarting =
                true;


            /*
             * start() idempotent.
             *
             * Jika build.js sudah auto-start,
             * pemanggilan ini akan memakai startPromise
             * yang sudah ada.
             */

            const result =
                await build.start();


            STATE.buildStarting =
                false;


            STATE.buildReady =
                !!(
                    result &&
                    result.success
                );


            if (
                STATE.buildReady
            ) {

                STATE.phase =
                    "BUILD_READY";


                STATE.bootCompleted =
                    true;


                log(
                    "BUILD BOOT COMPLETE.",
                    result
                );

            }

        } catch (err) {

            STATE.buildStarting =
                false;

            STATE.buildReady =
                false;

            STATE.buildError =
                err;


            STATE.phase =
                "ERROR";


            error(
                "BUILD BOOT ERROR:",
                err
            );


            sendToIntro(
                "MARA_BUILD_ERROR",
                {
                    data:
                        {
                            message:
                                err.message
                        }
                }
            );

        }

    }


    /* =========================================================
       MAIN FRAME
    ========================================================= */

    if (
        mainFrame
    ) {

        mainFrame.addEventListener(
            "load",
            () => {

                STATE.mainFrameLoaded =
                    true;


                STATE.buildReady =
                    true;


                STATE.readyAt =
                    Date.now();


                STATE.phase =
                    "READY";


                log(
                    "MAIN FRAME READY."
                );


                emit(
                    "MARA_INDEX_READY",
                    getState()
                );

            }
        );

    }


    /* =========================================================
       BUILD EVENTS
    ========================================================= */

    window.addEventListener(
        "MARA_BUILD_READY",
        event => {

            STATE.buildReady =
                true;


            STATE.buildStarting =
                false;


            STATE.bootCompleted =
                true;


            STATE.phase =
                "BUILD_READY";


            log(
                "BUILD READY.",
                event.detail
            );


            sendToIntro(
                "MARA_BUILD_READY",
                {
                    data:
                        event.detail
                }
            );


            emit(
                "MARA_INDEX_BUILD_READY",
                {
                    data:
                        event.detail
                }
            );

        }
    );


    window.addEventListener(
        "MARA_BUILD_ERROR",
        event => {

            STATE.buildReady =
                false;


            STATE.buildStarting =
                false;


            STATE.buildError =
                event.detail ||
                null;


            STATE.phase =
                "ERROR";


            error(
                "BUILD ERROR:",
                event.detail
            );


            sendToIntro(
                "MARA_BUILD_ERROR",
                {
                    data:
                        event.detail
                }
            );

        }
    );


    /* =========================================================
       INTRO MESSAGE HANDLER
    ========================================================= */

    function handleIntroMessage(
        event
    ) {

        /*
         * Security boundary:
         *
         * Hanya iframe intro yang diterima.
         */

        if (
            !introFrame ||
            event.source !==
                introFrame.contentWindow
        ) {

            return;

        }


        const data =
            event.data;


        if (
            !data ||
            typeof data !==
                "object"
        ) {

            return;

        }


        const type =
            data.type;


        /* =====================================================
           INTRO READY
        ===================================================== */

        if (
            type ===
            "MARA_INTRO_READY"
        ) {

            STATE.introReady =
                true;


            STATE.phase =
                "INTRO_READY";


            log(
                "INTRO READY."
            );


            sendToIntro(
                "MARA_INDEX_READY_ACK"
            );


            sendCurrentEngineState();


            syncBuild();


            return;

        }


        /* =====================================================
           ENGINE STATUS REQUEST
        ===================================================== */

        if (
            type ===
            "MARA_ENGINE_STATUS_REQUEST"
        ) {

            sendCurrentEngineState();

            return;

        }


        /* =====================================================
           INTRO FINISHED
        ===================================================== */

        if (
            type ===
            "MARA_INTRO_FINISHED"
        ) {

            STATE.introFinished =
                true;


            log(
                "INTRO FINISHED."
            );


            closeIntro(
                "MARA_INTRO_FINISHED"
            );


            return;

        }


        /* =====================================================
           BOOT READY
        ===================================================== */

        if (
            type ===
            "MARA_BOOT_READY"
        ) {

            log(
                "INTRO → INDEX: BOOT_READY"
            );


            requestBuildBoot(
                data
            );


            closeIntro(
                "MARA_BOOT_READY"
            );


            return;

        }


        /* =====================================================
           BUILD REQUEST
        ===================================================== */

        if (
            type ===
            "MARA_BUILD_REQUEST"
        ) {

            log(
                "INTRO → INDEX: BUILD_REQUEST"
            );


            requestBuildBoot(
                data
            );


            return;

        }

    }


    window.addEventListener(
        "message",
        handleIntroMessage
    );


    /* =========================================================
       INTRO LOAD
    ========================================================= */

    if (
        introFrame
    ) {

        introFrame.addEventListener(
            "load",
            () => {

                STATE.introLoaded =
                    true;


                log(
                    "INTRO LOADED."
                );


                sendToIntro(
                    "MARA_INDEX_READY"
                );


                sendCurrentEngineState();

            }
        );

    }


    /* =========================================================
       SEND CURRENT ENGINE STATE
    ========================================================= */

    function sendCurrentEngineState() {

        syncEngine();


        sendToIntro(
            "MARA_ENGINE_STATE",
            {

                state:
                    STATE.engineState,

                progress:
                    STATE.engineProgress,

                working:
                    STATE.engineWorking,

                ready:
                    STATE.engineReady,

                available:
                    STATE.engineAvailable,

                error:
                    STATE.engineError

            }
        );

    }


    /* =========================================================
       CONTROL CENTER
    ========================================================= */

    function openControlCenter() {

        if (
            !controlCenterOverlay
        ) {

            return;

        }


        controlCenterOverlay.style.display =
            "block";


        emit(
            "MARA_CONTROL_CENTER_OPEN"
        );

    }


    function closeControlCenter() {

        if (
            !controlCenterOverlay
        ) {

            return;

        }


        controlCenterOverlay.style.display =
            "none";


        emit(
            "MARA_CONTROL_CENTER_CLOSE"
        );

    }


    /* =========================================================
       PUBLIC CONTROLLER
    ========================================================= */

    function getState() {

        return {

            ...STATE,

            startedAt:
                STATE.startedAt,

            readyAt:
                STATE.readyAt

        };

    }


    window.MARA_INDEX_CONTROLLER = {

        /* State */

        getState,


        /* Engine */

        getEngine() {

            return getEngine();

        },


        syncEngine,


        getEngineState() {

            return {

                state:
                    STATE.engineState,

                progress:
                    STATE.engineProgress,

                working:
                    STATE.engineWorking,

                ready:
                    STATE.engineReady,

                available:
                    STATE.engineAvailable,

                error:
                    STATE.engineError

            };

        },


        /* Build */

        getBuild() {

            return getBuild();

        },


        syncBuild,


        requestBuild(
            data = {}
        ) {

            return requestBuildBoot(
                data
            );

        },


        /* Intro */

        closeIntro,


        getIntroFrame() {

            return introFrame;

        },


        /* Main */

        getMainFrame() {

            return mainFrame;

        },


        /* Control Center */

        openControlCenter,

        closeControlCenter

    };


    /* =========================================================
       INDEX INITIALIZATION
    ========================================================= */

    function initialize() {

        log(
            "MARA OS INDEX RUNTIME v3"
        );


        STATE.indexReady =
            true;


        STATE.phase =
            "INDEX_READY";


        connectEngine();

        syncBuild();


        sendToIntro(
            "MARA_INDEX_READY"
        );


        sendCurrentEngineState();


        emit(
            "MARA_INDEX_RUNTIME_READY",
            getState()
        );


        log(
            "INDEX.HTML READY."
        );

    }


    /* =========================================================
       DOM READY
    ========================================================= */

    if (
        document.readyState ===
            "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            {
                once:
                    true
            }
        );

    }

    else {

        initialize();

    }


    /* =========================================================
       PAGE LIFECYCLE
    ========================================================= */

    window.addEventListener(
        "pagehide",
        () => {

            /*
             * INDEX tidak menghentikan engine.
             *
             * Hanya melepas referensi visual.
             */

            log(
                "INDEX PAGEHIDE."
            );

        }
    );


})();

</script>
