<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover"><title>MARA Status Bar</title>

<style>
html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}

.mara-iframe {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100vw;
    height: 100vh;

    margin: 0;
    padding: 0;

    border: 0;

    display: block;

    z-index: 1;
}

.mara-header {
    top: 0;
}
</style><link rel="stylesheet" href="style.css">

</head><body><!-- =====================================================
     MARA OS — INTRO OVERLAY
===================================================== --><div
    id="mara-intro-overlay"
    style="
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 9999999999999;
        background: #000;
        overflow: hidden;
    "
><iframe
    id="mara-intro-frame"
    src="ux/intro.html"
    frameborder="0"
    style="
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    "
></iframe>

</div><!-- =====================================================
     MARA OS — MAIN FRAME
===================================================== --><iframe
    class="mara-iframe"
    id="mara-main-frame"
    frameborder="0">
</iframe><!-- =====================================================
     MARA OS — STATUS BAR
===================================================== --><div class="mara-header"><div class="clock" id="clock">
    00:00
</div>

<div class="battery">

    <span id="battery-percent">
        --%
    </span>

    <div class="battery-icon">

        <div
            class="battery-level"
            id="battery-level">
        </div>

    </div>

</div>

</div><!-- =====================================================
     MARA OS — CONTROL CENTER
===================================================== --><div id="controlCenterOverlay"><iframe
    id="controlCenterFrame"
    src="ux/control-center.html"
    frameborder="0">
</iframe>

</div><!-- =====================================================
     MARA OS — CORE SCRIPTS
===================================================== --><script src="script.js"></script><!--
    ENGINE SINGLE HARUS DIMUAT SEBELUM BUILD ENGINE.

    engine-single.js:
        - IndexedDB
        - update
        - manifest
        - download
        - verify
        - install
        - active build
        - file storage
--><script src="engine-single.js"></script><!--
    build.js menggunakan MARAEngineSingle.
    Karena itu build.js dimuat setelah engine-single.js.
--><script src="ux/build.js"></script><script>

/* =====================================================
   MARA OS — INTRO OVERLAY CONTROLLER
=====================================================

   TUGAS INDEX.HTML:

   1. Menampilkan intro.html
   2. Menunggu intro selesai
   3. Menunggu proses update selesai
   4. Tidak menangani download
   5. Tidak menangani IndexedDB secara langsung
   6. Tidak menangani install build secara langsung
   7. Tidak menghapus build secara langsung

   ENGINE SINGLE:

       Repository
           ↓
       Manifest
           ↓
       Download
           ↓
       Temporary IndexedDB
           ↓
       Verify
           ↓
       Install
           ↓
       ACTIVE BUILD
           ↓
       Build Runtime

   INTRO:

       Loading
           ↓
       Update UI
           ↓
       Finished
           ↓
       INDEX menerima signal
           ↓
       Overlay ditutup

===================================================== */


document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =================================================
           ELEMENT
        ================================================= */

        const overlay =
            document.getElementById(
                "mara-intro-overlay"
            );


        const introFrame =
            document.getElementById(
                "mara-intro-frame"
            );


        const mainFrame =
            document.getElementById(
                "mara-main-frame"
            );


        /* =================================================
           VALIDASI
        ================================================= */

        if (
            !overlay ||
            !introFrame
        ) {

            console.warn(
                "[MARA OS] Intro overlay / iframe tidak ditemukan."
            );

            return;

        }


        /* =================================================
           STATE
        ================================================= */

        let introClosed =
            false;


        let introLoaded =
            false;


        let updateRunning =
            false;


        let updateFinished =
            false;


        let introFinished =
            false;


        /* =================================================
           CLOSE INTRO
        ================================================= */

        function closeIntro(
            reason = "unknown"
        ) {


            if (
                introClosed
            ) {

                return;

            }


            introClosed =
                true;


            console.log(
                "[MARA OS] Menutup intro.",
                reason
            );


            /* =============================================
               HENTIKAN INTERAKSI
            ============================================= */

            overlay.style.pointerEvents =
                "none";


            /* =============================================
               FADE OUT
            ============================================= */

            overlay.style.transition =
                "opacity 1s ease";


            overlay.style.opacity =
                "0";


            /* =============================================
               HAPUS SETELAH ANIMASI
            ============================================= */

            setTimeout(
                function () {


                    if (!overlay) {

                        return;

                    }


                    /*
                     * Hentikan iframe intro.
                     */

                    if (introFrame) {

                        try {

                            introFrame.src =
                                "about:blank";

                        } catch (error) {

                            console.warn(
                                "[MARA OS] Gagal menghentikan intro iframe.",
                                error
                            );

                        }

                    }


                    /*
                     * Hapus overlay.
                     */

                    overlay.remove();


                    console.log(
                        "[MARA OS] Intro overlay dihapus."
                    );


                },
                1000
            );

        }


        /* =================================================
           CEK BOLEH TUTUP INTRO
        ================================================= */

        function checkIntroFinish() {


            if (
                !introFinished
            ) {

                return;

            }


            if (
                updateRunning
            ) {

                console.log(
                    "[MARA OS] Intro selesai tetapi update masih berjalan."
                );

                return;

            }


            if (
                updateFinished ||
                !updateRunning
            ) {

                closeIntro(
                    "intro-and-update-finished"
                );

            }

        }


        /* =================================================
           MESSAGE HANDLER
        ================================================= */

        function handleIntroMessage(
            event
        ) {


            /* =============================================
               VALIDASI SUMBER
            ============================================= */

            if (
                !introFrame ||
                event.source !==
                    introFrame.contentWindow
            ) {

                return;

            }


            /* =============================================
               VALIDASI DATA
            ============================================= */

            if (
                !event.data ||
                typeof event.data !==
                    "object"
            ) {

                return;

            }


            const type =
                event.data.type;


            /* =============================================
               INTRO READY
            ============================================= */

            if (
                type ===
                "MARA_INTRO_READY"
            ) {

                console.log(
                    "[MARA OS] Intro READY."
                );


                return;

            }


            /* =============================================
               INDEX READY ACK
            ============================================= */

            if (
                type ===
                "MARA_INDEX_READY_ACK"
            ) {

                console.log(
                    "[MARA OS] Intro menerima INDEX READY."
                );


                return;

            }


            /* =============================================
               UPDATE DIMULAI
            ============================================= */

            if (
                type ===
                "MARA_UPDATE_STARTED"
            ) {

                updateRunning =
                    true;

                updateFinished =
                    false;


                console.log(
                    "[MARA OS] Update engine dimulai.",
                    event.data
                );


                return;

            }


            /* =============================================
               DOWNLOAD
            ============================================= */

            if (
                type ===
                "MARA_UPDATE_DOWNLOADING"
            ) {

                updateRunning =
                    true;


                console.log(
                    "[MARA OS] Download build sedang berlangsung.",
                    event.data
                );


                return;

            }


            /* =============================================
               VERIFIKASI
            ============================================= */

            if (
                type ===
                "MARA_UPDATE_VERIFYING"
            ) {

                updateRunning =
                    true;


                console.log(
                    "[MARA OS] Verifikasi build.",
                    event.data
                );


                return;

            }


            /* =============================================
               INSTALL
            ============================================= */

            if (
                type ===
                "MARA_UPDATE_INSTALLING"
            ) {

                updateRunning =
                    true;


                console.log(
                    "[MARA OS] Instalasi build.",
                    event.data
                );


                return;

            }


            /* =============================================
               UPDATE SELESAI
            ============================================= */

            if (
                type ===
                "MARA_UPDATE_FINISHED"
            ) {

                updateRunning =
                    false;

                updateFinished =
                    true;


                console.log(
                    "[MARA OS] Update selesai.",
                    event.data
                );


                checkIntroFinish();


                return;

            }


            /* =============================================
               TIDAK ADA UPDATE
            ============================================= */

            if (
                type ===
                "MARA_NO_UPDATE"
            ) {

                updateRunning =
                    false;

                updateFinished =
                    true;


                console.log(
                    "[MARA OS] Tidak ada update."
                );


                checkIntroFinish();


                return;

            }


            /* =============================================
               UPDATE ERROR
            ============================================= */

            if (
                type ===
                "MARA_UPDATE_ERROR"
            ) {

                updateRunning =
                    false;

                updateFinished =
                    true;


                console.error(
                    "[MARA OS] Update error.",
                    event.data
                );


                /*
                 * Build aktif sebelumnya tetap
                 * dapat digunakan.
                 */

                checkIntroFinish();


                return;

            }


            /* =============================================
               INTRO SELESAI
            ============================================= */

            if (
                type ===
                "MARA_INTRO_FINISHED"
            ) {

                introFinished =
                    true;


                console.log(
                    "[MARA OS] MARA_INTRO_FINISHED diterima."
                );


                checkIntroFinish();


                return;

            }

        }


        /* =================================================
           MESSAGE LISTENER
        ================================================= */

        window.addEventListener(
            "message",
            handleIntroMessage
        );


        /* =================================================
           INTRO FRAME LOAD
        ================================================= */

        introFrame.addEventListener(
            "load",
            function () {

                introLoaded =
                    true;


                console.log(
                    "[MARA OS] intro.html berhasil dimuat."
                );


                /*
                 * Beri tahu intro bahwa index
                 * sudah siap menerima komunikasi.
                 */

                try {

                    introFrame.contentWindow.postMessage(
                        {
                            type:
                                "MARA_INDEX_READY"
                        },
                        "*"
                    );

                } catch (error) {

                    console.warn(
                        "[MARA OS] Gagal mengirim MARA_INDEX_READY.",
                        error
                    );

                }

            }
        );


        /* =================================================
           ENGINE STATUS
        ================================================= */

        function connectEngine() {


            if (
                !window.MARAEngineSingle
            ) {

                console.warn(
                    "[MARA OS] MARAEngineSingle belum tersedia."
                );


                return false;

            }


            console.log(
                "[MARA OS] MARAEngineSingle terdeteksi."
            );


            /*
             * Engine READY.
             */

            MARAEngineSingle.on(
                "ready",
                function (data) {

                    console.log(
                        "[MARA OS] ENGINE READY.",
                        data
                    );

                }
            );


            /*
             * Download progress.
             */

            MARAEngineSingle.on(
                "download:progress",
                function (data) {

                    console.log(
                        "[MARA OS] DOWNLOAD:",
                        data.progress + "%",
                        data.path
                    );

                }
            );


            /*
             * Verify sukses.
             */

            MARAEngineSingle.on(
                "verify:success",
                function (data) {

                    console.log(
                        "[MARA OS] VERIFY OK:",
                        data
                    );

                }
            );


            /*
             * Install selesai.
             */

            MARAEngineSingle.on(
                "install:complete",
                function (data) {

                    console.log(
                        "[MARA OS] INSTALL COMPLETE:",
                        data
                    );

                }
            );


            /*
             * Active build berubah.
             */

            MARAEngineSingle.on(
                "build:active",
                function (data) {

                    console.log(
                        "[MARA OS] ACTIVE BUILD:",
                        data
                    );

                }
            );


            /*
             * Update selesai.
             */

            MARAEngineSingle.on(
                "update:complete",
                function (data) {

                    console.log(
                        "[MARA OS] ENGINE UPDATE COMPLETE:",
                        data
                    );

                }
            );


            /*
             * Update error.
             */

            MARAEngineSingle.on(
                "update:error",
                function (data) {

                    console.error(
                        "[MARA OS] ENGINE UPDATE ERROR:",
                        data
                    );

                }
            );


            return true;

        }


        /* =================================================
           CONNECT ENGINE
        ================================================= */

        connectEngine();


        /* =================================================
           INTRO FRAME LOAD
        ================================================= */

        if (
            !introLoaded
        ) {

            console.log(
                "[MARA OS] Menunggu intro.html..."
            );

        }


        /* =================================================
           FAILSAFE
        =================================================

           10 menit untuk proses normal.

        ================================================= */

        const INTRO_FAILSAFE_TIME =
            600000;


        setTimeout(
            function () {


                if (
                    introClosed
                ) {

                    return;

                }


                if (
                    updateRunning
                ) {

                    console.warn(
                        "[MARA OS] Failsafe tercapai tetapi update masih berjalan."
                    );


                    /*
                     * Tambahan waktu 2 menit.
                     */

                    setTimeout(
                        function () {


                            if (
                                !introClosed &&
                                !updateRunning
                            ) {

                                closeIntro(
                                    "failsafe-after-update"
                                );

                            }

                        },
                        120000
                    );


                    return;

                }


                console.warn(
                    "[MARA OS] Intro melewati batas waktu pengaman."
                );


                closeIntro(
                    "failsafe-timeout"
                );


            },
            INTRO_FAILSAFE_TIME
        );


        /* =================================================
           CLEANUP
        ================================================= */

        window.addEventListener(
            "beforeunload",
            function () {

                window.removeEventListener(
                    "message",
                    handleIntroMessage
                );

            },
            {
                once: true
            }
        );


        /* =================================================
           DEBUG API
        ================================================= */

        window.MARA_INTRO_CONTROLLER = {

            getState() {

                return {

                    introLoaded:
                        introLoaded,

                    introClosed:
                        introClosed,

                    introFinished:
                        introFinished,

                    updateRunning:
                        updateRunning,

                    updateFinished:
                        updateFinished

                };

            },


            close(reason) {

                closeIntro(
                    reason ||
                    "manual"
                );

            },


            getEngine() {

                return window.MARAEngineSingle ||
                    null;

            },


            getMainFrame() {

                return mainFrame ||
                    null;

            }

        };


        console.log(
            "[MARA OS] Intro overlay controller aktif."
        );


        console.log(
            "[MARA OS] INDEX.HTML TAHAP 1 READY."
        );


    }
);

</script></body>
</html>
