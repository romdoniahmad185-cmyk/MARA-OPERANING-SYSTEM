<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>MARA OS</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:Arial,Helvetica,sans-serif}
.mara-iframe,#mara-intro-overlay,#mara-intro-frame,#controlCenterOverlay,#controlCenterFrame{position:fixed;border:0}
.mara-iframe{inset:0;width:100vw;height:100vh;z-index:1;background:#000}
#mara-intro-overlay{inset:0;width:100%;height:100%;z-index:999999;background:#000;overflow:hidden}
#mara-intro-frame{inset:0;width:100%;height:100%;display:block;background:#000}
.mara-header{position:fixed;top:0;left:0;right:0;z-index:1000}
#controlCenterOverlay{inset:0;z-index:5000;display:none;background:rgba(0,0,0,.45)}
#controlCenterFrame{inset:0;width:100%;height:100%;display:block}
@supports(padding:env(safe-area-inset-top)){.mara-header{padding-top:env(safe-area-inset-top)}}
</style>
</head>
<body>
<iframe class="mara-iframe" id="mara-main-frame" title="MARA OS Main"></iframe>

<div id="mara-intro-overlay">
<iframe id="mara-intro-frame" src="ux/intro.html" title="MARA OS Intro"></iframe>
</div>

<div class="mara-header">
<div class="clock" id="clock">00:00</div>
<div class="battery"><span id="battery-percent">--%</span><div class="battery-icon"><div class="battery-level" id="battery-level"></div></div></div>
</div>

<div id="controlCenterOverlay">
<iframe id="controlCenterFrame" src="ux/control-center.html" title="MARA Control Center"></iframe>
</div>

<script src="script.js"></script>
<script src="engine-single.js"></script>
<script src="ux/build.js"></script>
<script>
(() => {
"use strict";
const introOverlay=document.getElementById("mara-intro-overlay");
const introFrame=document.getElementById("mara-intro-frame");
const mainFrame=document.getElementById("mara-main-frame");
const STATE={introLoaded:false,introReady:false,introFinished:false,overlayClosed:false,engineReady:false,engineWorking:false,engineProgress:0,buildReady:false,bootRequested:false};

function log(...a){console.log("[MARA INDEX]",...a)}
function warn(...a){console.warn("[MARA INDEX]",...a)}
function sendToIntro(type,data={}){try{introFrame?.contentWindow?.postMessage({type,...data},"*")}catch(e){warn(e)}}
function requestBuildBoot(data={}){if(STATE.bootRequested)return;STATE.bootRequested=true;window.dispatchEvent(new CustomEvent("MARA_BOOT_REQUEST",{detail:{source:"intro",...data}}))}
function closeIntro(reason){if(STATE.overlayClosed)return;STATE.overlayClosed=true;STATE.introFinished=true;introOverlay?.classList.add("hide");sendToBuild("MARA_INTRO_CLOSED",{reason})}
function sendToBuild(type,data={}){window.dispatchEvent(new CustomEvent(type,{detail:data}))}
function sendCurrentEngineState(){
 const e=window.MARAEngineSingle;
 if(!e){sendToIntro("MARA_ENGINE_UNAVAILABLE");return}
 let s=null;try{if(typeof e.getState==="function")s=e.getState()}catch(_){}
 sendToIntro("MARA_ENGINE_STATE",{state:s,working:STATE.engineWorking,progress:STATE.engineProgress,ready:STATE.engineReady});
}
function handleIntroMessage(ev){
 if(ev.source!==introFrame.contentWindow)return;
 const d=ev.data;if(!d||typeof d!=="object")return;
 if(d.type==="MARA_INTRO_READY"){STATE.introReady=true;sendToIntro("MARA_INDEX_READY_ACK");sendCurrentEngineState()}
 else if(d.type==="MARA_ENGINE_STATUS_REQUEST")sendCurrentEngineState();
 else if(d.type==="MARA_INTRO_FINISHED")closeIntro("MARA_INTRO_FINISHED");
 else if(d.type==="MARA_BOOT_READY"){requestBuildBoot(d);closeIntro("MARA_BOOT_READY")}
 else if(d.type==="MARA_BUILD_REQUEST")requestBuildBoot(d);
}
window.addEventListener("message",handleIntroMessage);
introFrame?.addEventListener("load",()=>{STATE.introLoaded=true;log("intro.html loaded");sendToIntro("MARA_INDEX_READY");sendCurrentEngineState()});
mainFrame?.addEventListener("load",()=>{STATE.buildReady=true});
function connectEngine(){
 const e=window.MARAEngineSingle;if(!e){sendToIntro("MARA_ENGINE_UNAVAILABLE");return false}
 if(typeof e.on!=="function"){sendCurrentEngineState();return true}
 const on=(name,fn)=>{try{e.on(name,fn)}catch(err){warn("engine.on",name,err)}};
 on("ready",d=>{STATE.engineReady=true;STATE.engineWorking=false;STATE.engineProgress=100;sendToIntro("MARA_ENGINE_READY",{data:d,progress:100})});
 on("update:start",d=>{STATE.engineWorking=true;STATE.engineProgress=0;sendToIntro("MARA_ENGINE_WORKING",{data:d,progress:0})});
 on("download:progress",d=>{STATE.engineWorking=true;const p=Number(d?.progress);if(Number.isFinite(p))STATE.engineProgress=Math.max(0,Math.min(100,p));sendToIntro("MARA_ENGINE_PROGRESS",{phase:"download",progress:STATE.engineProgress,data:d})});
 for(const phase of ["verify:start","verify:success","install:start","install:complete"])on(phase,d=>sendToIntro("MARA_ENGINE_PHASE",{phase:phase.split(":")[0],progress:STATE.engineProgress,data:d}));
 on("build:active",d=>sendToIntro("MARA_BUILD_ACTIVE",{data:d}));
 on("update:complete",d=>{STATE.engineWorking=false;STATE.engineProgress=100;sendToIntro("MARA_ENGINE_COMPLETE",{progress:100,data:d})});
 on("update:none",d=>{STATE.engineWorking=false;STATE.engineProgress=100;sendToIntro("MARA_ENGINE_NO_WORK",{data:d})});
 on("no:update",d=>{STATE.engineWorking=false;sendToIntro("MARA_ENGINE_NO_WORK",{data:d})});
 on("update:error",d=>{STATE.engineWorking=false;sendToIntro("MARA_ENGINE_ERROR",{data:d})});
 sendCurrentEngineState();return true;
}
window.addEventListener("MARA_BUILD_READY",e=>{STATE.buildReady=true;sendToIntro("MARA_BUILD_READY",{data:e.detail})});
window.addEventListener("MARA_BUILD_ERROR",e=>sendToIntro("MARA_BUILD_ERROR",{data:e.detail}));
window.MARA_INDEX_CONTROLLER={getState:()=>({...STATE}),closeIntro:(r)=>closeIntro(r||"controller"),requestBuild:(d)=>requestBuildBoot(d||{}),getEngine:()=>window.MARAEngineSingle||null,getBuild:()=>window.MARABuild||null,getMainFrame:()=>mainFrame,getIntroFrame:()=>introFrame};
connectEngine();
log("INDEX.HTML READY");
sendToIntro("MARA_INDEX_READY");
})();
</script>
</body>
</html>
