<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>MARA OS</title>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            position: fixed;

            inset: 0;

            background: #000;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           MAIN MARA OS FRAME
           
           Frame ini TIDAK menentukan sendiri kapan
           UX dibuka.
           
           Perintah datang melalui alur:
           
           ENGINE
              ↓
           INTRO
              ↓
           INDEX
              ↓
           BUILD
              ↓
           MAIN FRAME
        ===================================================== */

        .mara-iframe {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            z-index: 1;

            background: #000;

        }


        /* =====================================================
           INTRO OVERLAY
        ===================================================== */

        #mara-intro-overlay {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 999999;

            background: #000;

            overflow: hidden;

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        /*
         * Overlay hanya ditutup berdasarkan
         * perintah intro.html.
         *
         * TIDAK menggunakan timer.
         */

        #mara-intro-overlay.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity .35s ease,
                visibility .35s ease;

        }


        /* =====================================================
           INTRO FRAME
        ===================================================== */

        #mara-intro-frame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

            background: #000;

        }


        /* =====================================================
           STATUS BAR
           
           Status bar milik index.html.
           
           Overlay intro berada di atasnya ketika intro aktif.
           
           Setelah overlay ditutup,
           status bar tetap ada.
        ===================================================== */

        .mara-header {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

        }


        /* =====================================================
           CONTROL CENTER
        ===================================================== */

        #controlCenterOverlay {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .45
                );

        }


        #controlCenterFrame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

        }


        /* =====================================================
           SAFE AREA
        ===================================================== */

        @supports (
            padding:
            env(safe-area-inset-top)
        ) {

            .mara-header {

                padding-top:
                    env(
                        safe-area-inset-top
                    );

            }

        }

    </style>


    <!-- =====================================================
         STATUS BAR STYLE
    ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================================
     MAIN MARA OS
     
     TIDAK DIISI LANGSUNG OLEH INDEX.
     
     build.js yang akan menentukan runtime aktif.
========================================================= -->

<iframe
    class="mara-iframe"
    id="mara-main-frame"
    frameborder="0"
    title="MARA OS Main">
</iframe>


<!-- =========================================================
     INTRO OVERLAY
========================================================= -->

<div
    id="mara-intro-overlay"
>

    <iframe
        id="mara-intro-frame"
        src="ux/intro.html"
        frameborder="0"
        title="MARA OS Intro">
    </iframe>

</div>


<!-- =========================================================
     STATUS BAR
     
     TETAP BERADA DI INDEX.HTML.
     
     Overlay tidak menghapus status bar.
========================================================= -->

<div class="mara-header">


    <div
        class="clock"
        id="clock"
    >
        00:00
    </div>


    <div class="battery">


        <span id="battery-percent">
            --%
        </span>


        <div class="battery-icon">

            <div
                class="battery-level"
                id="battery-level">
            </div>

        </div>


    </div>


</div>


<!-- =========================================================
     CONTROL CENTER
========================================================= -->

<div
    id="controlCenterOverlay"
>

    <iframe
        id="controlCenterFrame"
        src="ux/control-center.html"
        frameborder="0"
        title="MARA Control Center">
    </iframe>

</div>


<!-- =========================================================
     CORE SCRIPT
========================================================= -->

<script src="script.js"></script>


<!-- =========================================================
     MARA ENGINE SINGLE
     
     ENGINE MENJADI SUMBER UTAMA PEKERJAAN UPDATE/BUILD.
     
     Engine tetap berada pada CONTEXT INDEX.
     
     Intro menerima status engine melalui postMessage.
========================================================= -->

<script src="engine-single.js"></script>


<!-- =========================================================
     MARA BUILD ENGINE
     
     BUILD.JS TETAP DI INDEX.
     
     BUILD.JS TIDAK BOLEH MEMUTUSKAN SENDIRI KAPAN
     INTRO DITUTUP.
========================================================= -->

<script src="ux/build.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           ELEMENT
        ===================================================== */

        const introOverlay =
            document.getElementById(
                "mara-intro-overlay"
            );


        const introFrame =
            document.getElementById(
                "mara-intro-frame"
            );


        const mainFrame =
            document.getElementById(
                "mara-main-frame"
            );


        const controlCenterOverlay =
            document.getElementById(
                "controlCenterOverlay"
            );


        /* =====================================================
           STATE
        ===================================================== */

        const STATE = {

            introLoaded:
                false,

            introReady:
                false,

            introFinished:
                false,

            overlayClosed:
                false,

            engineReady:
                false,

            engineWorking:
                false,

            engineProgress:
                0,

            buildReady:
                false,

            bootRequested:
                false

        };


        /* =====================================================
           LOG
        ===================================================== */

        function log(
            ...args
        ) {

            console.log(
                "[MARA INDEX]",
                ...args
            );

        }


        function warn(
            ...args
        ) {

            console.warn(
                "[MARA INDEX]",
                ...args
            );

        }


        function error(
            ...args
        ) {

            console.error(
                "[MARA INDEX]",
                ...args
            );

        }


        /* =====================================================
           SEND MESSAGE TO INTRO
           
           Semua status engine dikirim ke intro.html.
        ===================================================== */

        function sendToIntro(
            type,
            data = {}
        ) {

            if (
                !introFrame ||
                !introFrame.contentWindow
            ) {

                return;

            }


            try {

                introFrame.contentWindow.postMessage(
                    {
                        type:
                            type,

                        ...data
                    },
                    "*"
                );

            } catch (
                err
            ) {

                warn(
                    "Gagal mengirim pesan ke intro:",
                    err
                );

            }

        }


        /* =====================================================
           SEND MESSAGE TO BUILD
           
           build.js menerima perintah dari index.
        ===================================================== */

        function sendToBuild(
            type,
            data = {}
        ) {

            try {

                window.dispatchEvent(
                    new CustomEvent(
                        type,
                        {
                            detail:
                                data
                        }
                    )
                );

            } catch (
                err
            ) {

                warn(
                    "Gagal mengirim event build:",
                    type,
                    err
                );

            }

        }


        /* =====================================================
           CLOSE INTRO
           
           PENTING:
           
           Tidak ada timer.
           
           Tidak ada failsafe.
           
           Tidak ada keputusan otomatis dari index.
           
           Fungsi ini hanya dipanggil setelah intro
           mengirim perintah.
        ===================================================== */

        function closeIntro(
            reason
        ) {

            if (
                STATE.overlayClosed
            ) {

                return;

            }


            STATE.overlayClosed =
                true;


            STATE.introFinished =
                true;


            log(
                "Perintah INTRO → INDEX:",
                "tutup overlay",
                reason
            );


            /*
             * HANYA menyembunyikan overlay.
             *
             * Tidak menentukan home screen.
             * Tidak menentukan build.
             * Tidak menentukan ACTIVE_BUILD.
             */

            if (
                introOverlay
            ) {

                introOverlay.classList.add(
                    "hide"
                );

            }


            /*
             * Intro tidak langsung dihapus.
             *
             * Hal ini menjaga komunikasi iframe
             * tetap aman selama transisi.
             */

            setTimeout(
                function () {

                    try {

                        if (
                            introFrame
                        ) {

                            introFrame.src =
                                "about:blank";

                        }

                    } catch (
                        err
                    ) {

                        warn(
                            "Gagal membersihkan intro:",
                            err
                        );

                    }


                    log(
                        "Intro overlay ditutup."
                    );

                },
                400
            );


            /*
             * Beritahu build bahwa intro
             * sudah menyerahkan kontrol.
             */

            sendToBuild(
                "MARA_INTRO_CLOSED",
                {
                    reason:
                        reason
                }
            );

        }


        /* =====================================================
           REQUEST BUILD
           
           Index TIDAK langsung membuka home-screen.
           
           Index hanya meneruskan perintah kepada build.js.
        ===================================================== */

        function requestBuildBoot(
            data = {}
        ) {

            if (
                STATE.bootRequested
            ) {

                return;

            }


            STATE.bootRequested =
                true;


            log(
                "INTRO → INDEX → BUILD",
                "permintaan boot diterima.",
                data
            );


            sendToBuild(
                "MARA_BOOT_REQUEST",
                {
                    source:
                        "intro",

                    ...data
                }
            );

        }


        /* =====================================================
           MAIN FRAME LOAD
           
           HANYA MONITORING.
           
           Index tidak menentukan src.
        ===================================================== */

        if (
            mainFrame
        ) {

            mainFrame.addEventListener(
                "load",
                function () {

                    STATE.buildReady =
                        true;


                    log(
                        "Main frame loaded."
                    );

                }
            );

        }


        /* =====================================================
           INTRO MESSAGE HANDLER
        ===================================================== */

        function handleIntroMessage(
            event
        ) {

            /*
             * Hanya intro.html yang boleh
             * memberikan perintah boot kepada index.
             */

            if (
                !introFrame ||
                event.source !==
                    introFrame.contentWindow
            ) {

                return;

            }


            const data =
                event.data;


            if (
                !data ||
                typeof data !==
                    "object"
            ) {

                return;

            }


            const type =
                data.type;


            /* =================================================
               INTRO READY
            ================================================= */

            if (
                type ===
                "MARA_INTRO_READY"
            ) {

                STATE.introReady =
                    true;


                log(
                    "INTRO READY."
                );


                sendToIntro(
                    "MARA_INDEX_READY_ACK"
                );


                return;

            }


            /* =================================================
               ENGINE STATUS REQUEST
               
               Intro meminta status engine saat ini.
            ================================================= */

            if (
                type ===
                "MARA_ENGINE_STATUS_REQUEST"
            ) {

                sendCurrentEngineState();

                return;

            }


            /* =================================================
               INTRO FINISHED
               
               Intro sendiri yang mengatakan:
               
               "Saya sudah selesai."
            ================================================= */

            if (
                type ===
                "MARA_INTRO_FINISHED"
            ) {

                log(
                    "INTRO FINISHED."
                );


                closeIntro(
                    "MARA_INTRO_FINISHED"
                );


                return;

            }


            /* =================================================
               BOOT READY
               
               Intro memberikan perintah kepada index
               untuk menyerahkan kontrol ke build.
            ================================================= */

            if (
                type ===
                "MARA_BOOT_READY"
            ) {

                log(
                    "INTRO memberikan perintah BOOT."
                );


                requestBuildBoot(
                    data
                );


                closeIntro(
                    "MARA_BOOT_READY"
                );


                return;

            }


            /* =================================================
               BUILD REQUEST
            ================================================= */

            if (
                type ===
                "MARA_BUILD_REQUEST"
            ) {

                requestBuildBoot(
                    data
                );


                return;

            }

        }


        /* =====================================================
           MESSAGE LISTENER
        ================================================= */

        window.addEventListener(
            "message",
            handleIntroMessage
        );


        /* =====================================================
           INTRO FRAME LOAD
        ================================================= */

        if (
            introFrame
        ) {

            introFrame.addEventListener(
                "load",
                function () {

                    STATE.introLoaded =
                        true;


                    log(
                        "intro.html loaded."
                    );


                    /*
                     * index memberi tahu intro
                     * bahwa index sudah siap.
                     */

                    sendToIntro(
                        "MARA_INDEX_READY"
                    );


                    /*
                     * Kirim status engine
                     * yang sudah tersedia.
                     */

                    sendCurrentEngineState();

                }
            );

        }


        /* =====================================================
           ENGINE STATE
        ===================================================== */

        function sendCurrentEngineState() {

            const engine =
                window.MARAEngineSingle;


            if (
                !engine
            ) {

                sendToIntro(
                    "MARA_ENGINE_UNAVAILABLE"
                );


                return;

            }


            /*
             * Coba mengambil state jika engine
             * menyediakan getState().
             */

            let engineState =
                null;


            try {

                if (
                    typeof engine.getState ===
                    "function"
                ) {

                    engineState =
                        engine.getState();

                }

            } catch (
                err
            ) {

                warn(
                    "Gagal membaca state engine:",
                    err
                );

            }


            sendToIntro(
                "MARA_ENGINE_STATE",
                {
                    state:
                        engineState,

                    working:
                        STATE.engineWorking,

                    progress:
                        STATE.engineProgress,

                    ready:
                        STATE.engineReady
                }
            );

        }


        /* =====================================================
           CONNECT ENGINE
        ===================================================== */

        function connectEngine() {

            const engine =
                window.MARAEngineSingle;


            if (
                !engine
            ) {

                warn(
                    "MARAEngineSingle belum tersedia."
                );


                sendToIntro(
                    "MARA_ENGINE_UNAVAILABLE"
                );


                return false;

            }


            log(
                "MARAEngineSingle terdeteksi."
            );


            /* =================================================
               ENGINE READY
            ================================================= */

            if (
                typeof engine.on ===
                "function"
            ) {

                engine.on(
                    "ready",
                    function (
                        data
                    ) {

                        STATE.engineReady =
                            true;

                        STATE.engineWorking =
                            false;

                        STATE.engineProgress =
                            100;


                        log(
                            "ENGINE READY",
                            data
                        );


                        sendToIntro(
                            "MARA_ENGINE_READY",
                            {
                                data:
                                    data,

                                progress:
                                    100
                            }
                        );

                    }
                );


                /* =============================================
                   UPDATE START
                ============================================= */

                engine.on(
                    "update:start",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            true;


                        STATE.engineProgress =
                            0;


                        log(
                            "ENGINE UPDATE START",
                            data
                        );


                        sendToIntro(
                            "MARA_ENGINE_WORKING",
                            {
                                data:
                                    data,

                                progress:
                                    0
                            }
                        );

                    }
                );


                /* =============================================
                   DOWNLOAD
                ============================================= */

                engine.on(
                    "download:progress",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            true;


                        const progress =
                            Number(
                                data &&
                                data.progress
                            );


                        if (
                            Number.isFinite(
                                progress
                            )
                        ) {

                            STATE.engineProgress =
                                Math.max(
                                    0,
                                    Math.min(
                                        100,
                                        progress
                                    )
                                );

                        }


                        sendToIntro(
                            "MARA_ENGINE_PROGRESS",
                            {
                                phase:
                                    "download",

                                progress:
                                    STATE.engineProgress,

                                data:
                                    data
                            }
                        );

                    }
                );


                /* =============================================
                   VERIFY
                ============================================= */

                engine.on(
                    "verify:start",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            true;


                        sendToIntro(
                            "MARA_ENGINE_PHASE",
                            {
                                phase:
                                    "verify",

                                progress:
                                    STATE.engineProgress,

                                data:
                                    data
                            }
                        );

                    }
                );


                engine.on(
                    "verify:success",
                    function (
                        data
                    ) {

                        sendToIntro(
                            "MARA_ENGINE_PHASE",
                            {
                                phase:
                                    "verify",

                                progress:
                                    STATE.engineProgress,

                                data:
                                    data
                            }
                        );

                    }
                );


                /* =============================================
                   INSTALL
                ============================================= */

                engine.on(
                    "install:start",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            true;


                        sendToIntro(
                            "MARA_ENGINE_PHASE",
                            {
                                phase:
                                    "install",

                                progress:
                                    STATE.engineProgress,

                                data:
                                    data
                            }
                        );

                    }
                );


                engine.on(
                    "install:complete",
                    function (
                        data
                    ) {

                        sendToIntro(
                            "MARA_ENGINE_PHASE",
                            {
                                phase:
                                    "install",

                                progress:
                                    STATE.engineProgress,

                                data:
                                    data
                            }
                        );

                    }
                );


                /* =============================================
                   ACTIVE BUILD
                ============================================= */

                engine.on(
                    "build:active",
                    function (
                        data
                    ) {

                        sendToIntro(
                            "MARA_BUILD_ACTIVE",
                            {
                                data:
                                    data
                            }
                        );

                    }
                );


                /* =============================================
                   UPDATE COMPLETE
                ============================================= */

                engine.on(
                    "update:complete",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            false;

                        STATE.engineProgress =
                            100;


                        log(
                            "ENGINE UPDATE COMPLETE",
                            data
                        );


                        sendToIntro(
                            "MARA_ENGINE_COMPLETE",
                            {
                                progress:
                                    100,

                                data:
                                    data
                            }
                        );

                    }
                );


                /* =============================================
                   NO UPDATE
                ============================================= */

                engine.on(
                    "update:none",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            false;


                        STATE.engineProgress =
                            100;


                        log(
                            "ENGINE TIDAK MEMILIKI PEKERJAAN."
                        );


                        sendToIntro(
                            "MARA_ENGINE_NO_WORK",
                            {
                                data:
                                    data
                            }
                        );

                    }
                );


                /*
                 * Alias event jika engine menggunakan
                 * nama MARA_NO_UPDATE.
                 */

                engine.on(
                    "no:update",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            false;


                        sendToIntro(
                            "MARA_ENGINE_NO_WORK",
                            {
                                data:
                                    data
                            }
                        );

                    }
                );


                /* =============================================
                   UPDATE ERROR
                ============================================= */

                engine.on(
                    "update:error",
                    function (
                        data
                    ) {

                        STATE.engineWorking =
                            false;


                        error(
                            "ENGINE UPDATE ERROR",
                            data
                        );


                        sendToIntro(
                            "MARA_ENGINE_ERROR",
                            {
                                data:
                                    data
                            }
                        );

                    }
                );

            }


            /*
             * Kirim keadaan awal.
             */

            sendCurrentEngineState();


            return true;

        }


        /* =====================================================
           CONNECT ENGINE
        ===================================================== */

        connectEngine();


        /* =====================================================
           BUILD EVENT BRIDGE
        ===================================================== */

        window.addEventListener(
            "MARA_BUILD_READY",
            function (
                event
            ) {

                STATE.buildReady =
                    true;


                log(
                    "BUILD READY",
                    event.detail
                );


                sendToIntro(
                    "MARA_BUILD_READY",
                    {
                        data:
                            event.detail
                    }
                );

            }
        );


        window.addEventListener(
            "MARA_BUILD_ERROR",
            function (
                event
            ) {

                error(
                    "BUILD ERROR",
                    event.detail
                );


                sendToIntro(
                    "MARA_BUILD_ERROR",
                    {
                        data:
                            event.detail
                    }
                );

            }
        );


        /* =====================================================
           CONTROL CENTER API
        ===================================================== */

        window.MARA_INDEX_CONTROLLER = {

            getState:
                function () {

                    return {

                        ...STATE

                    };

                },


            closeIntro:
                function (
                    reason
                ) {

                    /*
                     * Debug/manual API.
                     *
                     * Produksi tetap menggunakan
                     * perintah intro.
                     */

                    closeIntro(
                        reason ||
                        "controller"
                    );

                },


            requestBuild:
                function (
                    data
                ) {

                    requestBuildBoot(
                        data ||
                        {}
                    );

                },


            getEngine:
                function () {

                    return (
                        window.MARAEngineSingle ||
                        null
                    );

                },


            getBuild:
                function () {

                    return (
                        window.MARABuild ||
                        null
                    );

                },


            getMainFrame:
                function () {

                    return (
                        mainFrame ||
                        null
                    );

                },


            getIntroFrame:
                function () {

                    return (
                        introFrame ||
                        null
                    );

                }

        };


        /* =====================================================
           INDEX READY
        ===================================================== */

        log(
            "INDEX.HTML READY."
        );


        sendToIntro(
            "MARA_INDEX_READY"
        );


    }
);

</script>


</body>
</html>
