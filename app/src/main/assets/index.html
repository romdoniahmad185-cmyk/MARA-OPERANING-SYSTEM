<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>MARA OS</title>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: #000;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =====================================================
           MAIN MARA IFRAME
        ===================================================== */

        .mara-iframe {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            z-index: 1;

            background: #000;

        }


        /* =====================================================
           INTRO OVERLAY
        ===================================================== */

        #mara-intro-overlay {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 9999999999999;

            background: #000;

            overflow: hidden;

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

            transition:
                opacity 1s ease,
                visibility 1s ease;

        }


        #mara-intro-overlay.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        /* =====================================================
           INTRO FRAME
        ===================================================== */

        #mara-intro-frame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

            background: #000;

        }


        /* =====================================================
           STATUS BAR
        ===================================================== */

        .mara-header {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 100;

        }


        /* =====================================================
           CONTROL CENTER
        ===================================================== */

        #controlCenterOverlay {

            position: fixed;

            inset: 0;

            z-index: 500;

            display: none;

            background: rgba(0,0,0,.45);

        }


        #controlCenterFrame {

            width: 100%;
            height: 100%;

            border: 0;

            display: block;

        }


        /* =====================================================
           SAFE AREA
        ===================================================== */

        @supports (
            padding:
            env(safe-area-inset-top)
        ) {

            .mara-header {

                padding-top:
                    env(safe-area-inset-top);

            }

        }


    </style>


    <!-- =====================================================
         STATUS BAR STYLE
    ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================================
     MARA OS — MAIN FRAME
========================================================= -->

<iframe
    class="mara-iframe"
    id="mara-main-frame"
    frameborder="0"
    title="MARA OS">
</iframe>


<!-- =========================================================
     MARA OS — INTRO OVERLAY
========================================================= -->

<div
    id="mara-intro-overlay"
>

    <iframe
        id="mara-intro-frame"
        src="ux/intro.html"
        frameborder="0"
        title="MARA OS Intro">
    </iframe>

</div>


<!-- =========================================================
     MARA OS — STATUS BAR
========================================================= -->

<div class="mara-header">


    <div
        class="clock"
        id="clock"
    >
        00:00
    </div>


    <div class="battery">


        <span id="battery-percent">
            --%
        </span>


        <div class="battery-icon">

            <div
                class="battery-level"
                id="battery-level">
            </div>

        </div>


    </div>


</div>


<!-- =========================================================
     MARA OS — CONTROL CENTER
========================================================= -->

<div
    id="controlCenterOverlay"
>

    <iframe
        id="controlCenterFrame"
        src="ux/control-center.html"
        frameborder="0"
        title="MARA Control Center">
    </iframe>

</div>


<!-- =========================================================
     CORE SCRIPT
========================================================= -->

<script src="script.js"></script>


<!-- =========================================================
     MARA ENGINE SINGLE
     
     WAJIB DIMUAT SEBELUM BUILD.JS
========================================================= -->

<script src="engine-single.js"></script>


<!-- =========================================================
     MARA BUILD ENGINE
========================================================= -->

<script src="ux/build.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           ELEMENT
        ===================================================== */

        const introOverlay =
            document.getElementById(
                "mara-intro-overlay"
            );


        const introFrame =
            document.getElementById(
                "mara-intro-frame"
            );


        const mainFrame =
            document.getElementById(
                "mara-main-frame"
            );


        /* =====================================================
           STATE
        ===================================================== */

        let introLoaded =
            false;


        let introFinished =
            false;


        let overlayClosed =
            false;


        let mainLoaded =
            false;


        /* =====================================================
           MAIN FRAME
        ===================================================== */

        function loadMainFrame() {

            if (
                !mainFrame
            ) {

                console.error(
                    "[MARA OS] Main iframe tidak ditemukan."
                );

                return;

            }


            /*
             * Jangan memuat halaman sembarangan.
             *
             * build.js / MARAEngineSingle akan
             * menentukan runtime aktif.
             *
             * Jika build engine menyediakan API
             * loadActiveFile(), gunakan itu.
             */

            if (
                window.MARAEngineSingle &&
                typeof
                    window.MARAEngineSingle
                        .loadActiveFile
                    === "function"
            ) {

                window.MARAEngineSingle
                    .loadActiveFile(
                        "home-screen.html"
                    )
                    .then(
                        function (url) {

                            if (
                                url
                            ) {

                                mainFrame.src =
                                    url;

                                console.log(
                                    "[MARA OS] ACTIVE BUILD → HOME SCREEN"
                                );

                            }

                        }
                    )
                    .catch(
                        function (error) {

                            console.warn(
                                "[MARA OS] Gagal memuat Home Screen dari ACTIVE BUILD.",
                                error
                            );

                        }
                    );

                return;

            }


            /*
             * Fallback.
             *
             * Hanya digunakan jika engine
             * belum menyediakan ACTIVE BUILD.
             */

            mainFrame.src =
                "ux/home-screen.html";

            console.log(
                "[MARA OS] HOME SCREEN FALLBACK"
            );

        }


        /* =====================================================
           MAIN FRAME LOAD
        ===================================================== */

        if (
            mainFrame
        ) {

            mainFrame.addEventListener(
                "load",
                function () {

                    mainLoaded =
                        true;

                    console.log(
                        "[MARA OS] Main frame loaded."
                    );

                }
            );

        }


        /* =====================================================
           CLOSE INTRO
        ===================================================== */

        function closeIntro(
            reason
        ) {

            if (
                overlayClosed
            ) {

                return;

            }


            overlayClosed =
                true;


            console.log(
                "[MARA OS] Intro selesai:",
                reason
            );


            /*
             * Pastikan Home Screen mulai
             * dimuat sebelum intro ditutup.
             */

            loadMainFrame();


            /*
             * Beri waktu sedikit agar
             * iframe utama mulai mengambil
             * resource.
             */

            setTimeout(
                function () {

                    if (
                        !introOverlay
                    ) {

                        return;

                    }


                    introOverlay.classList.add(
                        "hide"
                    );


                    setTimeout(
                        function () {

                            try {

                                if (
                                    introFrame
                                ) {

                                    introFrame.src =
                                        "about:blank";

                                }

                            } catch (
                                error
                            ) {

                                console.warn(
                                    "[MARA OS] Intro cleanup error:",
                                    error
                                );

                            }


                            try {

                                introOverlay.remove();

                            } catch (
                                error
                            ) {

                                console.warn(
                                    "[MARA OS] Overlay cleanup error:",
                                    error
                                );

                            }


                            console.log(
                                "[MARA OS] Intro overlay removed."
                            );

                        },
                        1000
                    );

                },
                100
            );

        }


        /* =====================================================
           MESSAGE HANDLER
        ===================================================== */

        function handleIntroMessage(
            event
        ) {


            /*
             * Hanya menerima pesan dari
             * iframe intro.
             */

            if (
                !introFrame ||
                event.source !==
                    introFrame.contentWindow
            ) {

                return;

            }


            const data =
                event.data;


            if (
                !data ||
                typeof data !==
                    "object"
            ) {

                return;

            }


            const type =
                data.type;


            /* =================================================
               INTRO READY
            ================================================= */

            if (
                type ===
                "MARA_INTRO_READY"
            ) {

                console.log(
                    "[MARA OS] Intro READY."
                );


                return;

            }


            /* =================================================
               INDEX READY
            ================================================= */

            if (
                type ===
                "MARA_INDEX_READY_ACK"
            ) {

                console.log(
                    "[MARA OS] Intro menerima INDEX READY."
                );


                return;

            }


            /* =================================================
               UPDATE STARTED
            ================================================= */

            if (
                type ===
                "MARA_UPDATE_STARTED"
            ) {

                console.log(
                    "[MARA OS] UPDATE STARTED",
                    data
                );


                return;

            }


            /* =================================================
               DOWNLOADING
            ================================================= */

            if (
                type ===
                "MARA_UPDATE_DOWNLOADING"
            ) {

                console.log(
                    "[MARA OS] UPDATE DOWNLOADING",
                    data
                );


                return;

            }


            /* =================================================
               VERIFYING
            ================================================= */

            if (
                type ===
                "MARA_UPDATE_VERIFYING"
            ) {

                console.log(
                    "[MARA OS] UPDATE VERIFYING",
                    data
                );


                return;

            }


            /* =================================================
               INSTALLING
            ================================================= */

            if (
                type ===
                "MARA_UPDATE_INSTALLING"
            ) {

                console.log(
                    "[MARA OS] UPDATE INSTALLING",
                    data
                );


                return;

            }


            /* =================================================
               UPDATE FINISHED
            ================================================= */

            if (
                type ===
                "MARA_UPDATE_FINISHED"
            ) {

                console.log(
                    "[MARA OS] UPDATE FINISHED",
                    data
                );


                /*
                 * Update selesai.
                 *
                 * Intro belum tentu selesai,
                 * jadi kita hanya mencatat status.
                 */

                return;

            }


            /* =================================================
               NO UPDATE
            ================================================= */

            if (
                type ===
                "MARA_NO_UPDATE"
            ) {

                console.log(
                    "[MARA OS] NO UPDATE"
                );


                return;

            }


            /* =================================================
               UPDATE ERROR
            ================================================= */

            if (
                type ===
                "MARA_UPDATE_ERROR"
            ) {

                console.warn(
                    "[MARA OS] UPDATE ERROR",
                    data
                );


                /*
                 * Jangan membuat OS gagal boot.
                 *
                 * Jika masih ada ACTIVE BUILD,
                 * build tersebut tetap digunakan.
                 */

                return;

            }


            /* =================================================
               INTRO FINISHED
            ================================================= */

            if (
                type ===
                "MARA_INTRO_FINISHED"
            ) {

                introFinished =
                    true;


                console.log(
                    "[MARA OS] INTRO FINISHED"
                );


                closeIntro(
                    "MARA_INTRO_FINISHED"
                );


                return;

            }


            /* =================================================
               DIRECT BOOT
            ================================================= */

            if (
                type ===
                "MARA_BOOT_READY"
            ) {

                introFinished =
                    true;


                console.log(
                    "[MARA OS] BOOT READY"
                );


                closeIntro(
                    "MARA_BOOT_READY"
                );


                return;

            }

        }


        /* =====================================================
           MESSAGE LISTENER
        ===================================================== */

        window.addEventListener(
            "message",
            handleIntroMessage
        );


        /* =====================================================
           INTRO FRAME LOAD
        ===================================================== */

        if (
            introFrame
        ) {

            introFrame.addEventListener(
                "load",
                function () {

                    introLoaded =
                        true;


                    console.log(
                        "[MARA OS] intro.html loaded."
                    );


                    /*
                     * Kirim signal bahwa
                     * index.html siap.
                     */

                    try {

                        introFrame.contentWindow
                            .postMessage(
                                {
                                    type:
                                        "MARA_INDEX_READY"
                                },
                                "*"
                            );

                    } catch (
                        error
                    ) {

                        console.warn(
                            "[MARA OS] Gagal mengirim INDEX_READY.",
                            error
                        );

                    }

                }
            );

        }


        /* =====================================================
           ENGINE CONNECTION
        ===================================================== */

        function connectEngine() {

            if (
                !window.MARAEngineSingle
            ) {

                console.warn(
                    "[MARA OS] MARAEngineSingle belum tersedia."
                );


                return false;

            }


            console.log(
                "[MARA OS] MARAEngineSingle detected."
            );


            /*
             * ENGINE READY
             */

            MARAEngineSingle.on(
                "ready",
                function (
                    data
                ) {

                    console.log(
                        "[MARA ENGINE] READY",
                        data
                    );

                }
            );


            /*
             * DOWNLOAD
             */

            MARAEngineSingle.on(
                "download:progress",
                function (
                    data
                ) {

                    console.log(
                        "[MARA ENGINE] DOWNLOAD",
                        data.progress + "%",
                        data.path
                    );

                }
            );


            /*
             * VERIFY
             */

            MARAEngineSingle.on(
                "verify:success",
                function (
                    data
                ) {

                    console.log(
                        "[MARA ENGINE] VERIFY SUCCESS",
                        data
                    );

                }
            );


            /*
             * INSTALL
             */

            MARAEngineSingle.on(
                "install:complete",
                function (
                    data
                ) {

                    console.log(
                        "[MARA ENGINE] INSTALL SUCCESS",
                        data
                    );

                }
            );


            /*
             * ACTIVE BUILD
             */

            MARAEngineSingle.on(
                "build:active",
                function (
                    data
                ) {

                    console.log(
                        "[MARA ENGINE] ACTIVE BUILD",
                        data
                    );

                }
            );


            /*
             * UPDATE COMPLETE
             */

            MARAEngineSingle.on(
                "update:complete",
                function (
                    data
                ) {

                    console.log(
                        "[MARA ENGINE] UPDATE COMPLETE",
                        data
                    );

                }
            );


            /*
             * UPDATE ERROR
             */

            MARAEngineSingle.on(
                "update:error",
                function (
                    data
                ) {

                    console.error(
                        "[MARA ENGINE] UPDATE ERROR",
                        data
                    );

                }
            );


            return true;

        }


        /* =====================================================
           CONNECT ENGINE
        ===================================================== */

        connectEngine();


        /* =====================================================
           INTRO FAILSAFE
        ===================================================== */

        const INTRO_FAILSAFE =
            10 * 60 * 1000;


        setTimeout(
            function () {

                if (
                    overlayClosed
                ) {

                    return;

                }


                console.warn(
                    "[MARA OS] Intro failsafe."
                );


                /*
                 * Jangan biarkan aplikasi
                 * terkunci selamanya pada intro.
                 */

                closeIntro(
                    "failsafe"
                );

            },
            INTRO_FAILSAFE
        );


        /* =====================================================
           DEBUG API
        ===================================================== */

        window.MARA_INTRO_CONTROLLER = {

            getState:
                function () {

                    return {

                        introLoaded:
                            introLoaded,

                        introFinished:
                            introFinished,

                        overlayClosed:
                            overlayClosed,

                        mainLoaded:
                            mainLoaded

                    };

                },


            close:
                function (
                    reason
                ) {

                    closeIntro(
                        reason ||
                        "manual"
                    );

                },


            getEngine:
                function () {

                    return (
                        window.MARAEngineSingle ||
                        null
                    );

                },


            getMainFrame:
                function () {

                    return (
                        mainFrame ||
                        null
                    );

                }

        };


        /* =====================================================
           READY
        ===================================================== */

        console.log(
            "[MARA OS] INDEX.HTML TAHAP 1 READY."
        );

    }
);

</script>


</body>
</html>
