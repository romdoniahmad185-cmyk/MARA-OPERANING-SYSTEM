<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>MARA OS</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    position: fixed;
    inset: 0;
}


/* =====================================================
   MARA OS BACKGROUND
===================================================== */

#mara-os {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            circle at 50% 45%,
            #10201e 0%,
            #07110f 38%,
            #020605 72%,
            #000 100%
        );
}


/* =====================================================
   INTRO OVERLAY
===================================================== */

#intro-overlay {
    position: fixed;
    inset: 0;
    z-index: 999999;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #0b1c1a 0%,
            #04100e 35%,
            #010505 70%,
            #000 100%
        );

    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#intro-overlay.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}


/* =====================================================
   AMBIENT LIGHT
===================================================== */

.ambient-light {
    position: absolute;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.15),
            rgba(0,201,167,.08) 34%,
            transparent 70%
        );

    filter: blur(42px);

    animation:
        ambientPulse
        6s
        ease-in-out
        infinite;
}

.ambient-light-2 {
    position: absolute;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(124,255,203,.10),
            transparent 70%
        );

    filter: blur(30px);

    animation:
        ambientPulse2
        8s
        ease-in-out
        infinite;
}

.ambient-ring {
    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    border:
        1px solid
        rgba(124,255,203,.07);

    animation:
        ringPulse
        7s
        ease-in-out
        infinite;
}

.ambient-ring-2 {
    position: absolute;

    width: 390px;
    height: 390px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0,229,255,.035);

    animation:
        ringPulse2
        9s
        ease-in-out
        infinite;
}


/* =====================================================
   INTRO CONTENT
===================================================== */

.intro-content {
    position: relative;
    z-index: 10;

    width: 100%;
    min-height: 100%;

    padding:
        20px
        20px
        120px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}


/* =====================================================
   LOGO
===================================================== */

.logo-container {
    position: relative;

    width: 225px;
    height: 225px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation:
        logoFloat
        6s
        ease-in-out
        infinite;
}

.logo-container::before {
    content: "";

    position: absolute;
    inset: 20px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.13),
            transparent 70%
        );

    filter: blur(25px);

    animation:
        logoGlow
        5s
        ease-in-out
        infinite;
}

.mara-logo {
    width: 100%;
    height: 100%;
    overflow: visible;
}


/* =====================================================
   SVG FLOW
===================================================== */

.flow-main,
.flow-second {
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;

    filter:
        drop-shadow(
            0 0 7px
            rgba(0,229,255,.30)
        );

    animation:
        drawFlow
        2.8s
        cubic-bezier(.65,0,.35,1)
        forwards;
}

.flow-second {
    animation-delay: .35s;
}

.central-flow {
    stroke-dasharray: 180;
    stroke-dashoffset: 180;

    animation:
        drawCentral
        .9s
        ease
        forwards;

    animation-delay: 2.45s;
}

.flow-point {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        pointAppear
        .8s
        ease
        forwards;

    animation-delay: 3s;
}


/* =====================================================
   LOGO SHINE
===================================================== */

.logo-shine {
    position: absolute;

    width: 210px;
    height: 210px;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 250deg,
            rgba(255,255,255,.13) 285deg,
            transparent 320deg,
            transparent 360deg
        );

    opacity: 0;

    animation:
        shineRotate
        5s
        linear
        infinite;

    animation-delay: 2.7s;
}


/* =====================================================
   INTRO TEXT
===================================================== */

.os-name {
    margin-top: -5px;

    font-size: 36px;
    font-weight: 600;

    letter-spacing: 7px;

    color: #fff;

    opacity: 0;
    transform: translateY(18px);

    text-shadow:
        0 0 20px
        rgba(0,229,255,.18);

    animation:
        textReveal
        1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 3.15s;
}

.os-subtitle {
    margin-top: 10px;

    font-size: 9px;
    letter-spacing: 3px;

    color:
        rgba(255,255,255,.4);

    opacity: 0;

    animation:
        textReveal
        .9s
        ease
        forwards;

    animation-delay: 3.55s;
}

.os-version {
    margin-top: 17px;

    font-size: 8px;
    line-height: 1.9;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.3);

    opacity: 0;

    animation:
        fadeIn
        .8s
        ease
        forwards;

    animation-delay: 3.95s;
}


/* =====================================================
   BOOT AREA
===================================================== */

.boot-area {
    position: absolute;

    left: 50%;
    bottom: 30px;

    width:
        min(
            80vw,
            500px
        );

    transform:
        translateX(-50%);

    display: flex;
    flex-direction: column;
    align-items: center;

    z-index: 50;

    opacity: 0;

    animation:
        bootAreaReveal
        .8s
        ease
        forwards;

    animation-delay: 4s;
}


/* =====================================================
   BOOT STATUS
===================================================== */

.boot-status {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 10px;

    font-size: 8px;
    letter-spacing: 2.5px;

    color:
        rgba(124,255,203,.55);

    text-align: center;
}


/* =====================================================
   PROGRESS CONTAINER
===================================================== */

.boot-progress-container {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;
}


/* =====================================================
   PROGRESS BAR
===================================================== */

.boot-progress {
    position: relative;

    flex: 1;

    height: 4px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.04);

    box-shadow:
        inset 0 0 5px
        rgba(0,0,0,.5);
}

.boot-progress-fill {
    position: absolute;

    left: 0;
    top: 0;

    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #00c9a7,
            #7cffcb
        );

    box-shadow:
        0 0 8px
        rgba(0,229,255,.65);

    transition:
        width .15s linear;
}

.boot-progress-fill::after {
    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 40px;
    height: 100%;

    background:
        rgba(255,255,255,.75);

    filter: blur(5px);

    opacity: .75;
}


/* =====================================================
   PERCENTAGE
===================================================== */

.boot-percent {
    min-width: 36px;

    font-size: 8px;
    letter-spacing: 1px;

    text-align: right;

    color:
        rgba(124,255,203,.7);
}


/* =====================================================
   BOOT MESSAGE
===================================================== */

.boot-message {
    width: 100%;

    margin-top: 9px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 7px;
    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.28);
}


/* =====================================================
   PARTICLES
===================================================== */

.tech-particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.75);

    opacity: 0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;
}


/* =====================================================
   UPDATE SPINNER
===================================================== */

#mara-update-spinner {
    position: fixed;

    left: 50%;
    bottom: 92px;

    z-index: 100000;

    transform:
        translateX(-50%);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;
    visibility: hidden;

    pointer-events: none;
}

#mara-update-spinner.show {
    opacity: 1;
    visibility: visible;
}


/* =====================================================
   SPINNER
===================================================== */

.spinner-ring {
    position: relative;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-top-color:
        #00E5FF;

    border-right-color:
        #00C9A7;

    box-shadow:
        0 0 12px
        rgba(0,229,255,.12);

    animation:
        maraSpinnerRotate
        1.1s
        linear
        infinite;
}

.spinner-ring::before {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: 50%;

    border:
        1px solid
        rgba(124,255,203,.15);

    border-left-color:
        #7CFFCB;

    animation:
        maraSpinnerRotateReverse
        1.7s
        linear
        infinite;
}

.spinner-core {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    margin-left: -2.5px;
    margin-top: -2.5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.9),

        0 0 14px
        rgba(0,229,255,.6);

    animation:
        maraCorePulse
        1.4s
        ease-in-out
        infinite;
}

.spinner-text {
    margin-top: 11px;

    font-size: 7px;
    letter-spacing: 2px;

    color:
        rgba(255,255,255,.55);

    white-space: nowrap;
}

.spinner-subtext {
    margin-top: 5px;

    font-size: 6px;
    letter-spacing: 1.5px;

    color:
        rgba(124,255,203,.35);

    white-space: nowrap;
}


/* =====================================================
   SPINNER STATES
===================================================== */

#mara-update-spinner.success .spinner-ring {
    border-top-color:
        #7CFFCB;

    border-right-color:
        #00C9A7;
}

#mara-update-spinner.update .spinner-ring {
    border-top-color:
        #00E5FF;

    border-right-color:
        #7CFFCB;
}

#mara-update-spinner.error .spinner-ring {
    border-top-color:
        #FFB86C;

    border-right-color:
        #FF8A65;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes drawFlow {
    from {
        stroke-dashoffset: 1500;
    }

    to {
        stroke-dashoffset: 0;
    }
}

@keyframes drawCentral {
    from {
        stroke-dashoffset: 180;
    }

    to {
        stroke-dashoffset: 0;
    }
}

@keyframes pointAppear {
    0% {
        opacity: 0;
        transform: scale(.1);
    }

    60% {
        opacity: 1;
        transform: scale(1.35);
    }

    100% {
        opacity: .9;
        transform: scale(1);
    }
}

@keyframes textReveal {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes bootAreaReveal {
    from {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(12px);
    }

    to {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}

@keyframes logoFloat {
    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}

@keyframes logoGlow {
    0%,
    100% {
        transform: scale(.85);
        opacity: .35;
    }

    50% {
        transform: scale(1.1);
        opacity: .8;
    }
}

@keyframes ambientPulse {
    0%,
    100% {
        transform: scale(.85);
        opacity: .35;
    }

    50% {
        transform: scale(1.12);
        opacity: .8;
    }
}

@keyframes ambientPulse2 {
    0%,
    100% {
        transform: scale(.8);
        opacity: .15;
    }

    50% {
        transform: scale(1.2);
        opacity: .5;
    }
}

@keyframes ringPulse {
    0%,
    100% {
        transform: scale(.92);
        opacity: .2;
    }

    50% {
        transform: scale(1.06);
        opacity: .55;
    }
}

@keyframes ringPulse2 {
    0%,
    100% {
        transform: scale(.94);
        opacity: .1;
    }

    50% {
        transform: scale(1.08);
        opacity: .35;
    }
}

@keyframes shineRotate {
    from {
        transform: rotate(0deg);
        opacity: 0;
    }

    25% {
        opacity: .45;
    }

    60% {
        opacity: .15;
    }

    to {
        transform: rotate(360deg);
        opacity: 0;
    }
}

@keyframes particleFloat {
    0% {
        transform:
            translate3d(
                0,
                20px,
                0
            )
            scale(.4);

        opacity: 0;
    }

    20% {
        opacity: .65;
    }

    70% {
        opacity: .25;
    }

    100% {
        transform:
            translate3d(
                var(--move-x),
                -100px,
                0
            )
            scale(1);

        opacity: 0;
    }
}

@keyframes maraSpinnerRotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes maraSpinnerRotateReverse {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes maraCorePulse {
    0%,
    100% {
        transform: scale(.7);
        opacity: .5;
    }

    50% {
        transform: scale(1.25);
        opacity: 1;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px) {

    .intro-content {
        padding:
            10px
            15px
            115px;
    }

    .logo-container {
        width: 190px;
        height: 190px;
    }

    .logo-shine {
        width: 175px;
        height: 175px;
    }

    .os-name {
        font-size: 29px;
        letter-spacing: 5px;
    }

    .os-subtitle {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .os-version {
        font-size: 8px;
        margin-top: 14px;
    }

    .boot-area {
        width: 78vw;
        bottom: 27px;
    }

    .boot-status {
        font-size: 7px;
        letter-spacing: 2px;
    }

    .boot-message {
        font-size: 6px;
    }

    #mara-update-spinner {
        bottom: 80px;
    }
}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media (max-height:650px) {

    .logo-container {
        width: 145px;
        height: 145px;
    }

    .logo-shine {
        width: 135px;
        height: 135px;
    }

    .os-name {
        font-size: 25px;
    }

    .os-version {
        margin-top: 9px;
    }

    .boot-area {
        bottom: 18px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     MARA BACKGROUND

<main id="mara-os"></main>


<!-- =====================================================
     INTRO

<div id="intro-overlay">

    <div class="ambient-light"></div>

    <div class="intro-content">


        <!-- =================================================

        <div class="logo-container">

                    stroke="url(#maraFlow)"

                    stroke-linejoin="round"
                />


                <path
                    class="flow-second"
                    d="
                        M396 338
                        C346 400 270 408 206 373
                        C151 343 130 298 154 256
                        C178 213 239 199 288 224
                        C331 246 348 284 331 318
                        C313 354 262 364 221 343
                        C186 325 172 294 186 268
                    "
                    stroke="url(#maraFlow)"
                    stroke-width="48"
                    stroke-linecap="round"

                <path
                    class="central-flow"
                    d="
                        M181 256

                    stroke="url(#maraFlowHighlight)"

                <circle

        </div>


        <!-- =================================================
             NAME

        <div class="os-name">

             SUBTITLE

        <div class="os-subtitle">

        </div>


        <!-- =================================================
             VERSION / BUILD
        ================================================= -->

        <div class="os-version">

            Version
            <span id="mara-version">...</span>

            <br>

            Build
            <span id="mara-build">...</span>

        </div>

    </div>


    <!-- =================================================
         BOOT AREA
    ================================================= -->

    <div class="boot-area">


        <div
            class="boot-status"
            id="boot-status"
        >
            INITIALIZING MARA SYSTEM
        </div>


        <div class="boot-progress-container">

            <div class="boot-progress">

                <div
                    class="boot-progress-fill"
                    id="boot-progress-fill"
                ></div>

            </div>


            <div
                class="boot-percent"
                id="boot-percent"
            >
                0%
            </div>

        </div>


        <div class="boot-message">

            <span id="boot-message">
                PREPARING MARA OS
            </span>


            <span id="boot-stage">
                BOOT
            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     ENGINE SINGLE
     
     ENGINE HANYA MENJADI SUMBER STATUS.
===================================================== -->

<script>

/* =====================================================
   MARA CONFIGURATION
===================================================== */

const MARA_CONFIG = {

    /*
     * SATU-SATUNYA SUMBER VERSION + BUILD
     * UNTUK INTRO.
     */

    manifestURL:
        "https://romdoniahmad185-cmyk.github.io/mara-os-updates/stable/update-manifest.json"

};


/* =====================================================
   MARA STATE
===================================================== */

const MARA_STATE = {

    manifestLoaded:
        false,

    engineWorking:
        false,

    engineFinished:
        false,

    bootSent:
        false,

    version:
        null,

    build:
        null,

    channel:
        null,

    status:
        null,

    progress:
        0,

    error:
        null

};


/* =====================================================
   LOG
===================================================== */

function maraLog(...args) {

    console.log(
        "[MARA INTRO]",
        ...args
    );

}

function maraWarn(...args) {

    console.warn(
        "[MARA INTRO]",
        ...args
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const versionElement =
    document.getElementById(
        "mara-version"
    );

const buildElement =
    document.getElementById(
        "mara-build"
    );


/* =====================================================
   BOOT UI
===================================================== */

const maraBootUI = {

    fill:
        document.getElementById(
            "boot-progress-fill"
        ),

    percent:
        document.getElementById(
            "boot-percent"
        ),

    status:
        document.getElementById(
            "boot-status"
        ),

    message:
        document.getElementById(
            "boot-message"
        ),

    stage:
        document.getElementById(
            "boot-stage"
        ),

    progress:
        0,


    setProgress(value) {

        const numeric =
            Number(value);


        if (
            !Number.isFinite(
                numeric
            )
        ) {
            return;
        }


        const safe =
            Math.max(
                0,
                Math.min(
                    100,
                    Math.round(
                        numeric
                    )
                )
            );


        /*
         * Progress hanya boleh maju.
         */

        this.progress =
            Math.max(
                this.progress,
                safe
            );


        if (this.fill) {

            this.fill.style.width =
                this.progress + "%";

        }


        if (this.percent) {

            this.percent.textContent =
                this.progress + "%";

        }

    },


    setStatus(
        status,
        message,
        stage
    ) {

        if (this.status) {

            this.status.textContent =
                status || "";

        }


        if (this.message) {

            this.message.textContent =
                message || "";

        }


        if (this.stage) {

            this.stage.textContent =
                stage || "";

        }

    }

};


/* =====================================================
   SPINNER
===================================================== */

const maraSpinner = {

    element:
        document.getElementById(
            "mara-update-spinner"
        ),

    show() {

        if (this.element) {

            this.element.classList.add(
                "show"
            );

        }

    },

    hide() {

        if (this.element) {

            this.element.classList.remove(
                "show"
            );

        }

    }

};


/* =====================================================
   PARTICLES
===================================================== */

function createParticles() {

    const intro =
        document.getElementById(
            "intro-overlay"
        );


    if (!intro) {
        return;
    }


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "tech-particle";


        particle.style.left =
            (
                Math.random() * 100
            ) + "%";


        particle.style.top =
            (
                40 +
                Math.random() * 45
            ) + "%";


        particle.style.setProperty(
            "--duration",
            (
                4 +
                Math.random() * 5
            ) + "s"
        );


        particle.style.setProperty(
            "--move-x",
            (
                Math.random() * 100 -
                50
            ) + "px"
        );


        particle.style.animationDelay =
            (
                Math.random() * 3
            ) + "s";


        intro.appendChild(
            particle
        );

    }

}


/* =====================================================
   LOAD REMOTE MANIFEST
===================================================== */

async function loadMaraManifest() {

    maraBootUI.setProgress(
        5
    );


    maraBootUI.setStatus(
        "CHECKING SYSTEM",
        "Menghubungkan ke repository MARA OS",
        "NETWORK"
    );


    const response =
        await fetch(
            MARA_CONFIG.manifestURL,
            {

                method:
                    "GET",

                cache:
                    "no-store",

                headers: {

                    "Accept":
                        "application/json"

                }

            }
        );


    if (!response.ok) {

        throw new Error(
            "Manifest HTTP " +
            response.status
        );

    }


    maraBootUI.setProgress(
        15
    );


    maraBootUI.setStatus(
        "MANIFEST RECEIVED",
        "Membaca informasi MARA OS",
        "MANIFEST"
    );


    const manifest =
        await response.json();


    if (
        !manifest ||
        typeof manifest !==
            "object"
    ) {

        throw new Error(
            "Manifest tidak valid."
        );

    }


    if (
        manifest.version ===
            undefined ||
        manifest.build ===
            undefined
    ) {

        throw new Error(
            "Manifest tidak memiliki version/build."
        );

    }


    return manifest;

}


/* =====================================================
   DISPLAY MANIFEST
===================================================== */

function displayMaraManifest(
    manifest
) {

    MARA_STATE.version =
        String(
            manifest.version
        );


    MARA_STATE.build =
        String(
            manifest.build
        );


    MARA_STATE.channel =
        manifest.channel !==
        undefined
            ? String(
                manifest.channel
            )
            : null;


    MARA_STATE.status =
        manifest.status !==
        undefined
            ? String(
                manifest.status
            )
            : null;


    if (versionElement) {

        versionElement.textContent =
            MARA_STATE.version;

    }


    if (buildElement) {

        buildElement.textContent =
            MARA_STATE.build;

    }


    /*
     * Status remote disimpan
     * supaya bisa dibaca oleh
     * sistem lain bila diperlukan.
     */

    window.MARA_REMOTE_STATUS = {

        version:
            MARA_STATE.version,

        build:
            MARA_STATE.build,

        channel:
            MARA_STATE.channel,

        status:
            MARA_STATE.status,

        manifest:
            manifest,

        timestamp:
            Date.now()

    };


    maraLog(
        "REMOTE VERSION:",
        MARA_STATE.version
    );


    maraLog(
        "REMOTE BUILD:",
        MARA_STATE.build
    );

}


/* =====================================================
   ENGINE ACCESS
===================================================== */

function getMaraEngine() {

    return (
        window.MARAEngineSingle ||
        null
    );

}


/* =====================================================
   SEND BOOT READY
===================================================== */

function sendBootReady() {

    if (
        MARA_STATE.bootSent
    ) {

        return;

    }


    if (
        !MARA_STATE.manifestLoaded
    ) {

        return;

    }


    if (
        !MARA_STATE.engineFinished
    ) {

        return;

    }


    MARA_STATE.bootSent =
        true;


    maraBootUI.setProgress(
        100
    );


    maraBootUI.setStatus(
        "MARA OS READY",
        "System initialization complete",
        "READY"
    );


    maraSpinner.hide();


    maraLog(
        "Mengirim MARA_BOOT_READY ke index.html."
    );


    window.parent.postMessage(
        {

            type:
                "MARA_BOOT_READY",

            version:
                MARA_STATE.version,

            build:
                MARA_STATE.build,

            channel:
                MARA_STATE.channel,

            source:
                "intro"

        },
        "*"
    );

}


/* =====================================================
   ENGINE IDLE
===================================================== */

function engineIdle() {

    maraLog(
        "ENGINE IDLE — tidak ada pekerjaan."
    );


    MARA_STATE.engineWorking =
        false;

    MARA_STATE.engineFinished =
        true;


    maraSpinner.hide();


    maraBootUI.setProgress(
        100
    );


    maraBootUI.setStatus(
        "MARA OS READY",
        "Tidak ada update yang perlu diproses",
        "READY"
    );


    sendBootReady();

}


/* =====================================================
   ENGINE WORKING
===================================================== */

function engineWorking(
    data = {}
) {

    MARA_STATE.engineWorking =
        true;

    MARA_STATE.engineFinished =
        false;


    maraSpinner.show();


    maraBootUI.setStatus(
        "ENGINE WORKING",
        data.message ||
            "Engine sedang bekerja",
        data.phase ||
            "ENGINE"
    );


    if (
        Number.isFinite(
            Number(
                data.progress
            )
        )
    ) {

        maraBootUI.setProgress(
            Number(
                data.progress
            )
        );

    }


    maraLog(
        "ENGINE WORKING",
        data
    );

}


/* =====================================================
   ENGINE PROGRESS
===================================================== */

function engineProgress(
    data = {}
) {

    MARA_STATE.engineWorking =
        true;


    const progress =
        Number(
            data.progress
        );


    if (
        Number.isFinite(
            progress
        )
    ) {

        maraBootUI.setProgress(
            progress
        );

    }


    maraBootUI.setStatus(
        data.status ||
            "DOWNLOADING",
        data.message ||
            data.file ||
            "Memproses file MARA OS",
        data.phase ||
            "DOWNLOAD"
    );


    maraSpinner.show();


    maraLog(
        "ENGINE PROGRESS",
        data
    );

}


/* =====================================================
   ENGINE COMPLETE
===================================================== */

function engineComplete(
    data = {}
) {

    MARA_STATE.engineWorking =
        false;

    MARA_STATE.engineFinished =
        true;


    maraBootUI.setProgress(
        100
    );


    maraBootUI.setStatus(
        "ENGINE READY",
        data.message ||
            "Semua pekerjaan engine selesai",
        "READY"
    );


    maraSpinner.hide();


    maraLog(
        "ENGINE COMPLETE",
        data
    );


    sendBootReady();

}


/* =====================================================
   ENGINE ERROR
===================================================== */

function engineError(
    data = {}
) {

    MARA_STATE.engineWorking =
        false;

    MARA_STATE.error =
        data;


    maraSpinner.hide();


    maraBootUI.setStatus(
        "ENGINE ERROR",
        data.message ||
            data.error ||
            "Engine mengalami kesalahan",
        "ERROR"
    );


    maraLog(
        "ENGINE ERROR",
        data
    );

}


/* =====================================================
   CONNECT ENGINE
===================================================== */

function connectMaraEngine() {

    const engine =
        getMaraEngine();


    if (!engine) {

        /*
         * Untuk arsitektur baru,
         * engine boleh belum tersedia.
         *
         * Intro tidak akan menebak
         * bahwa engine selesai.
         */

        maraLog(
            "MARAEngineSingle belum tersedia."
        );


        return false;

    }


    maraLog(
        "MARAEngineSingle terdeteksi."
    );


    /*
     * =================================================
     * EVENT SYSTEM
     * =================================================
     */

    if (
        typeof engine.on ===
        "function"
    ) {

        engine.on(
            "idle",
            function(
                data
            ) {

                engineIdle();

            }
        );


        engine.on(
            "working",
            function(
                data
            ) {

                engineWorking(
                    data
                );

            }
        );


        engine.on(
            "progress",
            function(
                data
            ) {

                engineProgress(
                    data
                );

            }
        );


        engine.on(
            "complete",
            function(
                data
            ) {

                engineComplete(
                    data
                );

            }
        );


        engine.on(
            "error",
            function(
                data
            ) {

                engineError(
                    data
                );

            }
        );


        /*
         * Alias event agar engine
         * tetap fleksibel.
         */

        engine.on(
            "update:start",
            function(
                data
            ) {

                engineWorking(
                    data
                );

            }
        );


        engine.on(
            "download:progress",
            function(
                data
            ) {

                engineProgress(
                    data
                );

            }
        );


        engine.on(
            "update:complete",
            function(
                data
            ) {

                engineComplete(
                    data
                );

            }
        );


        engine.on(
            "update:none",
            function(
                data
            ) {

                engineIdle();

            }
        );


        engine.on(
            "no:update",
            function(
                data
            ) {

                engineIdle();

            }
        );


        engine.on(
            "update:error",
            function(
                data
            ) {

                engineError(
                    data
                );

            }
        );

    }


    /*
     * =================================================
     * INITIAL STATE
     * =================================================
     */

    if (
        typeof engine.getState ===
        "function"
    ) {

        try {

            const state =
                engine.getState();


            maraLog(
                "ENGINE INITIAL STATE",
                state
            );


            /*
             * Jika engine menyatakan
             * tidak sedang bekerja,
             * intro dapat langsung selesai.
             */

            if (
                state &&
                (
                    state.working ===
                        false ||
                    state.status ===
                        "idle" ||
                    state.status ===
                        "none"
                )
            ) {

                engineIdle();

            }


            /*
             * Jika engine sudah selesai.
             */

            else if (
                state &&
                (
                    state.finished ===
                        true ||
                    state.complete ===
                        true ||
                    state.ready ===
                        true
                )
            ) {

                engineComplete(
                    state
                );

            }


            /*
             * Jika engine sedang bekerja.
             */

            else if (
                state &&
                state.working ===
                    true
            ) {

                engineWorking(
                    state
                );

            }

        }

        catch (
            error
        ) {

            maraWarn(
                "Gagal membaca engine state.",
                error
            );

        }

    }


    return true;

}


/* =====================================================
   GLOBAL ENGINE MESSAGE BRIDGE
===================================================== */

/*
 * Engine-single.js dapat mengirim
 * status melalui postMessage.
 *
 * Intro hanya menerima dan
 * menampilkan status tersebut.
 */

window.addEventListener(
    "message",
    function(
        event
    ) {

        const data =
            event.data;


        if (
            !data ||
            typeof data !==
                "object"
        ) {

            return;

        }


        switch (
            data.type
        ) {

            case "MARA_ENGINE_IDLE":

                engineIdle();

                break;


            case "MARA_ENGINE_WORKING":

                engineWorking(
                    data
                );

                break;


            case "MARA_ENGINE_PROGRESS":

                engineProgress(
                    data
                );

                break;


            case "MARA_ENGINE_COMPLETE":

                engineComplete(
                    data
                );

                break;


            case "MARA_ENGINE_ERROR":

                engineError(
                    data
                );

                break;

        }

    }
);


/* =====================================================
   START INTRO
===================================================== */

async function startMaraIntro() {

    maraLog(
        "MARA OS INTRO START"
    );


    createParticles();


    maraBootUI.setProgress(
        0
    );


    maraBootUI.setStatus(
        "INITIALIZING MARA SYSTEM",
        "Preparing MARA OS",
        "BOOT"
    );


    /*
     * =================================================
     * 1. BACA MANIFEST
     * =================================================
     */

    try {

        const manifest =
            await loadMaraManifest();


        displayMaraManifest(
            manifest
        );


        MARA_STATE.manifestLoaded =
            true;


        maraBootUI.setProgress(
            20
        );


        maraBootUI.setStatus(
            "MANIFEST READY",
            "Repository berhasil terhubung",
            "MANIFEST"
        );

    }

    catch (
        error
    ) {

        MARA_STATE.error =
            error;


        maraBootUI.setStatus(
            "MANIFEST ERROR",
            "Tidak dapat membaca repository",
            "ERROR"
        );


        maraWarn(
            "Manifest gagal:",
            error
        );


        /*
         * Untuk tahap pengujian,
         * jangan memalsukan version/build.
         *
         * Intro tetap mencoba
         * menghubungkan engine.
         */

    }


    /*
     * =================================================
     * 2. HUBUNGKAN ENGINE
     * =================================================
     */

    const connected =
        connectMaraEngine();


    /*
     * =================================================
     * 3. JIKA ENGINE TIDAK ADA
     * =================================================
     *
     * Jangan otomatis menganggap
     * engine selesai.
     *
     * Engine harus memberi keputusan.
     */

    if (!connected) {

        maraBootUI.setStatus(
            "ENGINE WAITING",
            "Menunggu MARA Engine",
            "ENGINE"
        );

    }


    /*
     * Jika engine sudah memberikan
     * keputusan secara sinkron,
     * sendBootReady() akan bekerja.
     */

    sendBootReady();

}


/* =====================================================
   DOM READY
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        startMaraIntro()
            .catch(
                error => {

                    maraWarn(
                        "Intro error:",
                        error
                    );

                }
            );

    }
);


/* =====================================================
   GLOBAL MARA BOOT API
===================================================== */

window.MARABoot = {

    getProgress() {

        return (
            maraBootUI.progress
        );

    },


    getState() {

        return {

            ...MARA_STATE,

            progress:
                maraBootUI.progress

        };

    },


    getManifest() {

        return (
            window.MARA_REMOTE_STATUS ||
            null
        );

    },


    getEngine() {

        return getMaraEngine();

    },


    requestStatus() {

        const engine =
            getMaraEngine();


        if (
            engine &&
            typeof engine.getState ===
                "function"
        ) {

            try {

                return engine.getState();

            }

            catch (
                error
            ) {

                maraWarn(
                    "Gagal membaca engine.",
                    error
                );

            }

        }


        return null;

    }

};


/* =====================================================
   FINAL LOG
===================================================== */

maraLog(
    "MARA INTRO LOADED."
);

</script>
