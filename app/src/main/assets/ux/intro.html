<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>MARA OS</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


body {

    position: fixed;

    inset: 0;

}


/* =====================================================
   MARA OS BACKGROUND
===================================================== */

#mara-os {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            circle at 50% 45%,
            #10201e 0%,
            #07110f 38%,
            #020605 72%,
            #000 100%
        );

}


/* =====================================================
   INTRO OVERLAY
===================================================== */

#intro-overlay {

    position: fixed;

    inset: 0;

    z-index: 999999;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #0b1c1a 0%,
            #04100e 35%,
            #010505 70%,
            #000 100%
        );

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

}


/*
 * INDEX.HTML yang menentukan kapan
 * overlay ini ditutup.
 *
 * INTRO TIDAK MENUTUP DIRINYA SENDIRI.
 */

#intro-overlay.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;

}


/* =====================================================
   AMBIENT LIGHT
===================================================== */

.ambient-light {

    position: absolute;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.15),
            rgba(0,201,167,.08) 34%,
            transparent 70%
        );

    filter: blur(42px);

    animation:
        ambientPulse
        6s
        ease-in-out
        infinite;

}


.ambient-light-2 {

    position: absolute;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(124,255,203,.10),
            transparent 70%
        );

    filter: blur(30px);

    animation:
        ambientPulse2
        8s
        ease-in-out
        infinite;

}


.ambient-ring {

    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    border:
        1px solid
        rgba(124,255,203,.07);

    animation:
        ringPulse
        7s
        ease-in-out
        infinite;

}


.ambient-ring-2 {

    position: absolute;

    width: 390px;
    height: 390px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0,229,255,.035);

    animation:
        ringPulse2
        9s
        ease-in-out
        infinite;

}


/* =====================================================
   INTRO CONTENT
===================================================== */

.intro-content {

    position: relative;

    z-index: 10;

    width: 100%;

    min-height: 100%;

    padding:
        20px
        20px
        120px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* =====================================================
   LOGO
===================================================== */

.logo-container {

    position: relative;

    width: 225px;
    height: 225px;

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        logoFloat
        6s
        ease-in-out
        infinite;

}


.logo-container::before {

    content: "";

    position: absolute;

    inset: 20px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.13),
            transparent 70%
        );

    filter: blur(25px);

    animation:
        logoGlow
        5s
        ease-in-out
        infinite;

}


.mara-logo {

    width: 100%;
    height: 100%;

    overflow: visible;

}


/* =====================================================
   SVG FLOW
===================================================== */

.flow-main,
.flow-second {

    stroke-dasharray: 1500;

    stroke-dashoffset: 1500;

    filter:
        drop-shadow(
            0 0 7px
            rgba(0,229,255,.30)
        );

    animation:
        drawFlow
        2.8s
        cubic-bezier(.65,0,.35,1)
        forwards;

}


.flow-second {

    animation-delay: .35s;

}


.central-flow {

    stroke-dasharray: 180;

    stroke-dashoffset: 180;

    animation:
        drawCentral
        .9s
        ease
        forwards;

    animation-delay: 2.45s;

}


.flow-point {

    opacity: 0;

    transform-box: fill-box;

    transform-origin: center;

    animation:
        pointAppear
        .8s
        ease
        forwards;

    animation-delay: 3s;

}


/* =====================================================
   LOGO SHINE
===================================================== */

.logo-shine {

    position: absolute;

    width: 210px;
    height: 210px;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 250deg,
            rgba(255,255,255,.13) 285deg,
            transparent 320deg,
            transparent 360deg
        );

    opacity: 0;

    animation:
        shineRotate
        5s
        linear
        infinite;

    animation-delay: 2.7s;

}


/* =====================================================
   INTRO TEXT
===================================================== */

.os-name {

    margin-top: -5px;

    font-size: 36px;

    font-weight: 600;

    letter-spacing: 7px;

    color: #fff;

    opacity: 0;

    transform: translateY(18px);

    text-shadow:
        0 0 20px
        rgba(0,229,255,.18);

    animation:
        textReveal
        1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 3.15s;

}


.os-subtitle {

    margin-top: 10px;

    font-size: 9px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.4);

    opacity: 0;

    animation:
        textReveal
        .9s
        ease
        forwards;

    animation-delay: 3.55s;

}


.os-version {

    margin-top: 17px;

    font-size: 8px;

    line-height: 1.9;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.3);

    opacity: 0;

    animation:
        fadeIn
        .8s
        ease
        forwards;

    animation-delay: 3.95s;

}


/* =====================================================
   BOOT AREA
===================================================== */

.boot-area {

    position: absolute;

    left: 50%;

    bottom: 30px;

    width:
        min(
            80vw,
            500px
        );

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    z-index: 50;

    opacity: 0;

    animation:
        bootAreaReveal
        .8s
        ease
        forwards;

    animation-delay: 4s;

}


/* =====================================================
   BOOT STATUS
===================================================== */

.boot-status {

    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 10px;

    font-size: 8px;

    letter-spacing: 2.5px;

    color:
        rgba(124,255,203,.55);

    text-align: center;

}


/* =====================================================
   PROGRESS CONTAINER
===================================================== */

.boot-progress-container {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

}


/* =====================================================
   PROGRESS BAR
===================================================== */

.boot-progress {

    position: relative;

    flex: 1;

    height: 4px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.04);

    box-shadow:
        inset 0 0 5px
        rgba(0,0,0,.5);

}


.boot-progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #00c9a7,
            #7cffcb
        );

    box-shadow:
        0 0 8px
        rgba(0,229,255,.65);

    transition:
        width .15s linear;

}


.boot-progress-fill::after {

    content: "";

    position: absolute;

    right: 0;
    top: 0;

    width: 40px;
    height: 100%;

    background:
        rgba(255,255,255,.75);

    filter: blur(5px);

    opacity: .75;

}


/* =====================================================
   PERCENTAGE
===================================================== */

.boot-percent {

    min-width: 36px;

    font-size: 8px;

    letter-spacing: 1px;

    text-align: right;

    color:
        rgba(124,255,203,.7);

}


/* =====================================================
   BOOT MESSAGE
===================================================== */

.boot-message {

    width: 100%;

    margin-top: 9px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 7px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.28);

}


/* =====================================================
   PARTICLES
===================================================== */

.tech-particle {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.75);

    opacity: 0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;

}


/* =====================================================
   UPDATE SPINNER
===================================================== */

#mara-update-spinner {

    position: fixed;

    left: 50%;

    bottom: 92px;

    z-index: 100000;

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}


#mara-update-spinner.show {

    opacity: 1;

    visibility: visible;

}


/* =====================================================
   SPINNER
===================================================== */

.spinner-ring {

    position: relative;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-top-color:
        #00E5FF;

    border-right-color:
        #00C9A7;

    box-shadow:
        0 0 12px
        rgba(0,229,255,.12);

    animation:
        maraSpinnerRotate
        1.1s
        linear
        infinite;

}


.spinner-ring::before {

    content: "";

    position: absolute;

    inset: 5px;

    border-radius: 50%;

    border:
        1px solid
        rgba(124,255,203,.15);

    border-left-color:
        #7CFFCB;

    animation:
        maraSpinnerRotateReverse
        1.7s
        linear
        infinite;

}


.spinner-core {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    margin-left: -2.5px;
    margin-top: -2.5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.9),

        0 0 14px
        rgba(0,229,255,.6);

    animation:
        maraCorePulse
        1.4s
        ease-in-out
        infinite;

}


.spinner-text {

    margin-top: 11px;

    font-size: 7px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.55);

    white-space: nowrap;

}


.spinner-subtext {

    margin-top: 5px;

    font-size: 6px;

    letter-spacing: 1.5px;

    color:
        rgba(124,255,203,.35);

    white-space: nowrap;

}


/* =====================================================
   SPINNER STATES
===================================================== */

#mara-update-spinner.success
.spinner-ring {

    border-top-color:
        #7CFFCB;

    border-right-color:
        #00C9A7;

}


#mara-update-spinner.update
.spinner-ring {

    border-top-color:
        #00E5FF;

    border-right-color:
        #7CFFCB;

}


#mara-update-spinner.error
.spinner-ring {

    border-top-color:
        #FFB86C;

    border-right-color:
        #FF8A65;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes drawFlow {

    from {
        stroke-dashoffset: 1500;
    }

    to {
        stroke-dashoffset: 0;
    }

}


@keyframes drawCentral {

    from {
        stroke-dashoffset: 180;
    }

    to {
        stroke-dashoffset: 0;
    }

}


@keyframes pointAppear {

    0% {
        opacity: 0;
        transform: scale(.1);
    }

    60% {
        opacity: 1;
        transform: scale(1.35);
    }

    100% {
        opacity: .9;
        transform: scale(1);
    }

}


@keyframes textReveal {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes bootAreaReveal {

    from {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(12px);
    }

    to {
        opacity: 1;
        transform:
            translateX(-50%)
            translateY(0);
    }

}


@keyframes logoFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


@keyframes logoGlow {

    0%,
    100% {
        transform: scale(.85);
        opacity: .35;
    }

    50% {
        transform: scale(1.1);
        opacity: .8;
    }

}


@keyframes ambientPulse {

    0%,
    100% {
        transform: scale(.85);
        opacity: .35;
    }

    50% {
        transform: scale(1.12);
        opacity: .8;
    }

}


@keyframes ambientPulse2 {

    0%,
    100% {
        transform: scale(.8);
        opacity: .15;
    }

    50% {
        transform: scale(1.2);
        opacity: .5;
    }

}


@keyframes ringPulse {

    0%,
    100% {
        transform: scale(.92);
        opacity: .2;
    }

    50% {
        transform: scale(1.06);
        opacity: .55;
    }

}


@keyframes ringPulse2 {

    0%,
    100% {
        transform: scale(.94);
        opacity: .1;
    }

    50% {
        transform: scale(1.08);
        opacity: .35;
    }

}


@keyframes shineRotate {

    from {
        transform: rotate(0deg);
        opacity: 0;
    }

    25% {
        opacity: .45;
    }

    60% {
        opacity: .15;
    }

    to {
        transform: rotate(360deg);
        opacity: 0;
    }

}


@keyframes particleFloat {

    0% {
        transform:
            translate3d(
                0,
                20px,
                0
            )
            scale(.4);

        opacity: 0;
    }

    20% {
        opacity: .65;
    }

    70% {
        opacity: .25;
    }

    100% {
        transform:
            translate3d(
                var(--move-x),
                -100px,
                0
            )
            scale(1);

        opacity: 0;
    }

}


@keyframes maraSpinnerRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes maraSpinnerRotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}


@keyframes maraCorePulse {

    0%,
    100% {
        transform: scale(.7);
        opacity: .5;
    }

    50% {
        transform: scale(1.25);
        opacity: 1;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px) {

    .intro-content {

        padding:
            10px
            15px
            115px;

    }


    .logo-container {

        width: 190px;
        height: 190px;

    }


    .logo-shine {

        width: 175px;
        height: 175px;

    }


    .os-name {

        font-size: 29px;

        letter-spacing: 5px;

    }


    .os-subtitle {

        font-size: 8px;

        letter-spacing: 2px;

    }


    .os-version {

        font-size: 8px;

        margin-top: 14px;

    }


    .boot-area {

        width: 78vw;

        bottom: 27px;

    }


    .boot-status {

        font-size: 7px;

        letter-spacing: 2px;

    }


    .boot-message {

        font-size: 6px;

    }


    #mara-update-spinner {

        bottom: 80px;

    }

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media (max-height:650px) {

    .logo-container {

        width: 145px;
        height: 145px;

    }


    .logo-shine {

        width: 135px;
        height: 135px;

    }


    .os-name {

        font-size: 25px;

    }


    .os-version {

        margin-top: 9px;

    }


    .boot-area {

        bottom: 18px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MARA BACKGROUND
===================================================== -->

<main id="mara-os"></main>


<!-- =====================================================
     INTRO
===================================================== -->

<div id="intro-overlay">


    <div class="ambient-light"></div>

    <div class="ambient-light-2"></div>

    <div class="ambient-ring"></div>

    <div class="ambient-ring-2"></div>


    <div class="intro-content">


        <!-- =================================================
             LOGO
        ================================================= -->

        <div class="logo-container">

            <svg

                    d="
                        M396 338

                id="boot-percent"

                0%

        </div>

            <span id="boot-message">
                PREPARING MARA OS
            </span>


            <span id="boot-stage">
                BOOT

        </div>

</div>


<!-- =====================================================
     UPDATE SPINNER
===================================================== -->

<div id="mara-update-spinner">


    <div class="spinner-ring">

        <div class="spinner-core"></div>

    </div>


    <div
        class="spinner-text"
        id="spinner-text"
    >
        CHECKING FOR UPDATE
    </div>


    <div
        class="spinner-subtext"
        id="spinner-subtext"
    >
        PREPARING MARA OS
    </div>

</div>


<!-- =====================================================
     UPGRADE ENGINE
===================================================== -->

<script src="./upgrade-engine.js"></script>


<!-- =====================================================
     ENGINE SINGLE
     
     ENGINE UTAMA DIMUAT OLEH INTRO.
===================================================== -->

<script src="../engine-single.js"></script>


<script>

/* =====================================================
   MARA CONFIGURATION
===================================================== */

const MARA_CONFIG = {

    /*
     * SUMBER RESMI VERSION + BUILD
     */

    updateManifestURL:
        "https://romdoniahmad185-cmyk.github.io/mara-os-updates/stable/upgrade-manifest.json"

};


/* =====================================================
   STATE
===================================================== */

const MARA_STATE = {

    indexReady:
        false,

    manifestLoaded:
        false,

    engineReady:
        false,

    engineWorking:
        false,

    engineFinished:
        false,

    upgradeFinished:
        false,

    bootSent:
        false,

    version:
        null,

    build:
        null,

    progress:
        0,

    error:
        null

};


/* =====================================================

/* =====================================================
   AUDIO
===================================================== */

let maraAudioContext = null;

let maraAudioStarted = false;

let maraMaster = null;


function getMaraAudioContext() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        return null;

    }


    if (!maraAudioContext) {

        maraAudioContext =
            new AudioContext();

    }


    return maraAudioContext;

}


function createMaraMaster(
    ctx
) {

    const input =
        ctx.createGain();

    const compressor =
        ctx.createDynamicsCompressor();


    input.gain.value =
        .16;


    compressor.threshold.value =
        -30;

    compressor.knee.value =
        18;

    compressor.ratio.value =
        2.5;

    compressor.attack.value =
        .01;

    compressor.release.value =
        .45;


    input.connect(
        compressor
    );

    compressor.connect(
        ctx.destination
    );


    maraMaster =
        input;


    return input;

}


function maraGlassNote(
    ctx,
    output,
    frequency,
    start,
    duration,
    volume = .045
) {

    const osc =
        ctx.createOscillator();

    const harmonic =
        ctx.createOscillator();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();


    osc.type =
        "sine";

    harmonic.type =
        "sine";


    osc.frequency.setValueAtTime(
        frequency,
        start
    );

    harmonic.frequency.setValueAtTime(
        frequency * 2,
        start
    );


    filter.type =
        "lowpass";

    filter.frequency.setValueAtTime(
        2800,
        start
    );


    gain.gain.setValueAtTime(
        .0001,
        start
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        start + .018
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + duration
    );


    osc.connect(filter);
    harmonic.connect(filter);
    filter.connect(gain);
    gain.connect(output);


    osc.start(start);
    harmonic.start(start);

    osc.stop(
        start + duration + .05
    );

    harmonic.stop(
        start + duration + .05
    );

}


async function playMaraLuxuryGlass() {

    if (maraAudioStarted) {

        return;

    }


    const ctx =
        getMaraAudioContext();


    if (!ctx) {

        return;

    }


    try {

        if (
            ctx.state ===
            "suspended"
        ) {

            await ctx.resume();

        }

    } catch (error) {

        maraWarn(
            "Audio tidak dapat diaktifkan.",
            error
        );

        return;

    }


    const master =
        createMaraMaster(ctx);


    const now =
        ctx.currentTime;


    maraAudioStarted =
        true;


    maraGlassNote(
        ctx,
        master,
        261.63,
        now,
        2,
        .035
    );


    maraGlassNote(
        ctx,
        master,
        329.63,
        now + .35,
        2,
        .038
    );


    maraGlassNote(
        ctx,
        master,
        392,
        now + .7,
        2,
        .041
    );


    maraGlassNote(
        ctx,
        master,
        523.25,
        now + 1.1,
        2,
        .044
    );


    maraLog(
        "Luxury Glass audio aktif."
    );

}


async function unlockMaraAudio() {

    try {

        await playMaraLuxuryGlass();

    } catch (
        error
    ) {

        maraWarn(
            "Audio fallback.",
            error
        );

    }

}

const maraSpinner = {

    element:
        document.getElementById(
            "mara-update-spinner"
        ),

    text:
        document.getElementById(
            "spinner-text"
        ),

    subtext:
        document.getElementById(
            "spinner-subtext"
        ),


    show() {

        if (this.element) {

            this.element.classList.add(
                "show"
            );

        }

    },


    hide() {

        if (this.element) {

            this.element.classList.remove(
                "show"
            );

        }

    },


    state(
        state
    ) {

        if (!this.element) {

            return;

        }


        this.element.classList.remove(
            "success",
            "update",
            "error"
        );


        if (state) {

            this.element.classList.add(
                state
            );

        }

    },


    setStatus(
        main,
        sub
    ) {

        if (this.text) {

            this.text.textContent =
                main || "";

        }


        if (this.subtext) {

            this.subtext.textContent =
                sub || "";

        }

    }

};


/* =====================================================
   BOOT UI
===================================================== */

const maraBootUI = {

    fill:
        document.getElementById(
            "boot-progress-fill"
        ),

    percent:
        document.getElementById(
            "boot-percent"
        ),

    status:
        document.getElementById(
            "boot-status"
        ),

    message:
        document.getElementById(
            "boot-message"
        ),

    stage:
        document.getElementById(
            "boot-stage"
        ),


    progress:
        0,


    setProgress(
        value
    ) {

        const numeric =
            Number(value);


        if (
            !Number.isFinite(
                numeric
            )
        ) {

            return;

        }


        const safe =
            Math.max(
                0,
                Math.min(
                    100,
                    Math.round(
                        numeric
                    )
                )
            );


        /*
         * Progress hanya boleh bergerak maju.
         */

        this.progress =
            Math.max(
                this.progress,
                safe
            );


        if (this.fill) {

            this.fill.style.width =
                this.progress + "%";

        }


        if (this.percent) {

            this.percent.textContent =
                this.progress + "%";

        }

    },


    setStatus(
        status,
        message,
        stage
    ) {

        if (this.status) {

            this.status.textContent =
                status || "";

        }


        if (this.message) {

            this.message.textContent =
                message || "";

        }


        if (this.stage) {

            this.stage.textContent =
                stage || "";

        }

    }

};

/* =====================================================
   LOAD MANIFEST
===================================================== */

async function loadMaraManifest() {

    setBootProgress(
        5,
        "CHECKING SYSTEM",
        "Menghubungkan ke repository MARA",
        "NETWORK"
    );


    const response =
        await fetch(
            MARA_CONFIG.updateManifestURL,
            {

                method:
                    "GET",

                cache:
                    "no-store",

                headers: {

                    "Accept":
                        "application/json"

                }

            }
        );


    if (!response.ok) {

        throw new Error(
            "Manifest HTTP " +
            response.status
        );

    }


    setBootProgress(
        15,
        "MANIFEST RECEIVED",
        "Membaca konfigurasi MARA OS",
        "MANIFEST"
    );


    const manifest =
        await response.json();


    if (
        !manifest ||
        typeof manifest !==
            "object"
    ) {

        throw new Error(
            "Manifest tidak valid."
        );

    }


    if (
        manifest.version ===
            undefined ||
        manifest.build ===
            undefined
    ) {

        throw new Error(
            "Manifest tidak memiliki version/build."
        );

    }


    if (
        !Array.isArray(
            manifest.files
        )
    ) {

        throw new Error(
            "Manifest tidak memiliki daftar files."
        );

    }


    return manifest;

}

/* =====================================================
   RUN UPGRADE ENGINE
===================================================== */

async function runMaraUpgrade(
    manifest
) {

    if (
        !window.MARAUpgrade ||
        typeof
            window.MARAUpgrade.install !==
            "function"
    ) {

        maraWarn(
            "upgrade-engine.js tidak menyediakan install()."
        );


        /*
         * Tidak langsung menganggap
         * engine selesai.
         *
         * Engine-single tetap menjadi
         * sumber keputusan.
         */

        return false;

    }


    maraSpinner.show();

    maraSpinner.state(
        "update"
    );


    maraSpinner.setStatus(
        "CHECKING UPDATE",
        "Build " +
        manifest.build
    );


    setBootProgress(
        25,
        "UPGRADE ENGINE",
        "Memeriksa build MARA",
        "UPGRADE"
    );


    try {

        await window.MARAUpgrade.install(
            manifest,
            {

                onStatus:
                    function(
                        main,
                        sub
                    ) {

                        maraSpinner.setStatus(
                            main,
                            sub
                        );


                        const text =
                            String(
                                main || ""
                            ).toUpperCase();


                        if (
                            text.includes(
                                "DOWNLOAD"
                            )
                        ) {

                            setBootProgress(
                                45,
                                "DOWNLOADING",
                                sub ||
                                    "Mengunduh engine",
                                "DOWNLOAD"
                            );

                        }


                        else if (
                            text.includes(
                                "VERIFY"
                            )
                        ) {

                            setBootProgress(
                                70,
                                "VERIFYING",
                                sub ||
                                    "Memverifikasi build",
                                "VERIFY"
                            );

                        }


                        else if (
                            text.includes(
                                "INSTALL"
                            )
                        ) {

                            setBootProgress(
                                80,
                                "INSTALLING",
                                sub ||
                                    "Memasang build",
                                "INSTALL"
                            );

                        }


                        else if (
                            text.includes(
                                "COMPLETE"
                            ) ||
                            text.includes(
                                "READY"
                            )
                        ) {

                            setBootProgress(
                                90,
                                "ENGINE READY",
                                sub ||
                                    "Engine siap",
                                "READY"
                            );

                        }

                    }

            }
        );


        MARA_STATE.upgradeFinished =
            true;


        maraSpinner.state(
            "success"
        );


        maraSpinner.setStatus(
            "UPGRADE COMPLETE",
            "Build " +
            manifest.build +
            " siap"
        );


        setBootProgress(
            90,
            "UPGRADE COMPLETE",
            "Build berhasil diproses",
            "UPGRADE"
        );


        return true;

    }

    catch (
        error
    ) {

        maraSpinner.state(
            "error"
        );


        maraSpinner.setStatus(
            "UPGRADE ERROR",
            error.message
        );


        throw error;

    }

}

function updateEngineState(

) {

        Boolean(
            data.working
        );


    if (
        Number.isFinite(
            Number(
                data.progress
            )
        )
    ) {

        setBootProgress(
            Number(
                data.progress
            ),
            "MARA ENGINE",
            data.message ||
                "Engine sedang bekerja",
            data.phase ||
                "ENGINE"
        );

    }

/* =====================================================
   ENGINE FINISHED CHECK
===================================================== */

function checkBootReady() {

    if (
        MARA_STATE.bootSent
    ) {

        return;

    }


    /*
     * Manifest harus tersedia.
     */

    if (
        !MARA_STATE.manifestLoaded
    ) {

        return;

    }


    /*
     * Engine harus memberikan
     * keputusan selesai.
     */

    if (
        !MARA_STATE.engineFinished
    ) {

        return;

    }


    MARA_STATE.bootSent =
        true;


    setBootProgress(
        100,
        "MARA OS READY",
        "System initialization complete",
        "READY"
    );


    maraSpinner.hide();


    maraLog(
        "ENGINE → INTRO → INDEX",
        "MARA_BOOT_READY"
    );


    /*
     * INTRO TIDAK MENUTUP DIRINYA.
     *
     * Perintah dikirim ke parent/index.html.
     */

    window.parent.postMessage(
        {

            type:
                "MARA_BOOT_READY",

            version:
                MARA_STATE.version,

            build:
                MARA_STATE.build,

            source:
                "intro",

            engineReady:
                MARA_STATE.engineReady,

            upgradeFinished:
                MARA_STATE.upgradeFinished

        },
        "*"
    );

}


/* =====================================================
   ENGINE EVENT CONNECTION
===================================================== */

function connectMaraEngine() {

    const engine =
        getMaraEngine();


    if (!engine) {

        maraWarn(
            "MARAEngineSingle belum tersedia."
        );


        setBootProgress(
            20,
            "ENGINE WAITING",
            "Menunggu MARA Engine",
            "ENGINE"
        );


        return false;

    }


    maraLog(
        "MARAEngineSingle terdeteksi."
    );


    if (
        typeof engine.on ===
        "function"
    ) {


        /* =============================================
           READY
        ============================================= */

        engine.on(
            "ready",
            function(
                data
            ) {

                MARA_STATE.engineReady =
                    true;

                MARA_STATE.engineWorking =
                    false;

                MARA_STATE.engineFinished =
                    true;


                setBootProgress(
                    100,
                    "MARA ENGINE READY",
                    "Engine siap digunakan",
                    "READY"
                );


                maraSpinner.state(
                    "success"
                );


                maraSpinner.setStatus(
                    "ENGINE READY",
                    "MARA Engine aktif"
                );


                maraLog(
                    "ENGINE READY",
                    data
                );


                checkBootReady();

            }
        );


        /* =============================================
           UPDATE START
        ============================================= */

        engine.on(
            "update:start",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    true;

                MARA_STATE.engineFinished =
                    false;


                setBootProgress(
                    30,
                    "ENGINE UPDATE",
                    "Update engine dimulai",
                    "UPDATE"
                );


                maraSpinner.show();

                maraSpinner.state(
                    "update"
                );


                maraSpinner.setStatus(
                    "ENGINE UPDATE",
                    "Memproses pembaruan"
                );

            }
        );


        /* =============================================
           DOWNLOAD
        ============================================= */

        engine.on(
            "download:progress",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    true;


                const progress =
                    Number(
                        data &&
                        data.progress
                    );


                if (
                    Number.isFinite(
                        progress
                    )
                ) {

                    setBootProgress(
                        progress,
                        "DOWNLOADING",
                        "Mengunduh komponen MARA",
                        "DOWNLOAD"
                    );

                }


                maraSpinner.show();

                maraSpinner.state(
                    "update"
                );

            }
        );


        /* =============================================
           VERIFY START
        ============================================= */

        engine.on(
            "verify:start",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    true;


                setBootProgress(
                    70,
                    "VERIFYING",
                    "Memverifikasi engine",
                    "VERIFY"
                );

            }
        );


        /* =============================================
           VERIFY SUCCESS
        ============================================= */

        engine.on(
            "verify:success",
            function(
                data
            ) {

                setBootProgress(
                    78,
                    "VERIFIED",
                    "Build berhasil diverifikasi",
                    "VERIFY"
                );

            }
        );


        /* =============================================
           INSTALL START
        ============================================= */

        engine.on(
            "install:start",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    true;


                setBootProgress(
                    82,
                    "INSTALLING",
                    "Memasang komponen engine",
                    "INSTALL"
                );

            }
        );


        /* =============================================
           INSTALL COMPLETE
        ============================================= */

        engine.on(
            "install:complete",
            function(
                data
            ) {

                setBootProgress(
                    90,
                    "INSTALLED",
                    "Engine berhasil dipasang",
                    "INSTALL"
                );

            }
        );


        /* =============================================
           ACTIVE BUILD
        ============================================= */

        engine.on(
            "build:active",
            function(
                data
            ) {

                setBootProgress(
                    95,
                    "BUILD ACTIVE",
                    "Build aktif",
                    "BUILD"
                );


                maraLog(
                    "ACTIVE BUILD",
                    data
                );

            }
        );


        /* =============================================
           UPDATE COMPLETE
        ============================================= */

        engine.on(
            "update:complete",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    false;

                MARA_STATE.engineReady =
                    true;

                MARA_STATE.engineFinished =
                    true;


                setBootProgress(
                    100,
                    "MARA ENGINE READY",
                    "Pembaruan selesai",
                    "READY"
                );


                maraSpinner.state(
                    "success"
                );


                maraSpinner.setStatus(
                    "UPDATE COMPLETE",
                    "Engine siap digunakan"
                );


                maraLog(
                    "UPDATE COMPLETE",
                    data
                );


                checkBootReady();

            }
        );


        /* =============================================
           NO UPDATE
        ============================================= */

        engine.on(
            "update:none",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    false;

                MARA_STATE.engineReady =
                    true;

                MARA_STATE.engineFinished =
                    true;


                setBootProgress(
                    100,
                    "MARA ENGINE READY",
                    "Tidak ada update",
                    "READY"
                );


                maraSpinner.state(
                    "success"
                );


                maraSpinner.setStatus(
                    "ENGINE READY",
                    "Build lokal sudah terbaru"
                );


                maraLog(
                    "NO UPDATE",
                    data
                );


                checkBootReady();

            }
        );


        /* =============================================
           ALIAS NO UPDATE
        ============================================= */

        engine.on(
            "no:update",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    false;

                MARA_STATE.engineReady =
                    true;

                MARA_STATE.engineFinished =
                    true;


                setBootProgress(
                    100,
                    "MARA ENGINE READY",
                    "Build sudah terbaru",
                    "READY"
                );


                checkBootReady();

            }
        );


        /* =============================================
           ERROR
        ============================================= */

        engine.on(
            "update:error",
            function(
                data
            ) {

                MARA_STATE.engineWorking =
                    false;

                MARA_STATE.error =
                    data;


                maraSpinner.state(
                    "error"
                );


                maraSpinner.setStatus(
                    "ENGINE ERROR",
                    "Pemeriksaan engine gagal"
                );


                maraWarn(
                    "ENGINE ERROR",
                    data
                );

            }
        );

    }


    /*
     * Jika engine mempunyai getState(),
     * baca state awal.
     */

    if (
        typeof engine.getState ===
        "function"
    ) {

        try {

            const state =
                engine.getState();


            maraLog(
                "ENGINE STATE",
                state
            );


            if (
                state &&
                state.ready ===
                    true
            ) {

                MARA_STATE.engineReady =
                    true;

                MARA_STATE.engineFinished =
                    true;

                checkBootReady();

            }

        }

        catch (
            error
        ) {

            maraWarn(
                "Gagal membaca engine state.",
                error
            );

        }

    }


    return true;

}

/* =====================================================
   INDEX MESSAGE HANDLER
===================================================== */

window.addEventListener(
    "message",
    function(
        event
    ) {

        const data =
            event.data;


        if (
            !data ||
            typeof data !==
                "object"
        ) {

            return;

        }


        /* =============================================
           INDEX READY
        ============================================= */

        if (
            data.type ===
            "MARA_INDEX_READY"
        ) {

            MARA_STATE.indexReady =
                true;


            maraLog(
                "INDEX READY."
            );


            notifyIndexReady();

            return;

        }


        /* =============================================
           ENGINE STATUS REQUEST
        ============================================= */

        if (
            data.type ===
            "MARA_ENGINE_STATUS_REQUEST"
        ) {

            const engine =
                getMaraEngine();


            let state =
                null;


            if (
                engine &&
                typeof engine.getState ===
                    "function"
            ) {

                try {

                    state =
                        engine.getState();

                }

                catch (
                    error
                ) {

                    maraWarn(
                        "Gagal mengambil engine state.",
                        error
                    );

                }

            }


            window.parent.postMessage(
                {

                    type:
                        "MARA_ENGINE_STATE",

                    state:
                        state,

                    version:
                        MARA_STATE.version,

                    build:
                        MARA_STATE.build

                },
                "*"
            );

            return;

        }

    }
);

async function startMaraIntro() {

    maraLog(
        "MARA OS Intro dimulai."
    );


    createParticles();


    playMaraLuxuryGlass()
        .catch(
            error => {

                maraWarn(
                    "Audio gagal.",
                    error
                );

            }
        );


    setBootProgress(
        0,
        "INITIALIZING MARA SYSTEM",
        "Preparing MARA OS",
        "BOOT"
    );


    /*
     * =================================================
     * MANIFEST
     * =================================================
     */

    try {

        const manifest =
            await loadMaraManifest();


        displayMaraManifest(
            manifest
        );


        MARA_STATE.manifestLoaded =
            true;


        setBootProgress(
            20,
            "MANIFEST READY",
            "Repository berhasil terhubung",
            "MANIFEST"
        );


        /*
         * =================================================
         * UPGRADE ENGINE
         * =================================================
         */

        await runMaraUpgrade(
            manifest
        );


        /*
         * Upgrade selesai belum otomatis
         * berarti boot selesai.
         *
         * Kita tetap menunggu event
         * dari MARAEngineSingle.
         */


        connectMaraEngine();


        checkBootReady();

    }

    catch (
        error
    ) {

        MARA_STATE.error =
            error;


        maraSpinner.state(
            "error"
        );


        maraSpinner.setStatus(
            "OFFLINE / ERROR",
            "Build lokal dapat digunakan"
        );


        setBootProgress(
            100,
            "LOCAL ENGINE",
            "Repository tidak tersedia",
            "LOCAL"
        );


        maraWarn(
            "Manifest/upgrade gagal:",
            error
        );


        /*
         * Jangan memalsukan
         * MARA_BOOT_READY.
         *
         * Engine harus tetap menentukan
         * apakah sistem dapat boot.
         */

        connectMaraEngine();

    }

}


/* =====================================================
   DOM READY
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        startMaraIntro()
            .catch(
                error => {

                    maraWarn(
                        "Intro error:",
                        error
                    );

                }
            );

    }
);


/* =====================================================
   MOBILE AUDIO
===================================================== */

[
    "pointerdown",
    "touchstart",
    "keydown"

].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            unlockMaraAudio,
            {

                once:
                    true,

                passive:
                    eventName !==
                    "keydown"

            }
        );

    }
);


/* =====================================================
   GLOBAL MARA BOOT API
===================================================== */

window.MARABoot = {

    getProgress() {

        return maraBootUI.progress;

    },


    getState() {

        return {

            ...MARA_STATE,

            progress:
                maraBootUI.progress

        };

    },


    getManifest() {

        return (
            window.MARA_REMOTE_STATUS ||
            null
        );

    },


    getEngine() {

        return getMaraEngine();

    },


    /*
     * API ini hanya untuk komunikasi
     * dengan INDEX.
     *
     * Bukan untuk menutup intro.
     */

    requestStatus() {

        window.parent.postMessage(
            {

                type:
                    "MARA_ENGINE_STATUS_REQUEST"

            },
            "*"
        );

    }

};


/* =====================================================
   FINAL LOG
===================================================== */

maraLog(
    "Boot interface loaded."
);

</script>
