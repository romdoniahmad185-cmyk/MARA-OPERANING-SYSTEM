<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>MARA OS</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100%;

    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   MARA OS BACKGROUND
   Tidak lagi memiliki layar SYSTEM READY kedua.
===================================================== */

#mara-os {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    background:
        radial-gradient(
            circle at 50% 45%,
            #10201e 0%,
            #07110f 38%,
            #020605 72%,
            #000 100%
        );

}


/* =====================================================
   INTRO OVERLAY
===================================================== */

#intro-overlay {

    position: fixed;

    inset: 0;

    z-index: 999999;

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #0b1c1a 0%,
            #04100e 35%,
            #010505 70%,
            #000 100%
        );

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;

}


#intro-overlay.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}


/* =====================================================
   AMBIENT LIGHT
===================================================== */

.ambient-light {

    position: absolute;

    width: 430px;

    height: 430px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.15),
            rgba(0,201,167,.08) 34%,
            transparent 70%
        );

    filter: blur(42px);

    animation:
        ambientPulse
        6s
        ease-in-out
        infinite;

}


.ambient-light-2 {

    position: absolute;

    width: 260px;

    height: 260px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(124,255,203,.10),
            transparent 70%
        );

    filter: blur(30px);

    animation:
        ambientPulse2
        8s
        ease-in-out
        infinite;

}


.ambient-ring {

    position: absolute;

    width: 300px;

    height: 300px;

    border-radius: 50%;

    border:
        1px solid
        rgba(124,255,203,.07);

    animation:
        ringPulse
        7s
        ease-in-out
        infinite;

}


.ambient-ring-2 {

    position: absolute;

    width: 390px;

    height: 390px;

    border-radius: 50%;

    border:
        1px solid
        rgba(0,229,255,.035);

    animation:
        ringPulse2
        9s
        ease-in-out
        infinite;

}


/* =====================================================
   INTRO CONTENT
===================================================== */

.intro-content {

    position: relative;

    z-index: 10;

    width: 100%;

    min-height: 100%;

    padding:
        20px
        20px
        120px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* =====================================================
   LOGO
===================================================== */

.logo-container {

    position: relative;

    width: 225px;

    height: 225px;

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        logoFloat
        6s
        ease-in-out
        infinite;

}


.logo-container::before {

    content: "";

    position: absolute;

    inset: 20px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.13),
            transparent 70%
        );

    filter: blur(25px);

    animation:
        logoGlow
        5s
        ease-in-out
        infinite;

}


.mara-logo {

    width: 100%;

    height: 100%;

    overflow: visible;

}


/* =====================================================
   SVG FLOW
===================================================== */

.flow-main,
.flow-second {

    stroke-dasharray: 1500;

    stroke-dashoffset: 1500;

    filter:
        drop-shadow(
            0 0 7px
            rgba(0,229,255,.30)
        );

    animation:
        drawFlow
        2.8s
        cubic-bezier(.65,0,.35,1)
        forwards;

}


.flow-second {

    animation-delay: .35s;

}


.central-flow {

    stroke-dasharray: 180;

    stroke-dashoffset: 180;

    animation:
        drawCentral
        .9s
        ease
        forwards;

    animation-delay: 2.45s;

}


.flow-point {

    opacity: 0;

    transform-box: fill-box;

    transform-origin: center;

    animation:
        pointAppear
        .8s
        ease
        forwards;

    animation-delay: 3s;

}


/* =====================================================
   LOGO SHINE
===================================================== */

.logo-shine {

    position: absolute;

    width: 210px;

    height: 210px;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            transparent 250deg,
            rgba(255,255,255,.13) 285deg,
            transparent 320deg,
            transparent 360deg
        );

    opacity: 0;

    animation:
        shineRotate
        5s
        linear
        infinite;

    animation-delay: 2.7s;

}


/* =====================================================
   INTRO TEXT
===================================================== */

.os-name {

    margin-top: -5px;

    font-size: 36px;

    font-weight: 600;

    letter-spacing: 7px;

    color: #fff;

    opacity: 0;

    transform: translateY(18px);

    text-shadow:
        0 0 20px
        rgba(0,229,255,.18);

    animation:
        textReveal
        1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 3.15s;

}


.os-subtitle {

    margin-top: 10px;

    font-size: 9px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.4);

    opacity: 0;

    animation:
        textReveal
        .9s
        ease
        forwards;

    animation-delay: 3.55s;

}


.os-version {

    margin-top: 17px;

    font-size: 8px;

    line-height: 1.9;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.3);

    opacity: 0;

    animation:
        fadeIn
        .8s
        ease
        forwards;

    animation-delay: 3.95s;

}


/* =====================================================
   BOOT AREA
===================================================== */

.boot-area {

    position: absolute;

    left: 50%;

    bottom: 30px;

    width: min(
        80vw,
        500px
    );

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    z-index: 50;

    opacity: 0;

    animation:
        bootAreaReveal
        .8s
        ease
        forwards;

    animation-delay: 4s;

}


/* =====================================================
   BOOT STATUS
===================================================== */

.boot-status {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 10px;

    font-size: 8px;

    letter-spacing: 2.5px;

    color:
        rgba(124,255,203,.55);

    text-align: center;

}


/* =====================================================
   PROGRESS CONTAINER
===================================================== */

.boot-progress-container {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

}


/* =====================================================
   PROGRESS BAR
===================================================== */

.boot-progress {

    position: relative;

    flex: 1;

    height: 4px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.04);

    box-shadow:
        inset 0 0 5px
        rgba(0,0,0,.5);

}


/* =====================================================
   PROGRESS FILL
===================================================== */

.boot-progress-fill {

    position: absolute;

    left: 0;

    top: 0;

    width: 0%;

    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #00c9a7,
            #7cffcb
        );

    box-shadow:
        0 0 8px
        rgba(0,229,255,.65);

    transition:
        width .12s linear;

}


/* =====================================================
   PROGRESS GLOW
===================================================== */

.boot-progress-fill::after {

    content: "";

    position: absolute;

    right: 0;

    top: 0;

    width: 40px;

    height: 100%;

    background:
        rgba(255,255,255,.75);

    filter: blur(5px);

    opacity: .75;

}


/* =====================================================
   PERCENTAGE
===================================================== */

.boot-percent {

    min-width: 36px;

    font-size: 8px;

    letter-spacing: 1px;

    text-align: right;

    color:
        rgba(124,255,203,.7);

}


/* =====================================================
   BOOT MESSAGE
===================================================== */

.boot-message {

    width: 100%;

    margin-top: 9px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 7px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,.28);

}


/* =====================================================
   PARTICLES
===================================================== */

.tech-particle {

    position: absolute;

    width: 2px;

    height: 2px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.75);

    opacity: 0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;

}


/* =====================================================
   UPDATE SPINNER
===================================================== */

#mara-update-spinner {

    position: fixed;

    left: 50%;

    bottom: 92px;

    z-index: 100000;

    transform:
        translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .5s ease,
        visibility .5s ease;

}


#mara-update-spinner.show {

    opacity: 1;

    visibility: visible;

}


/* =====================================================
   SPINNER RING
===================================================== */

.spinner-ring {

    position: relative;

    width: 34px;

    height: 34px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-top-color:
        #00E5FF;

    border-right-color:
        #00C9A7;

    box-shadow:
        0 0 12px
        rgba(0,229,255,.12);

    animation:
        maraSpinnerRotate
        1.1s
        linear
        infinite;

}


.spinner-ring::before {

    content: "";

    position: absolute;

    inset: 5px;

    border-radius: 50%;

    border:
        1px solid
        rgba(124,255,203,.15);

    border-left-color:
        #7CFFCB;

    animation:
        maraSpinnerRotateReverse
        1.7s
        linear
        infinite;

}


.spinner-core {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 5px;

    height: 5px;

    margin-left: -2.5px;

    margin-top: -2.5px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.9),

        0 0 14px
        rgba(0,229,255,.6);

    animation:
        maraCorePulse
        1.4s
        ease-in-out
        infinite;

}


.spinner-text {

    margin-top: 11px;

    font-size: 7px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.55);

    white-space: nowrap;

}


.spinner-subtext {

    margin-top: 5px;

    font-size: 6px;

    letter-spacing: 1.5px;

    color:
        rgba(124,255,203,.35);

    white-space: nowrap;

}


/* =====================================================
   SPINNER STATES
===================================================== */

#mara-update-spinner.success
.spinner-ring {

    border-top-color:
        #7CFFCB;

    border-right-color:
        #00C9A7;

}


#mara-update-spinner.update
.spinner-ring {

    border-top-color:
        #00E5FF;

    border-right-color:
        #7CFFCB;

}


#mara-update-spinner.error
.spinner-ring {

    border-top-color:
        #FFB86C;

    border-right-color:
        #FF8A65;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes drawFlow {

    from {

        stroke-dashoffset:
            1500;

    }

    to {

        stroke-dashoffset:
            0;

    }

}


@keyframes drawCentral {

    from {

        stroke-dashoffset:
            180;

    }

    to {

        stroke-dashoffset:
            0;

    }

}


@keyframes pointAppear {

    0% {

        opacity: 0;

        transform:
            scale(.1);

    }

    60% {

        opacity: 1;

        transform:
            scale(1.35);

    }

    100% {

        opacity: .9;

        transform:
            scale(1);

    }

}


@keyframes textReveal {

    from {

        opacity: 0;

        transform:
            translateY(18px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


@keyframes fadeIn {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}


@keyframes bootAreaReveal {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(12px);

    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);

    }

}


@keyframes logoFloat {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-4px);

    }

}


@keyframes logoGlow {

    0%,
    100% {

        transform:
            scale(.85);

        opacity:
            .35;

    }

    50% {

        transform:
            scale(1.1);

        opacity:
            .8;

    }

}


@keyframes ambientPulse {

    0%,
    100% {

        transform:
            scale(.85);

        opacity:
            .35;

    }

    50% {

        transform:
            scale(1.12);

        opacity:
            .8;

    }

}


@keyframes ambientPulse2 {

    0%,
    100% {

        transform:
            scale(.8);

        opacity:
            .15;

    }

    50% {

        transform:
            scale(1.2);

        opacity:
            .5;

    }

}


@keyframes ringPulse {

    0%,
    100% {

        transform:
            scale(.92);

        opacity:
            .2;

    }

    50% {

        transform:
            scale(1.06);

        opacity:
            .55;

    }

}


@keyframes ringPulse2 {

    0%,
    100% {

        transform:
            scale(.94);

        opacity:
            .1;

    }

    50% {

        transform:
            scale(1.08);

        opacity:
            .35;

    }

}


@keyframes shineRotate {

    from {

        transform:
            rotate(0deg);

        opacity: 0;

    }

    25% {

        opacity:
            .45;

    }

    60% {

        opacity:
            .15;

    }

    to {

        transform:
            rotate(360deg);

        opacity: 0;

    }

}


@keyframes particleFloat {

    0% {

        transform:
            translate3d(
                0,
                20px,
                0
            )
            scale(.4);

        opacity: 0;

    }

    20% {

        opacity:
            .65;

    }

    70% {

        opacity:
            .25;

    }

    100% {

        transform:
            translate3d(
                var(--move-x),
                -100px,
                0
            )
            scale(1);

        opacity: 0;

    }

}


@keyframes maraSpinnerRotate {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes maraSpinnerRotateReverse {

    from {

        transform:
            rotate(360deg);

    }

    to {

        transform:
            rotate(0deg);

    }

}


@keyframes maraCorePulse {

    0%,
    100% {

        transform:
            scale(.7);

        opacity:
            .5;

    }

    50% {

        transform:
            scale(1.25);

        opacity:
            1;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px) {

    .intro-content {

        padding:
            10px
            15px
            115px;

    }


    .logo-container {

        width: 190px;

        height: 190px;

    }


    .logo-shine {

        width: 175px;

        height: 175px;

    }


    .os-name {

        font-size: 29px;

        letter-spacing: 5px;

    }


    .os-subtitle {

        font-size: 8px;

        letter-spacing: 2px;

    }


    .os-version {

        font-size: 8px;

        margin-top: 14px;

    }


    .boot-area {

        width: 78vw;

        bottom: 27px;

    }


    .boot-status {

        font-size: 7px;

        letter-spacing: 2px;

    }


    .boot-progress {

        height: 4px;

    }


    .boot-percent {

        font-size: 8px;

    }


    .boot-message {

        font-size: 6px;

    }


    #mara-update-spinner {

        bottom: 80px;

    }

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media (max-height:650px) {

    .logo-container {

        width: 145px;

        height: 145px;

    }


    .logo-shine {

        width: 135px;

        height: 135px;

    }


    .os-name {

        font-size: 25px;

    }


    .os-version {

        margin-top: 9px;

    }


    .boot-area {

        bottom: 18px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MARA OS BACKGROUND
     
     Tidak ada .os-placeholder.
     Dengan demikian layar kedua
     "MARA OS / SYSTEM READY" tidak akan muncul.
===================================================== -->

<main id="mara-os"></main>


<!-- =====================================================
     INTRO OVERLAY
===================================================== -->

<div id="intro-overlay">


    <!-- AMBIENT -->

    <div class="ambient-light"></div>

    <div class="ambient-light-2"></div>

    <div class="ambient-ring"></div>

    <div class="ambient-ring-2"></div>


    <!-- =================================================
         INTRO CONTENT
    ================================================= -->

    <div class="intro-content">


        <!-- =================================================
             LOGO
        ================================================= -->

        <div class="logo-container">


            <div class="logo-shine"></div>


            <svg
                class="mara-logo"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
                fill="none"
            >


                <defs>


                    <linearGradient
                        id="maraFlow"
                        x1="90"
                        y1="390"
                        x2="420"
                        y2="110"
                        gradientUnits="userSpaceOnUse"
                    >

                        <stop
                            offset="0%"
                            stop-color="#00E5FF"
                        />

                        <stop
                            offset="35%"
                            stop-color="#00C9A7"
                        />

                        <stop
                            offset="70%"
                            stop-color="#00A8A8"
                        />

                        <stop
                            offset="100%"
                            stop-color="#7CFFCB"
                        />

                    </linearGradient>


                    <linearGradient
                        id="maraFlowHighlight"
                        x1="180"
                        y1="220"
                        x2="330"
                        y2="300"
                        gradientUnits="userSpaceOnUse"
                    >

                        <stop
                            offset="0%"
                            stop-color="#FFFFFF"
                            stop-opacity=".95"
                        />

                        <stop
                            offset="100%"
                            stop-color="#FFFFFF"
                            stop-opacity=".25"
                        />

                    </linearGradient>


                </defs>


                <!-- MAIN FLOW -->

                <path
                    class="flow-main"
                    d="
                        M116 174
                        C166 112 242 104 306 139
                        C361 169 382 214 358 256
                        C334 299 273 313 224 288
                        C181 266 164 228 181 194
                        C199 158 250 148 291 169
                        C326 187 340 218 326 244
                    "
                    stroke="url(#maraFlow)"
                    stroke-width="48"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />


                <!-- SECOND FLOW -->

                <path
                    class="flow-second"
                    d="
                        M396 338
                        C346 400 270 408 206 373
                        C151 343 130 298 154 256
                        C178 213 239 199 288 224
                        C331 246 348 284 331 318
                        C313 354 262 364 221 343
                        C186 325 172 294 186 268
                    "
                    stroke="url(#maraFlow)"
                    stroke-width="48"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />


                <!-- CENTRAL FLOW -->

                <path
                    class="central-flow"
                    d="
                        M181 256
                        C207 237 243 230 276 241
                    "
                    stroke="url(#maraFlowHighlight)"
                    stroke-width="9"
                    stroke-linecap="round"
                    opacity=".8"
                />


                <!-- POINT -->

                <circle
                    class="flow-point"
                    cx="276"
                    cy="241"
                    r="7"
                    fill="#FFFFFF"
                    opacity=".9"
                />


            </svg>


        </div>


        <!-- =================================================
             NAME
        ================================================= -->

        <div class="os-name">

            MARA OS

        </div>


        <!-- =================================================
             SUBTITLE
        ================================================= -->

        <div class="os-subtitle">

            DIGITAL OPERATING SYSTEM

        </div>


        <!-- =================================================
             VERSION / BUILD
        ================================================= -->

        <div class="os-version">

            Version
            <span id="mara-version">...</span>

            <br>

            Build
            <span id="mara-build">...</span>

        </div>


    </div>


    <!-- =================================================
         BOOT AREA
         
         SATU-SATUNYA LOADING BAR.
    ================================================= -->

    <div class="boot-area">


        <div
            class="boot-status"
            id="boot-status"
        >

            INITIALIZING MARA SYSTEM

        </div>


        <div class="boot-progress-container">


            <div class="boot-progress">


                <div
                    class="boot-progress-fill"
                    id="boot-progress-fill"
                ></div>


            </div>


            <div
                class="boot-percent"
                id="boot-percent"
            >

                0%

            </div>


        </div>


        <div class="boot-message">


            <span id="boot-message">

                PREPARING MARA OS

            </span>


            <span id="boot-stage">

                BOOT

            </span>


        </div>


    </div>


</div>


<!-- =====================================================
     UPDATE SPINNER
===================================================== -->

<div id="mara-update-spinner">


    <div class="spinner-ring">

        <div class="spinner-core"></div>

    </div>


    <div
        class="spinner-text"
        id="spinner-text"
    >

        CHECKING FOR UPDATE

    </div>


    <div
        class="spinner-subtext"
        id="spinner-subtext"
    >

        PREPARING MARA OS

    </div>


</div>


<!-- =====================================================
     UPGRADE ENGINE
===================================================== -->

<script src="./upgrade-engine.js"></script>


<script>

/* =====================================================
   MARA CONFIGURATION
===================================================== */

const MARA_CONFIG = {

    introDuration:
        7600,

    spinnerMinDuration:
        1000,

    updateManifestURL:
        "https://romdoniahmad185-cmyk.github.io/mara-os-updates/stable/engine-single.json"

};


/* =====================================================
   AUDIO ENGINE
===================================================== */

let maraAudioContext = null;

let maraAudioStarted = false;

let maraMaster = null;


function getMaraAudioContext() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        return null;

    }


    if (!maraAudioContext) {

        maraAudioContext =
            new AudioContext();

    }


    return maraAudioContext;

}


function createMaraMaster(ctx) {

    const input =
        ctx.createGain();

    const compressor =
        ctx.createDynamicsCompressor();


    input.gain.value =
        .16;


    compressor.threshold.value =
        -30;

    compressor.knee.value =
        18;

    compressor.ratio.value =
        2.5;

    compressor.attack.value =
        .01;

    compressor.release.value =
        .45;


    input.connect(
        compressor
    );


    compressor.connect(
        ctx.destination
    );


    maraMaster =
        input;


    return input;

}


/* =====================================================
   GLASS NOTE
===================================================== */

function maraGlassNote(
    ctx,
    output,
    frequency,
    start,
    duration,
    volume = .045
) {

    const osc =
        ctx.createOscillator();

    const harmonic =
        ctx.createOscillator();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();


    osc.type =
        "sine";

    harmonic.type =
        "sine";


    osc.frequency.setValueAtTime(
        frequency,
        start
    );


    harmonic.frequency.setValueAtTime(
        frequency * 2,
        start
    );


    filter.type =
        "lowpass";


    filter.frequency.setValueAtTime(
        2800,
        start
    );


    filter.Q.value =
        .8;


    gain.gain.setValueAtTime(
        .0001,
        start
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        start + .018
    );


    gain.gain.exponentialRampToValueAtTime(
        volume * .28,
        start + duration * .22
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + duration
    );


    osc.connect(
        filter
    );


    harmonic.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        output
    );


    osc.start(
        start
    );


    harmonic.start(
        start
    );


    osc.stop(
        start + duration + .05
    );


    harmonic.stop(
        start + duration + .05
    );

}


/* =====================================================
   WARM GLASS PAD
===================================================== */

function maraGlassPad(
    ctx,
    output,
    frequency,
    start,
    duration
) {

    const osc1 =
        ctx.createOscillator();

    const osc2 =
        ctx.createOscillator();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();


    osc1.type =
        "sine";

    osc2.type =
        "triangle";


    osc1.frequency.value =
        frequency;

    osc2.frequency.value =
        frequency * 1.002;


    filter.type =
        "lowpass";


    filter.frequency.value =
        1200;


    gain.gain.setValueAtTime(
        .0001,
        start
    );


    gain.gain.exponentialRampToValueAtTime(
        .018,
        start + 1.1
    );


    gain.gain.exponentialRampToValueAtTime(
        .009,
        start + duration * .6
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + duration
    );


    osc1.connect(
        filter
    );

    osc2.connect(
        filter
    );

    filter.connect(
        gain
    );

    gain.connect(
        output
    );


    osc1.start(
        start
    );

    osc2.start(
        start
    );


    osc1.stop(
        start + duration + .1
    );

    osc2.stop(
        start + duration + .1
    );

}


/* =====================================================
   DIGITAL TICK
===================================================== */

function maraGlassTick(
    ctx,
    output,
    frequency,
    start
) {

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        "sine";


    osc.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        .0001,
        start
    );


    gain.gain.exponentialRampToValueAtTime(
        .018,
        start + .012
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + .18
    );


    osc.connect(
        gain
    );


    gain.connect(
        output
    );


    osc.start(
        start
    );


    osc.stop(
        start + .2
    );

}


/* =====================================================
   CRYSTAL SWEEP
===================================================== */

function maraCrystalSweep(
    ctx,
    output,
    start
) {

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    const filter =
        ctx.createBiquadFilter();


    osc.type =
        "sine";


    osc.frequency.setValueAtTime(
        520,
        start
    );


    osc.frequency.exponentialRampToValueAtTime(
        980,
        start + .8
    );


    filter.type =
        "lowpass";


    filter.frequency.value =
        1900;


    gain.gain.setValueAtTime(
        .0001,
        start
    );


    gain.gain.exponentialRampToValueAtTime(
        .022,
        start + .25
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + 1
    );


    osc.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        output
    );


    osc.start(
        start
    );


    osc.stop(
        start + 1.05
    );

}


/* =====================================================
   MARA SIGNATURE
===================================================== */

function maraGlassSignature(
    ctx,
    output,
    start
) {

    const notes = [

        {
            frequency: 261.63,
            delay: 0,
            volume: .032
        },

        {
            frequency: 329.63,
            delay: .10,
            volume: .035
        },

        {
            frequency: 392.00,
            delay: .20,
            volume: .038
        },

        {
            frequency: 523.25,
            delay: .32,
            volume: .042
        }

    ];


    notes.forEach(
        note => {

            maraGlassNote(
                ctx,
                output,
                note.frequency,
                start + note.delay,
                1.65,
                note.volume
            );

        }
    );

}


/* =====================================================
   PLAY AUDIO
===================================================== */

async function playMaraLuxuryGlass() {

    if (maraAudioStarted) {

        return;

    }


    const ctx =
        getMaraAudioContext();


    if (!ctx) {

        return;

    }


    try {

        if (
            ctx.state ===
            "suspended"
        ) {

            await ctx.resume();

        }

    } catch (error) {

        console.warn(
            "[MARA AUDIO]",
            error
        );

        return;

    }


    const master =
        createMaraMaster(ctx);


    const now =
        ctx.currentTime;


    maraAudioStarted =
        true;


    maraGlassPad(
        ctx,
        master,
        65.41,
        now,
        8
    );


    maraGlassPad(
        ctx,
        master,
        98,
        now + 1.2,
        6.8
    );


    maraGlassNote(
        ctx,
        master,
        261.63,
        now + .65,
        2.0,
        .035
    );


    maraGlassNote(
        ctx,
        master,
        329.63,
        now + 1.25,
        2.0,
        .038
    );


    maraGlassNote(
        ctx,
        master,
        392.00,
        now + 1.85,
        2.1,
        .041
    );


    maraGlassTick(
        ctx,
        master,
        659.25,
        now + 2.65
    );


    maraGlassTick(
        ctx,
        master,
        783.99,
        now + 3.15
    );


    maraGlassTick(
        ctx,
        master,
        880,
        now + 3.65
    );


    maraCrystalSweep(
        ctx,
        master,
        now + 3.9
    );


    maraGlassSignature(
        ctx,
        master,
        now + 5.15
    );


    console.log(
        "[MARA AUDIO] Luxury Glass aktif."
    );

}


async function unlockMaraAudio() {

    if (maraAudioStarted) {

        return;

    }


    try {

        await playMaraLuxuryGlass();

    } catch (error) {

        console.warn(
            "[MARA AUDIO]",
            error
        );

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles() {

    const overlay =
        document.getElementById(
            "intro-overlay"
        );


    if (!overlay) {

        return;

    }


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "tech-particle";


        particle.style.left =
            (
                Math.random() * 100
            ) + "%";


        particle.style.top =
            (
                40 +
                Math.random() * 45
            ) + "%";


        particle.style.setProperty(
            "--duration",
            (
                4 +
                Math.random() * 5
            ) + "s"
        );


        particle.style.setProperty(
            "--move-x",
            (
                Math.random() * 100 -
                50
            ) + "px"
        );


        particle.style.animationDelay =
            (
                Math.random() * 3
            ) + "s";


        overlay.appendChild(
            particle
        );

    }

}


/* =====================================================
   SPINNER CONTROLLER
===================================================== */

const maraSpinner = {

    element:
        document.getElementById(
            "mara-update-spinner"
        ),

    text:
        document.getElementById(
            "spinner-text"
        ),

    subtext:
        document.getElementById(
            "spinner-subtext"
        ),


    show() {

        if (!this.element) {

            return;

        }


        this.element.classList.add(
            "show"
        );

    },


    hide() {

        if (!this.element) {

            return;

        }


        this.element.classList.remove(
            "show"
        );

    },


    state(state) {

        if (!this.element) {

            return;

        }


        this.element.classList.remove(
            "success",
            "update",
            "error"
        );


        if (state) {

            this.element.classList.add(
                state
            );

        }

    },


    setStatus(
        main,
        sub
    ) {

        if (this.text) {

            this.text.textContent =
                main;

        }


        if (this.subtext) {

            this.subtext.textContent =
                sub;

        }

    }

};


/* =====================================================
   BOOT UI
===================================================== */

const maraBootUI = {

    fill:
        document.getElementById(
            "boot-progress-fill"
        ),

    percent:
        document.getElementById(
            "boot-percent"
        ),

    status:
        document.getElementById(
            "boot-status"
        ),

    message:
        document.getElementById(
            "boot-message"
        ),

    stage:
        document.getElementById(
            "boot-stage"
        ),


    progress:
        0,


    setProgress(
        value
    ) {

        value =
            Math.max(
                0,
                Math.min(
                    100,
                    Math.round(value)
                )
            );


        this.progress =
            value;


        if (this.fill) {

            this.fill.style.width =
                value + "%";

        }


        if (this.percent) {

            this.percent.textContent =
                value + "%";

        }

    },


    setStatus(
        status,
        message,
        stage
    ) {

        if (this.status) {

            this.status.textContent =
                status;

        }


        if (this.message) {

            this.message.textContent =
                message;

        }


        if (this.stage) {

            this.stage.textContent =
                stage;

        }

    }

};


/* =====================================================
   WAIT
===================================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function setBootProgress(
    value,
    status,
    message,
    stage
) {

    maraBootUI.setProgress(
        value
    );


    maraBootUI.setStatus(
        status,
        message,
        stage
    );

}


/* =====================================================
   MANIFEST
===================================================== */

async function loadMaraManifest() {

    setBootProgress(
        15,
        "CHECKING SYSTEM",
        "Menghubungkan ke repository",
        "NETWORK"
    );


    const response =
        await fetch(
            MARA_CONFIG.updateManifestURL,
            {
                method: "GET",

                cache: "no-store",

                headers: {

                    "Accept":
                        "application/json"

                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "Manifest HTTP " +
            response.status
        );

    }


    setBootProgress(
        28,
        "MANIFEST RECEIVED",
        "Membaca konfigurasi MARA OS",
        "MANIFEST"
    );


    const data =
        await response.json();


    if (
        !data ||
        typeof data !== "object"
    ) {

        throw new Error(
            "Manifest tidak valid."
        );

    }


    if (
        data.version === undefined ||
        data.build === undefined
    ) {

        throw new Error(
            "Manifest tidak mempunyai version/build."
        );

    }


    if (
        !Array.isArray(data.files)
    ) {

        throw new Error(
            "Manifest tidak mempunyai daftar files."
        );

    }


    return data;

}


/* =====================================================
   DISPLAY MANIFEST
===================================================== */

function displayMaraManifest(
    manifest
) {

    const versionElement =
        document.getElementById(
            "mara-version"
        );


    const buildElement =
        document.getElementById(
            "mara-build"
        );


    if (versionElement) {

        versionElement.textContent =
            String(
                manifest.version
            );

    }


    if (buildElement) {

        buildElement.textContent =
            String(
                manifest.build
            );

    }


    window.MARA_REMOTE_STATUS = {

        version:
            String(
                manifest.version
            ),

        build:
            String(
                manifest.build
            ),

        manifest:
            manifest,

        timestamp:
            Date.now()

    };

}


/* =====================================================
   RUN UPGRADE ENGINE
===================================================== */

async function runMaraUpgrade(
    manifest
) {

    if (
        window.MARAUpgrade &&
        typeof
            window.MARAUpgrade.install
            === "function"
    ) {


        maraSpinner.show();


        maraSpinner.state(
            "update"
        );


        maraSpinner.setStatus(
            "INSTALLING UPDATE",
            "Menyiapkan build " +
            manifest.build
        );


        setBootProgress(
            38,
            "INSTALLING ENGINE",
            "Menyiapkan MARA Engine",
            "ENGINE"
        );


        await
            window.MARAUpgrade.install(
                manifest,
                {

                    onStatus:
                        function(
                            main,
                            sub
                        ) {

                            maraSpinner.setStatus(
                                main,
                                sub
                            );


                            if (
                                typeof main ===
                                "string"
                            ) {

                                const upper =
                                    main.toUpperCase();


                                if (
                                    upper.includes(
                                        "VERIFY"
                                    )
                                ) {

                                    setBootProgress(
                                        72,
                                        "VERIFYING",
                                        sub ||
                                            "Memverifikasi build",
                                        "VERIFY"
                                    );

                                }

                                else if (
                                    upper.includes(
                                        "INSTALL"
                                    )
                                ) {

                                    setBootProgress(
                                        52,
                                        "INSTALLING",
                                        sub ||
                                            "Menginstal build",
                                        "INSTALL"
                                    );

                                }

                                else if (
                                    upper.includes(
                                        "DOWNLOAD"
                                    )
                                ) {

                                    setBootProgress(
                                        45,
                                        "DOWNLOADING",
                                        sub ||
                                            "Mengunduh build",
                                        "DOWNLOAD"
                                    );

                                }

                            }

                        }

                }
            );


        setBootProgress(
            88,
            "ENGINE READY",
            "Build berhasil dipasang",
            "READY"
        );


        maraSpinner.state(
            "success"
        );


        maraSpinner.setStatus(
            "UPDATE COMPLETE",
            "Build " +
            manifest.build +
            " aktif"
        );


        await wait(
            MARA_CONFIG.spinnerMinDuration
        );


        maraSpinner.hide();


        return true;

    }


    console.warn(
        "[MARA UPDATE] upgrade-engine.js belum tersedia."
    );


    setBootProgress(
        65,
        "LOCAL ENGINE",
        "Menggunakan engine lokal",
        "LOCAL"
    );


    return false;

}


/* =====================================================
   OFFLINE MODE
===================================================== */

function enterOfflineMode(
    error
) {

    console.warn(
        "[MARA OS] Offline mode:",
        error
    );


    window.MARA_REMOTE_STATUS = {

        version:
            null,

        build:
            null,

        error:
            true,

        message:
            error.message,

        timestamp:
            Date.now()

    };


    maraSpinner.state(
        "error"
    );


    maraSpinner.setStatus(
        "OFFLINE MODE",
        "Menggunakan build lokal"
    );


    setBootProgress(
        70,
        "OFFLINE MODE",
        "Build lokal tetap digunakan",
        "LOCAL"
    );

}


/* =====================================================
   BOOT SIMULATION
===================================================== */

async function finishBootProgress() {

    const current =
        maraBootUI.progress;


    for (
        let value = current;
        value <= 100;
        value++
    ) {

        if (value < 90) {

            setBootProgress(
                value,
                "MARA OS INITIALIZING",
                "Memuat komponen sistem",
                "BOOT"
            );

        }

        else if (value < 96) {

            setBootProgress(
                value,
                "MARA OS READY",
                "Finalizing system",
                "FINAL"
            );

        }

        else {

            setBootProgress(
                value,
                "MARA OS READY",
                "System initialization complete",
                "READY"
            );

        }


        await wait(
            28
        );

    }


    setBootProgress(
        100,
        "MARA OS READY",
        "System initialization complete",
        "READY"
    );


    await wait(
        550
    );

}


/* =====================================================
   HIDE INTRO
===================================================== */

async function hideMaraIntro() {

    const intro =
        document.getElementById(
            "intro-overlay"
        );


    if (!intro) {

        return;

    }


    setBootProgress(
        100,
        "MARA OS READY",
        "100% • System ready",
        "READY"
    );


    await wait(
        500
    );


    intro.classList.add(
        "hide"
    );


    console.log(
        "[MARA OS] Intro selesai."
    );

}


/* =====================================================
   START MARA INTRO
===================================================== */

async function startMaraIntro() {

    console.log(
        "[MARA OS] Luxury Glass Intro dimulai."
    );


    createParticles();


    /*
     * AUDIO
     */

    playMaraLuxuryGlass()
        .catch(
            error => {

                console.warn(
                    "[MARA AUDIO]",
                    error
                );

            }
        );


    /*
     * START PROGRESS
     */

    setBootProgress(
        0,
        "INITIALIZING MARA SYSTEM",
        "Preparing MARA OS",
        "BOOT"
    );


    await wait(
        350
    );


    let manifest =
        null;


    /*
     * =================================================
     * LOAD MANIFEST
     * =================================================
     */

    try {

        manifest =
            await loadMaraManifest();


        displayMaraManifest(
            manifest
        );


        setBootProgress(
            32,
            "MANIFEST READY",
            "Repository berhasil terhubung",
            "MANIFEST"
        );


        await wait(
            250
        );


        /*
         * =================================================
         * UPGRADE ENGINE
         * =================================================
         */

        await runMaraUpgrade(
            manifest
        );


    }

    catch (error) {

        enterOfflineMode(
            error
        );


        await wait(
            700
        );

    }


    /*
     * =================================================
     * FINAL BOOT
     * =================================================
     */

    await finishBootProgress();


    /*
     * Spinner hanya indikator update.
     * Intro tetap menggunakan progress bar utama.
     */

    maraSpinner.hide();


    /*
     * =================================================
     * TUTUP INTRO
     * =================================================
     */

    await hideMaraIntro();

}


/* =====================================================
   DOM READY
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        startMaraIntro()
            .catch(
                error => {

                    console.error(
                        "[MARA OS] Boot error:",
                        error
                    );


                    /*
                     * Jangan biarkan intro
                     * menggantung selamanya.
                     */

                    setBootProgress(
                        100,
                        "MARA OS READY",
                        "Boot fallback selesai",
                        "READY"
                    );


                    setTimeout(
                        () => {

                            hideMaraIntro();

                        },
                        800
                    );

                }
            );

    }
);


/* =====================================================
   MOBILE AUDIO FALLBACK
===================================================== */

[
    "pointerdown",
    "touchstart",
    "keydown"

].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            unlockMaraAudio,
            {
                once: true,

                passive:
                    eventName !==
                    "keydown"
            }
        );

    }
);


/* =====================================================
   GLOBAL MARA BOOT API
===================================================== */

window.MARABoot = {

    getProgress() {

        return maraBootUI.progress;

    },


    setProgress(
        value,
        status,
        message,
        stage
    ) {

        setBootProgress(
            value,
            status ||
                "MARA OS",
            message ||
                "System processing",
            stage ||
                "BOOT"
        );

    },


    hideIntro() {

        return hideMaraIntro();

    },


    showSpinner() {

        maraSpinner.show();

    },


    hideSpinner() {

        maraSpinner.hide();

    }

};


console.log(
    "[MARA OS] Boot interface loaded."
);

</script>
