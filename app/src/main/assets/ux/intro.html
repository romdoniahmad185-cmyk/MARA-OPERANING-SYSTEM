.ambient-light-2 {

/* =====================================================
   INTRO CONTENT
===================================================== */

.intro-content {

/* =====================================================
   LOGO
===================================================== */

.logo-container {

    width: 225px;

/* =====================================================

===================================================== */

    stroke-dashoffset: 1500;

}


.central-flow {

}


.flow-point {

/* =====================================================
   MARA OS CONFIGURATION
===================================================== */

const MARA_CONFIG = {

    introDuration:
        7200,

    spinnerMinDuration:
        1200,

    updateManifestURL:
        "https://romdoniahmad185-cmyk.github.io/mara-os-updates/stable/engine-single.json"

};


/* =====================================================
   AUDIO ENGINE
===================================================== */

let maraAudioContext = null;

let maraAudioStarted = false;

let maraMaster = null;


function getMaraAudioContext() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


    if (!AudioContext) {

        return null;

    }


    if (!maraAudioContext) {

        maraAudioContext =
            new AudioContext();

    }


    return maraAudioContext;

}


function createMaraMaster(ctx) {

    const input =
        ctx.createGain();

    const compressor =
        ctx.createDynamicsCompressor();

    input.gain.value =
        .16;

    compressor.threshold.value =
        -30;

    compressor.knee.value =
        18;

    compressor.ratio.value =
        2.5;

    compressor.attack.value =
        .01;

    compressor.release.value =
        .45;

    input.connect(compressor);

    compressor.connect(
        ctx.destination
    );

    maraMaster =
        input;

    return input;

}


/* =====================================================
   GLASS NOTE
===================================================== */

function maraGlassNote(
    ctx,
    output,
    frequency,
    start,
    duration,
    volume = .045
) {

    const osc =
        ctx.createOscillator();

    const harmonic =
        ctx.createOscillator();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();

    osc.type =
        "sine";

    harmonic.type =
        "sine";

    osc.frequency.setValueAtTime(
        frequency,
        start
    );

    harmonic.frequency.setValueAtTime(
        frequency * 2,
        start
    );

    filter.type =
        "lowpass";

    filter.frequency.setValueAtTime(
        2800,
        start
    );

    filter.Q.value =
        .8;

    gain.gain.setValueAtTime(
        .0001,
        start
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        start + .018
    );

    gain.gain.exponentialRampToValueAtTime(
        volume * .28,
        start + duration * .22
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + duration
    );

    osc.connect(filter);

    harmonic.connect(filter);

    filter.connect(gain);

    gain.connect(output);

    osc.start(start);

    harmonic.start(start);

    osc.stop(
        start + duration + .05
    );

    harmonic.stop(
        start + duration + .05
    );

}


/* =====================================================
   WARM GLASS PAD
===================================================== */

function maraGlassPad(
    ctx,
    output,
    frequency,
    start,
    duration
) {

    const osc1 =
        ctx.createOscillator();

    const osc2 =
        ctx.createOscillator();

    const filter =
        ctx.createBiquadFilter();

    const gain =
        ctx.createGain();

    osc1.type =
        "sine";

    osc2.type =
        "triangle";

    osc1.frequency.value =
        frequency;

    osc2.frequency.value =
        frequency * 1.002;

    filter.type =
        "lowpass";

    filter.frequency.value =
        1200;

    gain.gain.setValueAtTime(
        .0001,
        start
    );

    gain.gain.exponentialRampToValueAtTime(
        .018,
        start + 1.1
    );

    gain.gain.exponentialRampToValueAtTime(
        .009,
        start + duration * .6
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + duration
    );

    osc1.connect(filter);

    osc2.connect(filter);

    filter.connect(gain);

    gain.connect(output);

    osc1.start(start);

    osc2.start(start);

    osc1.stop(
        start + duration + .1
    );

    osc2.stop(
        start + duration + .1
    );

}


/* =====================================================
   DIGITAL TICK
===================================================== */

function maraGlassTick(
    ctx,
    output,
    frequency,
    start
) {

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type =
        "sine";

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        start
    );

    gain.gain.exponentialRampToValueAtTime(
        .018,
        start + .012
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + .18
    );

    osc.connect(gain);

    gain.connect(output);

    osc.start(start);

    osc.stop(
        start + .2
    );

}


/* =====================================================
   CRYSTAL SWEEP
===================================================== */

function maraCrystalSweep(
    ctx,
    output,
    start
) {

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    const filter =
        ctx.createBiquadFilter();

    osc.type =
        "sine";

    osc.frequency.setValueAtTime(
        520,
        start
    );

    osc.frequency.exponentialRampToValueAtTime(
        980,
        start + .8
    );

    filter.type =
        "lowpass";

    filter.frequency.value =
        1900;

    gain.gain.setValueAtTime(
        .0001,
        start
    );

    gain.gain.exponentialRampToValueAtTime(
        .022,
        start + .25
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        start + 1
    );

    osc.connect(filter);

    filter.connect(gain);

    gain.connect(output);

    osc.start(start);

    osc.stop(
        start + 1.05
    );

}


/* =====================================================
   MARA SIGNATURE
===================================================== */

function maraGlassSignature(
    ctx,
    output,
    start
) {

    const notes = [

        {
            frequency: 261.63,
            delay: 0,
            volume: .032
        },

        {
            frequency: 329.63,
            delay: .10,
            volume: .035
        },

        {
            frequency: 392.00,
            delay: .20,
            volume: .038
        },

        {
            frequency: 523.25,
            delay: .32,
            volume: .042
        }

    ];


    notes.forEach(
        note => {

            maraGlassNote(
                ctx,
                output,
                note.frequency,
                start + note.delay,
                1.65,
                note.volume
            );

        }
    );

}


/* =====================================================
   PLAY AUDIO
===================================================== */

async function playMaraLuxuryGlass() {

    if (maraAudioStarted) {

        return;

    }


    const ctx =
        getMaraAudioContext();


    if (!ctx) {

        return;

    }


    try {

        if (ctx.state === "suspended") {

            await ctx.resume();

        }

    } catch (error) {

        console.warn(
            "[MARA AUDIO]",
            error
        );

        return;

    }


    const master =
        createMaraMaster(ctx);

    const now =
        ctx.currentTime;

    maraAudioStarted =
        true;


    maraGlassPad(
        ctx,
        master,
        65.41,
        now,
        8
    );


    maraGlassPad(
        ctx,
        master,
        98,
        now + 1.2,
        6.8
    );


    maraGlassNote(
        ctx,
        master,
        261.63,
        now + .65,
        2.0,
        .035
    );


    maraGlassNote(
        ctx,
        master,
        329.63,
        now + 1.25,
        2.0,
        .038
    );


    maraGlassNote(
        ctx,
        master,
        392.00,
        now + 1.85,
        2.1,
        .041
    );


    maraGlassTick(
        ctx,
        master,
        659.25,
        now + 2.65
    );


    maraGlassTick(
        ctx,
        master,
        783.99,
        now + 3.15
    );


    maraGlassTick(
        ctx,
        master,
        880,
        now + 3.65
    );


    maraCrystalSweep(
        ctx,
        master,
        now + 3.9
    );


    maraGlassSignature(
        ctx,
        master,
        now + 5.15
    );


    console.log(
        "[MARA AUDIO] Luxury Glass aktif."
    );

}


async function unlockMaraAudio() {

    if (maraAudioStarted) {

        return;

    }


    try {

        await playMaraLuxuryGlass();

    } catch (error) {

        console.warn(
            "[MARA AUDIO]",
            error
        );

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles() {

    const overlay =

        );


    if (!overlay) {

    }

/* =====================================================
   SPINNER CONTROLLER
===================================================== */

const maraSpinner = {

    element:
        document.getElementById(
            "mara-update-spinner"
        ),

    text:
        document.getElementById(
            "spinner-text"
        ),

    subtext:
        document.getElementById(
            "spinner-subtext"
        ),


    show() {

        if (!this.element) {
            return;
        }

        this.element.classList.add(
            "show"
        );

    },


    hide() {

        if (!this.element) {
            return;
        }

        this.element.classList.remove(
            "show"
        );

    },


    state(state) {

        if (!this.element) {
            return;
        }

        this.element.classList.remove(
            "success",
            "update",
            "error"
        );

        if (state) {

            this.element.classList.add(
                state
            );

        }

    },


    setStatus(
        main,
        sub
    ) {

        if (this.text) {

            this.text.textContent =
                main;

        }

        if (this.subtext) {

            this.subtext.textContent =
                sub;

        }

    }

};


/* =====================================================
   WAIT
===================================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   UPDATE MANIFEST
===================================================== */

async function loadMaraManifest() {

    const response =
        await fetch(
            MARA_CONFIG.updateManifestURL,
            {
                method: "GET",
                cache: "no-store",
                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "Manifest HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if (
        !data ||
        typeof data !== "object"
    ) {

        throw new Error(
            "Manifest tidak valid."
        );

    }


    if (
        data.version === undefined ||
        data.build === undefined
    ) {

        throw new Error(
            "Manifest tidak mempunyai version/build."
        );

    }


    if (
        !Array.isArray(data.files)
    ) {

        throw new Error(
            "Manifest tidak mempunyai daftar files."
        );

    }


    return data;

}


/* =====================================================
   TAMPILKAN VERSION
===================================================== */

function displayMaraManifest(
    manifest
) {

    const versionElement =
        document.getElementById(
            "mara-version"
        );

    const buildElement =
        document.getElementById(
            "mara-build"
        );


    if (versionElement) {

        versionElement.textContent =
            String(
                manifest.version
            );

    }


    if (buildElement) {

        buildElement.textContent =
            String(
                manifest.build
            );

    }


    window.MARA_REMOTE_STATUS = {

        version:
            String(
                manifest.version
            ),

        build:
            String(
                manifest.build
            ),

        manifest:
            manifest,

        timestamp:
            Date.now()

    };

}


/* =====================================================
   CEK / JALANKAN UPGRADE ENGINE
===================================================== */

async function runMaraUpgrade(
    manifest
) {

    /*
     * Jika upgrade-engine.js memiliki API:
     *
     * window.MARAUpgrade.install(manifest)
     *
     * maka intro akan menyerahkan seluruh proses
     * kepadanya.
     */

    if (
        window.MARAUpgrade &&
        typeof
            window.MARAUpgrade.install
            === "function"
    ) {

        maraSpinner.show();

        maraSpinner.state(
            "update"
        );

        maraSpinner.setStatus(
            "INSTALLING UPDATE",
            "MARA OS sedang menyiapkan build " +
            manifest.build
        );


        await
            window.MARAUpgrade.install(
                manifest,
                {

                    onStatus:
                        function(
                            main,
                            sub
                        ) {

                            maraSpinner.setStatus(
                                main,
                                sub
                            );

                        }

                }
            );


        maraSpinner.state(
            "success"
        );

        maraSpinner.setStatus(
            "UPDATE COMPLETE",
            "Build " +
            manifest.build +
            " aktif"
        );


        await wait(
            MARA_CONFIG.spinnerMinDuration
        );


        maraSpinner.hide();

        return true;

    }


    /*
     * Jika engine belum dipasang,
     * jangan membuat intro gagal.
     *
     * Manifest tetap berhasil dibaca.
     */

    console.warn(
        "[MARA UPDATE] upgrade-engine.js belum tersedia."
    );


    return false;

}


/* =====================================================
   BOOT MARA
===================================================== */

async function startMaraIntro() {

    console.log(
        "[MARA OS] Luxury Glass Intro dimulai."
    );


    createParticles();


    playMaraLuxuryGlass()
        .catch(
            error => {

                console.warn(
                    "[MARA AUDIO]",
                    error
                );

            }
        );


    /*
     * =================================================
     * REPOSITORY
     * =================================================
     */

    let manifest = null;


    try {

        maraSpinner.show();

        maraSpinner.state(
            "update"
        );

        maraSpinner.setStatus(
            "CHECKING FOR UPDATE",
            "Menghubungkan ke repository"
        );


        /*
         * Ambil engine-single.json
         */

        manifest =
            await loadMaraManifest();


        /*
         * Tampilkan version/build
         */

        displayMaraManifest(
            manifest
        );


        /*
         * Jalankan upgrade engine
         */

        await runMaraUpgrade(
            manifest
        );


    } catch (error) {

        console.error(
            "[MARA UPDATE]",
            error
        );


        window.MARA_REMOTE_STATUS = {

            version:
                null,

            build:
                null,

            error:
                true,

            message:
                error.message,

            timestamp:
                Date.now()

        };


        /*
         * Jika repository gagal,
         * jangan langsung merusak boot.
         *
         * Build yang sudah aktif di IndexedDB
         * nantinya dapat digunakan oleh engine.
         */

        maraSpinner.state(
            "error"
        );

        maraSpinner.setStatus(
            "OFFLINE MODE",
            "Menggunakan build lokal"
        );


        await wait(
            MARA_CONFIG.spinnerMinDuration
        );


        maraSpinner.hide();

    }


    /*
     * =================================================
     * INTRO TIMER
     * =================================================
     *
     * Intro tidak boleh ditutup sebelum proses
     * repository/upgrade yang dipanggil di atas
     * selesai.
     */

    await wait(
        MARA_CONFIG.introDuration
    );


    const intro =
        document.getElementById(
            "intro-overlay"
        );


    if (intro) {

        intro.classList.add(
            "hide"
        );

    }


    console.log(
        "[MARA OS] Intro selesai."
    );

}


/* =====================================================
   DOM READY
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        startMaraIntro()
            .catch(
                error => {

                    console.error(
                        "[MARA OS] Boot error:",
                        error
                    );

                }
            );

    }
);


/* =====================================================
   MOBILE AUDIO FALLBACK
===================================================== */

[
    "pointerdown",
    "touchstart",
    "keydown"

].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            unlockMaraAudio,
            {
                once: true,

                passive:
                    eventName !==
                    "keydown"
            }
        );

    }
);
