<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>MARA OS — App Container</title>


    <style>

        /* =================================================
           MARA OS — APP CONTAINER
        ================================================= */

        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color:
                transparent;

        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

        }


        /* =================================================
           APP CONTAINER
        ================================================= */

        .app-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            background: #ffffff;

            overflow: hidden;

        }


        /* =================================================
           APPLICATION AREA
        ================================================= */

        .app-content {

            position: relative;

            flex: 1;

            width: 100%;

            min-height: 0;

            background: #ffffff;

            overflow: hidden;

        }


        /* =================================================
           APPLICATION IFRAME
        ================================================= */

        .app-frame {

            display: block;

            width: 100%;
            height: 100%;

            border: 0;

            margin: 0;
            padding: 0;

            background: #ffffff;

        }


        /* =================================================
           MARA NAVIGATION
        ================================================= */

        .app-navigation {

            position: relative;

            z-index: 100;

            width: 100%;

            height: 64px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-around;

            padding:
                6px 25px;

            background:
                #ffffff;

            border-top:
                1px solid
                rgba(0,0,0,.08);

        }


        /* =================================================
           NAV BUTTON
        ================================================= */

        .nav-button {

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                transparent;

            color:
                #202124;

            font-size: 27px;

            line-height: 1;

            cursor: pointer;

            transition:
                transform .12s ease,
                background .15s ease;

        }


        .nav-button:active {

            transform:
                scale(.88);

            background:
                rgba(0,0,0,.08);

        }


        /* =================================================
           HOME BUTTON
        ================================================= */

        .nav-home {

            font-size: 20px;

        }


        /* =================================================
           RECENT BUTTON
        ================================================= */

        .nav-recent {

            font-size: 22px;

        }


        /* =================================================
           LOADING
        ================================================= */

        .app-loading {

            position: absolute;

            inset: 0;

            z-index: 10;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                #ffffff;

        }


        .app-loading.show {

            display: flex;

        }


        .loading-content {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 12px;

            color:
                #555;

            font-size: 13px;

        }


        .loading-spinner {

            width: 30px;
            height: 30px;

            border-radius: 50%;

            border:
                3px solid
                #e5e7eb;

            border-top-color:
                #2563eb;

            animation:
                maraSpin .8s linear infinite;

        }


        @keyframes maraSpin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =================================================
           ERROR
        ================================================= */

        .app-error {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                #ffffff;

            text-align: center;

        }


        .app-error.show {

            display: flex;

        }


        .error-content {

            max-width: 320px;

        }


        .error-icon {

            font-size: 45px;

            margin-bottom: 15px;

        }


        .error-title {

            font-size: 18px;

            font-weight: 600;

            color:
                #202124;

        }


        .error-message {

            margin-top: 8px;

            font-size: 12px;

            line-height: 1.6;

            color:
                #777;

        }


        /* =================================================
           DARK MODE
        ================================================= */

        .app-container.dark {

            background:
                #07111f;

        }


        .app-container.dark
        .app-content {

            background:
                #07111f;

        }


        .app-container.dark
        .app-navigation {

            background:
                #07111f;

            border-top-color:
                rgba(255,255,255,.10);

        }


        .app-container.dark
        .nav-button {

            color:
                #ffffff;

        }


        .app-container.dark
        .app-loading {

            background:
                #07111f;

            color:
                #ffffff;

        }


        /* =================================================
           SAFE AREA
        ================================================= */

        @supports (
            padding-bottom:
            env(safe-area-inset-bottom)
        ) {

            .app-navigation {

                height:
                    calc(
                        64px +
                        env(safe-area-inset-bottom)
                    );

                padding-bottom:
                    calc(
                        6px +
                        env(safe-area-inset-bottom)
                    );

            }

        }


    </style>

</head>


<body>

    <!-- =================================================
         MARA OS — APPLICATION CONTAINER
    ================================================= -->

    <div
        id="app-container"
        class="app-container">

 <div style= "background-color:black;  
          
            
            height:30px;
            width:100%;
             z-index: 9999;
            "></div>

        <!-- =============================================
             AREA APLIKASI
        ============================================== -->

        <main
            id="app-content"
            class="app-content">


            <!-- =========================================
                 LOADING
            ========================================== -->

            <div
                id="app-loading"
                class="app-loading">

                <div
                    class="loading-content">

                    <div
                        class="loading-spinner">
                    </div>

                    <div>
                        Membuka aplikasi...
                    </div>

                </div>

            </div>


            <!-- =========================================
                 ERROR
            ========================================== -->

            <div
                id="app-error"
                class="app-error">

                <div
                    class="error-content">

                    <div
                        class="error-icon">
                        ⚠
                    </div>

                    <div
                        class="error-title">
                        Aplikasi tidak dapat dibuka
                    </div>

                    <div
                        id="app-error-message"
                        class="error-message">
                    </div>

                </div>

            </div>


            <!-- =========================================
                 APPLICATION
                 IFRAME AKAN DIMASUKKAN DI SINI
            ========================================== -->

        </main>


        <!-- =================================================
             MARA OS — 3 BUTTON NAVIGATION
        ================================================== -->

        <nav
            class="app-navigation">


            <!-- BACK -->

            <button
                type="button"
                class="nav-button nav-back"
                aria-label="Kembali"
                onclick="appBack()">

                ‹

            </button>


            <!-- HOME -->

            <button
                type="button"
                class="nav-button nav-home"
                aria-label="Home"
                onclick="appHome()">

                ●

            </button>


            <!-- RECENT -->

            <button
                type="button"
                class="nav-button nav-recent"
                aria-label="Aplikasi terbaru"
                onclick="appRecent()">

                ▢

            </button>


        </nav>


    </div>


    <!-- =================================================
         MARA OS JAVASCRIPT
    ================================================== -->

    <script src="../js/mara-apps.js"></script>

    <script src="../js/mara-manifest.js"></script>

    <script src="../js/app-container.js"></script>


</body>

</html>
