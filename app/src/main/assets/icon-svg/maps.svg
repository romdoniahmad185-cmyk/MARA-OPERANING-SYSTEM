<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="512"
    height="512"
    fill="none"
>

    <defs>

        <!-- GRADIENT MARA MAPS -->
        <linearGradient
            id="mapsGradient"
            x1="90"
            y1="430"
            x2="420"
            y2="70"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#0757D9"/>
            <stop offset="35%" stop-color="#087FF5"/>
            <stop offset="65%" stop-color="#00AEEF"/>
            <stop offset="100%" stop-color="#43D8FF"/>
        </linearGradient>

        <!-- PIN HIGHLIGHT -->
        <linearGradient
            id="pinHighlight"
            x1="180"
            y1="130"
            x2="330"
            y2="390"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#D9F7FF"/>
        </linearGradient>

        <!-- GLOW -->
        <filter
            id="mapsGlow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%"
        >

            <feGaussianBlur
                stdDeviation="10"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

        </filter>

    </defs>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <rect
        x="42"
        y="42"
        width="428"
        height="428"
        rx="105"
        fill=""
    />


    <!-- =========================================
         MAP GLOW
    ========================================== -->

    <circle
        cx="256"
        cy="245"
        r="155"
        fill="#008CFF"
        opacity=".12"
        filter="url(#mapsGlow)"
    />


    <!-- =========================================
         PIN MARA MAPS
    ========================================== -->

    <path
        d="
            M256 88

            C170 88
             112 153
             112 229

            C112 333
             207 406
             256 438

            C305 406
             400 333
             400 229

            C400 153
             342 88
             256 88

            Z
        "

        fill="url(#mapsGradient)"

        filter="url(#mapsGlow)"
    />


    <!-- =========================================
         PIN INNER AREA
    ========================================== -->

    <circle
        cx="256"
        cy="225"
        r="91"
        fill="url(#pinHighlight)"
    />


    <!-- =========================================
         LOCATION DOT
    ========================================== -->

    <circle
        cx="256"
        cy="225"
        r="45"
        fill="url(#mapsGradient)"
    />


    <circle
        cx="256"
        cy="225"
        r="18"
        fill="#FFFFFF"
    />


    <!-- =========================================
         MAP ROAD / PATH
    ========================================== -->

    <path
        d="
            M135 305
            C180 280 202 315 238 305
            C274 295 295 258 327 268
            C350 275 366 293 380 310
        "

        stroke="#FFFFFF"
        stroke-width="9"
        stroke-linecap="round"

        opacity=".32"
    />


    <!-- =========================================
         MAP ROAD 2
    ========================================== -->

    <path
        d="
            M175 150
            C205 180 215 204 205 235
            C195 265 177 280 165 315
        "

        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"

        opacity=".20"
    />


    <!-- =========================================
         PIN HIGHLIGHT
    ========================================== -->

    <path
        d="
            M175 140
            C205 115 235 108 263 108
        "

        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"

        opacity=".35"
    />


    <!-- =========================================
         SMALL MAP MARKERS
    ========================================== -->

    <circle
        cx="145"
        cy="275"
        r="7"
        fill="#FFFFFF"
        opacity=".75"
    />

    <circle
        cx="365"
        cy="190"
        r="7"
        fill="#FFFFFF"
        opacity=".75"
    />

    <circle
        cx="337"
        cy="330"
        r="6"
        fill="#FFFFFF"
        opacity=".55"
    />


    <!-- =========================================
         SPARKLE
    ========================================== -->

    <path
        d="
            M365 115
            L371 132
            L388 138
            L371 144
            L365 161
            L359 144
            L342 138
            L359 132
            Z
        "

        fill="#FFFFFF"
        opacity=".9"
    />

</svg>