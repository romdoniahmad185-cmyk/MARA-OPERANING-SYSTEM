<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="512"
    height="512"
    fill="none"
>

    <defs>

        <!-- =========================================
             GRADIENT MARA GAME
        ========================================== -->

        <linearGradient
            id="gameGradient"
            x1="80"
            y1="430"
            x2="430"
            y2="80"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="35%" stop-color="#6366F1"/>
            <stop offset="65%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#C084FC"/>
        </linearGradient>


        <!-- =========================================
             GLOW
        ========================================== -->

        <filter
            id="gameGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >

            <feGaussianBlur
                stdDeviation="8"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

        </filter>

    </defs>


  



    <!-- =========================================
         GAMEPAD BODY
    ========================================== -->

    <path
        d="
            M150 188

            C119 188
             96 215
             89 252

            L72 339

            C66 370
             88 394
             117 394

            C135 394
             149 385
             161 368

            L191 325

            H321

            L351 368

            C363 385
             377 394
             395 394

            C424 394
             446 370
             440 339

            L423 252

            C416 215
             393 188
             362 188

            Z
        "

        fill="url(#gameGradient)"

        filter="url(#gameGlow)"
    />


    <!-- =========================================
         GAMEPAD INNER
    ========================================== -->

    <path
        d="
            M157 215
            H355
            C378 215 393 234 398 258
            L410 326

            C413 342 403 355 388 355

            C378 355 371 350 365 341

            L333 296

            H179

            L147 341

            C141 350 134 355 124 355

            C109 355 99 342 102 326

            L114 258

            C119 234 134 215 157 215
            Z
        "

        fill="#151936"

        opacity=".72"
    />


