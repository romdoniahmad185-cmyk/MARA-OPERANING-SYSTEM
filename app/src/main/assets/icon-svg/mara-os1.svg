<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 700"
    width="512"
    height="700"
    fill="none"
>

    <defs>

        <!-- =========================================
             MARA OS GRADIENT
        ========================================== -->

        <linearGradient
            id="maraFlow"
            x1="90"
            y1="390"
            x2="420"
            y2="110"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="35%" stop-color="#00C9A7"/>
            <stop offset="70%" stop-color="#00A8A8"/>
            <stop offset="100%" stop-color="#7CFFCB"/>
        </linearGradient>


        <!-- =========================================
             TEXT GRADIENT
        ========================================== -->

        <linearGradient
            id="maraText"
            x1="100"
            y1="0"
            x2="410"
            y2="0"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="50%" stop-color="#00C9A7"/>
            <stop offset="100%" stop-color="#7CFFCB"/>
        </linearGradient>


        <!-- =========================================
             VERSION GRADIENT
        ========================================== -->

        <linearGradient
            id="versionGradient"
            x1="108"
            y1="620"
            x2="404"
            y2="678"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="50%" stop-color="#00C9A7"/>
            <stop offset="100%" stop-color="#7CFFCB"/>
        </linearGradient>


        <!-- =========================================
             MOVING LIGHT
        ========================================== -->

        <linearGradient
            id="movingLight"
            x1="0"
            y1="0"
            x2="1"
            y2="0"
        >
            <stop
                offset="0%"
                stop-color="#FFFFFF"
                stop-opacity="0"
            />

            <stop
                offset="45%"
                stop-color="#FFFFFF"
                stop-opacity=".15"
            />

            <stop
                offset="50%"
                stop-color="#FFFFFF"
                stop-opacity="1"
            />

            <stop
                offset="55%"
                stop-color="#FFFFFF"
                stop-opacity=".15"
            />

            <stop
                offset="100%"
                stop-color="#FFFFFF"
                stop-opacity="0"
            />
        </linearGradient>


        <!-- =========================================
             VERSION CLIP
        ========================================== -->

        <clipPath id="versionClip">

            <rect
                x="108"
                y="620"
                width="296"
                height="58"
                rx="29"
            />

        </clipPath>

    </defs>


    <!-- =================================================
         MARA OS FLOW SYMBOL
    ================================================= -->


    <!-- MAIN FLOW -->

    <path
        d="
            M116 174
            C166 112 242 104 306 139
            C361 169 382 214 358 256
            C334 299 273 313 224 288
            C181 266 164 228 181 194
            C199 158 250 148 291 169
            C326 187 340 218 326 244
        "

        stroke="url(#maraFlow)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <!-- SECOND FLOW -->

    <path
        d="
            M396 338
            C346 400 270 408 206 373
            C151 343 130 298 154 256
            C178 213 239 199 288 224
            C331 246 348 284 331 318
            C313 354 262 364 221 343
            C186 325 172 294 186 268
        "

        stroke="url(#maraFlow)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <!-- CENTRAL CONNECTION -->

    <path
        d="
            M181 256
            C207 237 243 230 276 241
        "

        stroke="#FFFFFF"
        stroke-width="9"
        stroke-linecap="round"
        opacity=".8"
    />


    <!-- CENTRAL LIGHT -->

    <circle
        cx="276"
        cy="241"
        r="7"
        fill="#FFFFFF"
    />


    <!-- =================================================
         MARA
    ================================================= -->

    <text
        x="256"
        y="500"

        text-anchor="middle"

        font-family="Arial, Helvetica, sans-serif"

        font-size="72"

        font-weight="700"

        letter-spacing="-4"

        fill="url(#maraText)"
    >
        MARA
    </text>


    <!-- =================================================
         OS
    ================================================= -->

    <text
        x="398"
        y="500"

        text-anchor="start"

        font-family="Arial, Helvetica, sans-serif"

        font-size="34"

        font-weight="500"

        letter-spacing="2"

        fill="url(#maraText)"
    >
        OS
    </text>


    <!-- =================================================
         VERSION BADGE
    ================================================= -->

    <rect
        x="108"
        y="620"
        width="296"
        height="58"
        rx="29"

        fill="url(#versionGradient)"
    />


    <!-- BADGE BORDER -->

    <rect
        x="108"
        y="620"
        width="296"
        height="58"
        rx="29"

        fill="none"

        stroke="#FFFFFF"

        stroke-width="1.5"

        opacity=".65"
    />


    <!-- =================================================
         MOVING LIGHT
    ================================================= -->

    <g
        clip-path="url(#versionClip)"
    >

        <rect
            x="80"
            y="610"
            width="70"
            height="78"

            rx="35"

            fill="url(#movingLight)"

            opacity=".95"
        >

            <animate
                attributeName="x"

                values="
                    80;
                    440;
                    80
                "

                dur="2.5s"

                repeatCount="indefinite"
            />

        </rect>

    </g>


    <!-- =================================================
         ELEGANT VERSION TEXT
    ================================================= -->

    <text
        x="256"
        y="657"

        text-anchor="middle"

        font-family="Arial, Helvetica, sans-serif"

        font-size="22"

        font-weight="300"

        letter-spacing="6"

        fill="#FFFFFF"

        opacity=".96"
    >
        V.1.0.0
    </text>


</svg>