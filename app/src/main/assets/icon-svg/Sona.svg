<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="512"
    height="512"
    fill="none"
>

    <defs>

        <!-- GRADIENT SONA -->
        <linearGradient
            id="sonaGradient"
            x1="80"
            y1="430"
            x2="430"
            y2="70"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#16A34A"/>
            <stop offset="45%" stop-color="#22C55E"/>
            <stop offset="75%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#86EFAC"/>
        </linearGradient>

        <!-- GLOW -->
        <filter
            id="sonaGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >

            <feGaussianBlur
                stdDeviation="7"
                result="blur"
            />

            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>

        </filter>

    </defs>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <rect
        x="42"
        y="42"
        width="428"
        height="428"
        rx="108"
        fill="#07120B"
    />


    <!-- =========================================
         GREEN CIRCLE
    ========================================== -->

    <circle
        cx="256"
        cy="256"
        r="168"
        fill="url(#sonaGradient)"
    />


    <!-- =========================================
         SOFT GLOW
    ========================================== -->

    <circle
        cx="256"
        cy="256"
        r="168"
        fill="none"
        stroke="#22C55E"
        stroke-width="12"
        opacity=".25"
        filter="url(#sonaGlow)"
    />


    <!-- =========================================
         SONA SOUND WAVE 1
    ========================================== -->

    <path
        d="
            M150 215
            C205 185 307 185 362 215
        "

        stroke="#FFFFFF"
        stroke-width="22"
        stroke-linecap="round"

        opacity=".98"
    />


    <!-- =========================================
         SONA SOUND WAVE 2
    ========================================== -->

    <path
        d="
            M164 256
            C215 230 297 230 348 256
        "

        stroke="#FFFFFF"
        stroke-width="22"
        stroke-linecap="round"

        opacity=".95"
    />


    <!-- =========================================
         SONA SOUND WAVE 3
    ========================================== -->

    <path
        d="
            M184 297
            C225 278 287 278 328 297
        "

        stroke="#FFFFFF"
        stroke-width="22"
        stroke-linecap="round"

        opacity=".92"
    />


    <!-- =========================================
         SONA CENTER DOT
    ========================================== -->

    <circle
        cx="256"
        cy="337"
        r="12"
        fill="#FFFFFF"
    />


    <!-- =========================================
         HIGHLIGHT
    ========================================== -->

    <path
        d="
            M150 215
            C205 185 307 185 362 215
        "

        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"

        opacity=".45"
    />

</svg>