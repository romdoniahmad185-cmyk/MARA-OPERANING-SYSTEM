<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#ffffff">

    <meta
        name="background-color"
        content="#ffffff">

    <link
        rel="manifest"
        href="./manifest.json">

    <title>MARA OS</title>


    <style>

        /* =========================================
           MARA OS — APPLICATION SHELL
        ========================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            -webkit-tap-highlight-color:
                transparent;

        }


        html,
        body {

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #ffffff;

        }


        body {

            width: 100vw;

            height: 100vh;

            background: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =========================================
           APPLICATION CONTAINER
        ========================================= */

        #mara-app {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background: #ffffff;

            overflow: hidden;

        }

    </style>

</head>


<body>


    <!-- =========================================
         MARA OS APPLICATION
    ========================================= -->

    <main id="mara-app">

        <!--
            MARA OS KOSONG

            Layar aplikasi akan dibangun
            di dalam container ini.

        -->

    </main>


    <script>

        /* =========================================
           MARA OS — BASIC APPLICATION
        ========================================= */

        "use strict";


        /*
         * Saat ini sengaja tidak ada
         * tampilan tambahan.
         *
         * MARA OS hanya menampilkan
         * layar putih kosong.
         */


        console.log(
            "MARA OS berhasil dibuka."
        );


        /* =========================================
           SERVICE WORKER
        ========================================= */

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .then(
                            function (registration) {

                                console.log(
                                    "MARA OS Service Worker aktif:",
                                    registration.scope
                                );

                            }
                        )
                        .catch(
                            function (error) {

                                console.error(
                                    "MARA OS Service Worker gagal:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>

</html>
