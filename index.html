<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =========================================
         BASIC
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="background-color"
        content="#000000"
    >

    <!-- =========================================
         PWA
    ========================================== -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="MARA OS"
    >

    <!-- =========================================
         TITLE
    ========================================== -->

    <title>MARA OS</title>


    <!-- =========================================
         CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =========================================
         MARA LOCK SCREEN
    ========================================== -->

    <iframe
        id="maraLockFrame"
        class="mara-iframe"
        src="./ux/lock-screen.html"
        title="MARA OS Lock Screen"
        frameborder="0"
        scrolling="no"
        allow="fullscreen"
    ></iframe>


    <!-- =========================================
         MARA STATUS BAR
    ========================================== -->

    <header
        class="mara-header"
        id="maraHeader"
    >

        <!-- JAM -->

        <div
            class="clock"
            id="clock"
        >
            00:00
        </div>


        <!-- BATTERY -->

        <div
            class="battery"
            id="battery"
            aria-label="Status baterai"
        >

            <span
                id="battery-percent"
            >
                --%
            </span>


            <div
                class="battery-icon"
                aria-hidden="true"
            >

                <div
                    class="battery-level"
                    id="battery-level"
                ></div>

            </div>

        </div>

    </header>


    <!-- =========================================
         CONTROL CENTER
    ========================================== -->

    <div
        id="controlCenterOverlay"
        aria-hidden="true"
    >

        <iframe
            id="controlCenterFrame"
            src="./ux/control-center.html"
            title="MARA OS Control Center"
            frameborder="0"
            scrolling="no"
        ></iframe>

    </div>


    <!-- =========================================
         JAVASCRIPT
         Service Worker didaftarkan dari script.js
    ========================================== -->

    <script
        src="./script.js"
        defer
    ></script>


</body>

</html>
