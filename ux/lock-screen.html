<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover">

    <!-- PATH DARI FOLDER ux/ KE ROOT -->

    <link
        rel="manifest"
        href="../manifest.json">

    <meta
        name="theme-color"
        content="#000000">

    <title>MARA OS — Lock Screen</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #000;

    color: #fff;

    user-select: none;

    touch-action: manipulation;
}


/* =====================================================
   LOCK SCREEN
===================================================== */

.mara-lock-screen {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    overflow: hidden;

    color: #fff;

    background: #000;
}


/* =====================================================
   WALLPAPER
===================================================== */

.mara-wallpaper {

    position: absolute;

    inset: 0;

    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            #3b82f6 0%,
            #172554 35%,
            #020617 75%,
            #000 100%
        );

    transform: scale(1.04);

    transition:
        transform .8s ease;
}


.mara-wallpaper-overlay {

    position: absolute;

    inset: 0;

    z-index: 1;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.10),
            rgba(0,0,0,.20) 45%,
            rgba(0,0,0,.68)
        );
}


/* =====================================================
   STATUS BAR
===================================================== */

.mara-status-bar {

    position: relative;

    z-index: 10;

    width: 100%;

    padding:
        max(14px, env(safe-area-inset-top))
        20px
        0;

    display: none;

    justify-content: space-between;

    align-items: center;

    font-size: 13px;
}


/* =====================================================
   CONTENT
===================================================== */

.mara-lock-content {

    position: relative;

    z-index: 5;

    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    padding:
        7vh
        20px
        20px;
}


/* =====================================================
   CLOCK
===================================================== */

.lock-clock {

    font-size:
        clamp(
            52px,
            16vw,
            82px
        );

    font-weight: 300;

    letter-spacing: -3px;

    line-height: 1;

    text-shadow:
        0 4px 20px
        rgba(0,0,0,.35);
}


/* =====================================================
   DATE
===================================================== */

.lock-date {

    margin-top: 12px;

    font-size: 16px;

    opacity: .9;
}


/* =====================================================
   WEATHER
===================================================== */

.lock-weather {

    margin-top: 18px;

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 15px;

    opacity: .92;
}


/* =====================================================
   PROFILE
===================================================== */

.mara-profile {

    margin-top: 30px;

    display: flex;

    flex-direction: column;

    align-items: center;
}


.profile-avatar {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(255,255,255,.15);

    border:
        2px solid
        rgba(255,255,255,.7);

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    font-size: 25px;
}


.profile-name {

    margin-top: 9px;

    font-size: 15px;

    font-weight: 600;
}


/* =====================================================
   NOTIFICATION
===================================================== */

.lock-notifications {

    width:
        min(100%, 390px);

    margin-top: 25px;
}


.lock-notification {

    display: flex;

    align-items: center;

    gap: 12px;

    padding:
        13px 15px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.14);

    backdrop-filter:
        blur(18px);

    text-align: left;
}


.notification-icon {

    width: 38px;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 12px;

    background:
        rgba(255,255,255,.16);

    font-size: 18px;
}


.notification-content {

    flex: 1;

    display: flex;

    flex-direction: column;

    gap: 3px;
}


.notification-content strong {

    font-size: 13px;
}


.notification-content span {

    font-size: 12px;

    opacity: .8;
}


.lock-notification time {

    font-size: 11px;

    opacity: .65;
}


/* =====================================================
   UNLOCK
===================================================== */

.unlock-area {

    margin-top: auto;

    padding-top: 25px;

    display: flex;

    flex-direction: column;

    align-items: center;

    cursor: pointer;

}


.unlock-arrow {

    font-size: 25px;

    animation:
        unlock-bounce
        1.6s
        ease-in-out
        infinite;
}


.unlock-text {

    margin-top: 5px;

    font-size: 12px;

    opacity: .75;
}


@keyframes unlock-bounce {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-7px);
    }
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.mara-quick-actions {

    position: relative;

    z-index: 10;

    width: 100%;

    padding:
        0
        24px
        max(22px, env(safe-area-inset-bottom));

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.quick-action {

    width: 50px;

    height: 50px;

    border: none;

    border-radius: 50%;

    color: #fff;

    background:
        rgba(255,255,255,.15);

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(15px);

    font-size: 20px;
}


.quick-action:active {

    transform: scale(.91);

    background:
        rgba(255,255,255,.25);
}


/* =====================================================
   PIN PANEL
===================================================== */

.unlock-panel {

    position: absolute;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    background:
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(8px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s ease;
}


.unlock-panel.active {

    opacity: 1;

    pointer-events: auto;
}


.unlock-panel-content {

    width: 100%;

    max-width: 500px;

    min-height: 55%;

    padding:
        28px
        22px
        max(28px, env(safe-area-inset-bottom));

    border-radius:
        30px 30px 0 0;

    background:
        rgba(20,20,25,.94);

    border-top:
        1px solid
        rgba(255,255,255,.12);

    display: flex;

    flex-direction: column;

    align-items: center;

    transform:
        translateY(100%);

    transition:
        transform .3s
        cubic-bezier(.2,.8,.2,1);
}


.unlock-panel.active
.unlock-panel-content {

    transform:
        translateY(0);
}


.unlock-panel-title {

    font-size: 20px;

    font-weight: 600;
}


.unlock-panel-subtitle {

    margin-top: 7px;

    font-size: 13px;

    opacity: .6;
}


/* =====================================================
   PIN
===================================================== */

.pin-indicators {

    display: flex;

    gap: 12px;

    margin-top: 25px;
}


.pin-indicators span {

    width: 11px;

    height: 11px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.2);

    transition:
        .15s ease;
}


.pin-indicators span.active {

    background: #fff;

    transform:
        scale(1.15);
}


.pin-keypad {

    width:
        min(100%, 330px);

    margin-top: 25px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}


.pin-keypad button {

    height: 58px;

    border: none;

    border-radius: 18px;

    color: #fff;

    background:
        rgba(255,255,255,.10);

    font-size: 20px;
}


.pin-keypad button:active {

    transform: scale(.94);

    background:
        rgba(255,255,255,.20);
}


.pin-keypad button:last-child {

    grid-column: 2;
}


.pin-cancel {

    margin-top: 20px;

    padding:
        10px 20px;

    border: none;

    background: transparent;

    color: #fff;

    opacity: .7;

    font-size: 14px;
}


/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) {

    .mara-lock-content {

        padding-top: 4vh;
    }

    .lock-clock {

        font-size: 54px;
    }

    .mara-profile {

        margin-top: 15px;
    }

    .lock-notifications {

        margin-top: 15px;
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>

</head>


<body>


<main
    class="mara-lock-screen">


    <!-- WALLPAPER -->

    <div
        class="mara-wallpaper">
    </div>

    <div
        class="mara-wallpaper-overlay">
    </div>


    <!-- STATUS BAR -->

    <header
        class="mara-status-bar">

        <div
            id="status-time">

            00:00

        </div>

    </header>


    <!-- CONTENT -->

    <section
        class="mara-lock-content">


        <!-- CLOCK -->

        <div
            id="lock-clock"
            class="lock-clock">

            00:00

        </div>


        <!-- DATE -->

        <div
            id="lock-date"
            class="lock-date">

            Memuat tanggal...

        </div>


        <!-- WEATHER -->

        <div
            class="lock-weather">

            <span>
                ☀
            </span>

            <span>
                28°C
            </span>

        </div>


        <!-- PROFILE -->

        <div
            class="mara-profile">

            <div
                class="profile-avatar">

                👤

            </div>

            <div
                class="profile-name">

                Pengguna MARA

            </div>

        </div>


        <!-- NOTIFICATION -->

        <div
            class="lock-notifications">

            <article
                class="lock-notification">

                <div
                    class="notification-icon">

                    ✉

                </div>

                <div
                    class="notification-content">

                    <strong>
                        Remail
                    </strong>

                    <span>
                        Pesan baru
                    </span>

                </div>

                <time>
                    2m
                </time>

            </article>

        </div>


        <!-- UNLOCK -->

        <div
            id="unlock-area"
            class="unlock-area">

            <div
                class="unlock-arrow">

                ↑

            </div>

            <div
                class="unlock-text">

                Geser untuk membuka

            </div>

        </div>

    </section>


    <!-- QUICK ACTIONS -->

    <footer
        class="mara-quick-actions">

        <button
            id="phone-button"
            class="quick-action"
            type="button"
            aria-label="Telepon">

            ☎

        </button>


        <button
            id="camera-button"
            class="quick-action"
            type="button"
            aria-label="Kamera">

            📷

        </button>

    </footer>


    <!-- PIN PANEL -->

    <section
        id="unlock-panel"
        class="unlock-panel"
        aria-hidden="true">

        <div
            class="unlock-panel-content">


            <div
                class="unlock-panel-title">

                Buka MARA OS

            </div>


            <div
                class="unlock-panel-subtitle">

                Masukkan PIN untuk melanjutkan

            </div>


            <!-- INDICATORS -->

            <div
                id="pin-indicators"
                class="pin-indicators">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- KEYPAD -->

            <div
                id="pin-keypad"
                class="pin-keypad">

                <button type="button" data-pin="1">1</button>
                <button type="button" data-pin="2">2</button>
                <button type="button" data-pin="3">3</button>

                <button type="button" data-pin="4">4</button>
                <button type="button" data-pin="5">5</button>
                <button type="button" data-pin="6">6</button>

                <button type="button" data-pin="7">7</button>
                <button type="button" data-pin="8">8</button>
                <button type="button" data-pin="9">9</button>

                <button type="button" data-pin="0">0</button>

            </div>


            <button
                id="pin-cancel"
                class="pin-cancel"
                type="button">

                Batal

            </button>

        </div>

    </section>


</main>


<script>

/* =====================================================
   MARA OS — LOCK SCREEN JS
===================================================== */


/* =====================================================
   CLOCK
===================================================== */

function updateLockClock() {

    const now =
        new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const time =
        `${hours}:${minutes}`;


    const clock =
        document.getElementById(
            "lock-clock"
        );

    const statusTime =
        document.getElementById(
            "status-time"
        );


    if (clock) {

        clock.textContent =
            time;

    }


    if (statusTime) {

        statusTime.textContent =
            time;

    }
}


/* =====================================================
   DATE
===================================================== */

function updateLockDate() {

    const now =
        new Date();

    const date =
        now.toLocaleDateString(
            "id-ID",
            {
                weekday: "long",
                day: "numeric",
                month: "long"
            }
        );


    const element =
        document.getElementById(
            "lock-date"
        );


    if (element) {

        element.textContent =
            date;

    }
}


/* =====================================================
   START CLOCK
===================================================== */

updateLockClock();

updateLockDate();


setInterval(
    updateLockClock,
    1000
);


setInterval(
    updateLockDate,
    60000
);


/* =====================================================
   ELEMENTS
===================================================== */

const unlockArea =
    document.getElementById(
        "unlock-area"
    );

const unlockPanel =
    document.getElementById(
        "unlock-panel"
    );

const pinCancel =
    document.getElementById(
        "pin-cancel"
    );


/* =====================================================
   OPEN PANEL
===================================================== */

function openUnlockPanel() {

    if (!unlockPanel) {
        return;
    }


    unlockPanel.classList.add(
        "active"
    );


    unlockPanel.setAttribute(
        "aria-hidden",
        "false"
    );
}


/* =====================================================
   CLOSE PANEL
===================================================== */

function closeUnlockPanel() {

    if (!unlockPanel) {
        return;
    }


    unlockPanel.classList.remove(
        "active"
    );


    unlockPanel.setAttribute(
        "aria-hidden",
        "true"
    );


    resetPIN();
}


/* =====================================================
   UNLOCK CLICK
===================================================== */

if (unlockArea) {

    unlockArea.addEventListener(
        "click",
        openUnlockPanel
    );

}


/* =====================================================
   SWIPE UP TO OPEN PIN
===================================================== */

let touchStartY = 0;

let touchEndY = 0;


if (unlockArea) {

    unlockArea.addEventListener(
        "touchstart",
        function(event) {

            if (
                event.touches.length
            ) {

                touchStartY =
                    event.touches[0]
                        .clientY;

            }

        },
        {
            passive: true
        }
    );


    unlockArea.addEventListener(
        "touchend",
        function(event) {

            if (
                event.changedTouches.length
            ) {

                touchEndY =
                    event.changedTouches[0]
                        .clientY;

            }


            const distance =
                touchStartY -
                touchEndY;


            if (
                distance > 50
            ) {

                openUnlockPanel();

            }


            touchStartY = 0;
            touchEndY = 0;

        },
        {
            passive: true
        }
    );

}


/* =====================================================
   CANCEL
===================================================== */

if (pinCancel) {

    pinCancel.addEventListener(
        "click",
        closeUnlockPanel
    );

}


/* =====================================================
   PIN
===================================================== */

const correctPIN =
    "1234";

let enteredPIN =
    "";


const pinButtons =
    document.querySelectorAll(
        "[data-pin]"
    );


const indicators =
    document.querySelectorAll(
        "#pin-indicators span"
    );


/* =====================================================
   PIN BUTTON
===================================================== */

pinButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                if (
                    enteredPIN.length >= 4
                ) {

                    return;

                }


                enteredPIN +=
                    button.dataset.pin;


                updatePINIndicators();


                if (
                    enteredPIN.length === 4
                ) {

                    setTimeout(
                        checkPIN,
                        180
                    );

                }

            }
        );

    }
);


/* =====================================================
   INDICATORS
===================================================== */

function updatePINIndicators() {

    indicators.forEach(
        (indicator, index) => {

            indicator.classList.toggle(
                "active",
                index <
                    enteredPIN.length
            );

        }
    );
}


/* =====================================================
   CHECK PIN
===================================================== */

function checkPIN() {

    if (
        enteredPIN ===
        correctPIN
    ) {

        unlockDevice();

        return;

    }


    shakePIN();


    setTimeout(
        resetPIN,
        400
    );
}


/* =====================================================
   RESET PIN
===================================================== */

function resetPIN() {

    enteredPIN =
        "";

    updatePINIndicators();
}


/* =====================================================
   PIN ERROR
===================================================== */

function shakePIN() {

    const panel =
        document.querySelector(
            ".unlock-panel-content"
        );


    if (!panel) {
        return;
    }


    panel.animate(
        [
            {
                transform:
                    "translateX(0)"
            },
            {
                transform:
                    "translateX(-8px)"
            },
            {
                transform:
                    "translateX(8px)"
            },
            {
                transform:
                    "translateX(-5px)"
            },
            {
                transform:
                    "translateX(5px)"
            },
            {
                transform:
                    "translateX(0)"
            }
        ],
        {
            duration: 250
        }
    );
}


/* =====================================================
   UNLOCK
===================================================== */

function unlockDevice() {

    const screen =
        document.querySelector(
            ".mara-lock-screen"
        );


    if (!screen) {

        window.location.href =
            "./home-screen.html";

        return;

    }


    screen.animate(
        [
            {
                opacity: 1,
                transform:
                    "scale(1)"
            },
            {
                opacity: 0,
                transform:
                    "scale(1.04)"
            }
        ],
        {
            duration: 350,
            easing: "ease-in",
            fill: "forwards"
        }
    );


    setTimeout(
        function() {

            /*
             * Karena lock-screen berada
             * di folder ux, path ini benar.
             */

            window.location.href =
                "./home-screen.html";

        },
        350
    );
}


/* =====================================================
   QUICK ACTION
===================================================== */

document
    .getElementById("camera-button")
    ?.addEventListener(
        "click",
        function() {

            alert(
                "MARA Camera"
            );

        }
    );


document
    .getElementById("phone-button")
    ?.addEventListener(
        "click",
        function() {

            alert(
                "MARA Phone"
            );

        }
    );


/* =====================================================
   KEYBOARD PIN
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            /^[0-9]$/.test(
                event.key
            )
        ) {

            const button =
                document.querySelector(
                    `[data-pin="${event.key}"]`
                );


            if (button) {

                button.click();

            }

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeUnlockPanel();

        }

    }
);


/* =====================================================
   PREVENT CONTEXT MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);

</script>

</body>
</html>
